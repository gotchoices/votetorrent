nodeLinker: node-modules
enableGlobalCache: true

# Hoisting limits for React Native
nmHoistingLimits: workspaces

# Peer-warning suppression — metadata-only and reversible.
#
# What is suppressed: @optimystic/quereus-plugin-crypto peer-wants a @quereus/quereus
# range from the crypto plugin's OWN internal quereus-version numbering scheme, which is
# unrelated to the @quereus/quereus this repo pins. The warning is cosmetic — verified
# repeatedly: every QSQL function executes correctly on the pinned quereus, and the
# vote-engine suite passes.
#
# Why the discard is broad rather than scoped to that package: the YN0086 lines are
# generic aggregate summaries ("Some peer dependencies are incorrectly met by your
# project…") that name NO package, so a text-scoped filter cannot match them.
#
# Why nothing narrower works here:
#   - packageExtensions (widening the peer range): does not reach yarn.lock under
#     nodeLinker:node-modules + nmHoistingLimits:workspaces. The lock keeps the narrow
#     range and the peer check still fails.
#   - patch / patch-package: yarn berry does not re-derive peer ranges from a patched
#     manifest, and patch-package's postinstall runs AFTER yarn's resolution-time peer
#     check. The warning still fires either way.
#   The logFilters block below is the only working lever in this repo's configuration.
#
# Guard keeping the broad discard safe: scripts/check-peer-requirements.mjs asserts that
# the observed @optimystic/quereus-plugin-* mismatch set — expanded across folded
# "and N other dependency" summaries via per-requirement detail drill-down — equals
# exactly its KNOWN_ALLOWED entries, and exits non-zero on anything unexpected. That
# restores the signal this discard would otherwise hide. It is ENFORCED, not merely
# available: it runs on every `yarn install` (root postinstall) and before the workspace
# lints (root `lint`). On demand: `yarn lint:peers`.
#
# KNOWN_ALLOWED is version-pinned to the RESOLVED descriptor, so it must be updated
# whenever the @optimystic/* family is bumped. The script prints an
# "INFO: disappeared" hint when a listed mismatch stops showing up.
#
# Verify a warning-free install: yarn install 2>&1 | grep -c YN0086   (expect 0)
#
# Removal trigger: when upstream @optimystic publishes a release whose peer range is
# satisfied by the pinned @quereus/quereus, remove the entry from KNOWN_ALLOWED in
# scripts/check-peer-requirements.mjs AND remove the logFilters block below.
logFilters:
  - code: YN0086
    level: discard

# Package extensions for peer dependencies
packageExtensions:
  "react-native@*":
    peerDependencies:
      "@babel/core": "*"
      "@babel/runtime": "*"
  "@react-native-community/cli-platform-android@*":
    peerDependencies:
      "@react-native/gradle-plugin": "*"
