nodeLinker: node-modules
enableGlobalCache: true

# Hoisting limits for React Native
nmHoistingLimits: workspaces

# D-05/D-04: metadata-only, reversible peer-warning suppression.
#
# Context: @optimystic/quereus-plugin-crypto@0.13.5 and
# quereus-plugin-optimystic@0.13.5 peer-want @quereus/quereus@^0.16.2 but
# VoteTorrent pins 3.3.0. D-04 verified: the warning is cosmetic — all
# QSQL functions execute correctly on quereus 3.3.0 (vote-engine 581 tests
# pass; confirmed across spike sessions 1-3).
#
# Why metadata-first mechanisms cannot clear this warning here:
#   - packageExtensions (peerDependencies union range): does not reach the
#     yarn.lock under nodeLinker:node-modules + nmHoistingLimits:workspaces;
#     yarn.lock keeps the narrow ^0.16.2 range and the peer check still fails.
#   - patch / patch-package: yarn berry does not re-derive peer ranges from a
#     patched manifest; the patched lockfile entry retains the narrow peer
#     range, and patch-package's postinstall runs after yarn's resolution-time
#     peer check — so the warning still fires.
#   The only working lever for a warning-free install in this repo config is
#   the logFilters block below.
#
# Why the discard is broad: the two YN0086 lines are generic aggregate
# summaries ("Some peer dependencies are incorrectly met by your project…" /
# "…by dependencies…") that do NOT name any package, so a text/pattern-scoped
# filter cannot match them. The discard is necessarily project-wide.
#
# Guard keeping the broad discard safe (WR-04): scripts/check-peer-requirements.mjs
# (yarn lint:peers) asserts the @optimystic/quereus-plugin-* mismatch set equals
# exactly the KNOWN_ALLOWED entry and exits non-zero on any unexpected mismatch —
# restoring the signal the broad discard would otherwise hide.
#
# Verify: yarn install 2>&1 | grep -c YN0086   (expect 0)
#
# Removal trigger (D-02): remove the logFilters entry below when a clean upstream
# @optimystic release peers on @quereus/quereus 3.x. Also update KNOWN_ALLOWED in
# scripts/check-peer-requirements.mjs and remove the guard if no longer needed.
logFilters:
  - code: YN0086
    level: discard

# Package extensions for peer dependencies
packageExtensions:
  "react-native@*":
    peerDependencies:
      "@babel/core": "*"
      "@babel/runtime": "*"
  "@react-native-community/cli-platform-android@*":
    peerDependencies:
      "@react-native/gradle-plugin": "*"
