nodeLinker: node-modules
enableGlobalCache: true

# Hoisting limits for React Native
nmHoistingLimits: workspaces

# D-05/D-04: metadata-only, reversible peer-warning suppression.
# @optimystic/quereus-plugin-crypto@0.13.5 and quereus-plugin-optimystic@0.13.5
# peer-want @quereus/quereus@^0.16.2 but VoteTorrent pins 3.3.0.
# D-04 verified: the warning is cosmetic — the QSQL functions execute correctly
# on quereus 3.3.0 (vote-engine 581 tests pass).
# packageExtensions union range is kept for documentation but yarn berry 4 under
# nodeLinker:node-modules requires logFilters to actually silence YN0060.
# Remove these entries when a clean upstream @optimystic release peers on 3.x (D-02).
logFilters:
  - code: YN0060
    pattern: "@optimystic/quereus-plugin-crypto*"
    level: discard
  - code: YN0060
    pattern: "@optimystic/quereus-plugin-optimystic*"
    level: discard

# Package extensions for peer dependencies
packageExtensions:
  "react-native@*":
    peerDependencies:
      "@babel/core": "*"
      "@babel/runtime": "*"
  "@react-native-community/cli-platform-android@*":
    peerDependencies:
      "@react-native/gradle-plugin": "*"
  # D-05: union range on peerDependencies for documentation/resolution layer;
  # the actual warning-suppression is done via logFilters above (berry 4 limitation
  # under nodeLinker: node-modules + nmHoistingLimits: workspaces).
  "@optimystic/quereus-plugin-crypto@*":
    peerDependencies:
      "@quereus/quereus": "^0.16.2 || ^3.0.0"
  "@optimystic/quereus-plugin-optimystic@*":
    peerDependencies:
      "@quereus/quereus": "^0.16.2 || ^3.0.0"
