nodeLinker: node-modules
enableGlobalCache: true

# Hoisting limits for React Native
nmHoistingLimits: workspaces

# D-05/D-04: metadata-only, reversible peer-warning suppression.
#
# Context: @optimystic/quereus-plugin-crypto (single copy 0.14.1 as of Phase 36)
# and quereus-plugin-optimystic@0.13.5 peer-want @quereus/quereus@^0.16.2 (the
# crypto-plugin's OWN internal quereus-version-numbering scheme, NOT the app's
# @quereus/quereus, which is pinned 4.2.1). D-04 verified: the warning is cosmetic
# — all QSQL functions execute correctly on quereus 4.2.1 (vote-engine suite
# passes; confirmed across Phases 33/35/37 and the Phase 36 CID work).
#
# Phase 36 (CID-01, D-01): the two vendored @serfab/* portals were repinned
# @optimystic/quereus-plugin-crypto ^0.13.5 → ^0.14.0, collapsing the former
# dual crypto-copy (0.13.5 strand / 0.14.1 solo) to a single 0.14.1 copy. The
# @npm:0.13.5 crypto entry is gone from KNOWN_ALLOWED. The YN0086 discard below
# STAYS: the ^0.16.2 crypto peer wart (now on 0.14.1) plus the still-present
# quereus-plugin-optimystic@0.13.5 and react-native mismatches keep the
# project-wide YN0086 summary firing — the removal trigger (ALL mismatches gone)
# is not yet met.
#
# Why metadata-first mechanisms cannot clear this warning here:
#   - packageExtensions (peerDependencies union range): does not reach the
#     yarn.lock under nodeLinker:node-modules + nmHoistingLimits:workspaces;
#     yarn.lock keeps the narrow ^0.16.2 range and the peer check still fails.
#   - patch / patch-package: yarn berry does not re-derive peer ranges from a
#     patched manifest; the patched lockfile entry retains the narrow peer
#     range, and patch-package's postinstall runs after yarn's resolution-time
#     peer check — so the warning still fires.
#   The only working lever for a warning-free install in this repo config is
#   the logFilters block below.
#
# Why the discard is broad: the two YN0086 lines are generic aggregate
# summaries ("Some peer dependencies are incorrectly met by your project…" /
# "…by dependencies…") that do NOT name any package, so a text/pattern-scoped
# filter cannot match them. The discard is necessarily project-wide.
#
# Guard keeping the broad discard safe (WR-04): scripts/check-peer-requirements.mjs
# asserts the @optimystic/quereus-plugin-* mismatch set (expanded across folded
# "and N other dependency" summaries via per-requirement detail drill-down) equals
# exactly the KNOWN_ALLOWED entries (quereus-plugin-crypto + quereus-plugin-optimystic,
# both @npm:0.13.5) and exits non-zero on any unexpected mismatch — restoring the signal
# the broad discard would otherwise hide. This guard is ENFORCED, not merely available:
# it runs automatically on every `yarn install` (root package.json `postinstall`) and
# before the workspace lints (root `lint`); `yarn lint:peers` runs it on demand.
#
# Verify: yarn install 2>&1 | grep -c YN0086   (expect 0)
#
# Removal trigger (D-02): remove the logFilters entry below when a clean upstream
# @optimystic release peers on @quereus/quereus 3.x. Also update KNOWN_ALLOWED in
# scripts/check-peer-requirements.mjs and remove the guard if no longer needed.
logFilters:
  - code: YN0086
    level: discard

# Package extensions for peer dependencies
packageExtensions:
  "react-native@*":
    peerDependencies:
      "@babel/core": "*"
      "@babel/runtime": "*"
  "@react-native-community/cli-platform-android@*":
    peerDependencies:
      "@react-native/gradle-plugin": "*"
