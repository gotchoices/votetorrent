function saveScroll(){
  document.querySelectorAll('#stackarea [data-scroll]').forEach(el=>{ S.scrollMem[S.tab+':'+el.dataset.scroll]=el.scrollTop; });
}
function restoreScroll(){
  document.querySelectorAll('#stackarea [data-scroll]').forEach(el=>{ const v=S.scrollMem[S.tab+':'+el.dataset.scroll]; if(v) el.scrollTop=v; });
}
function render(){
  saveScroll();
  document.documentElement.setAttribute('data-theme',S.theme);
  document.documentElement.setAttribute('lang',S.lang);
  const area=document.getElementById('stackarea'), tb=document.getElementById('tabbar');
  let brand=false;
  if(S.boot!=='ready'){
    area.innerHTML='<div class="routeview">'+bootView()+'</div>'; tb.className='hidden';
  } else if(S.retired){
    area.innerHTML='<div class="routeview">'+retiredView()+'</div>'; tb.className='hidden';
  } else {
    const st=stack();
    let base=st.length-1; while(base>0 && ROUTES[st[base]].header==='modal') base--;
    let html='<div class="routeview">'+routeView(st[base],base)+'</div>';
    for(let i=base+1;i<st.length;i++) html+='<div class="routemodal">'+routeView(st[i],i)+'</div>';
    area.innerHTML=html;
    const top=st[st.length-1];
    const hide=(S.tab==='Registration'||S.tab==='Timeline') && REGISTRATION_FULLSCREEN_ROUTES.includes(top);
    tb.className=hide?'hidden':'';
    tb.innerHTML=TABS.map(x=>'<button class="tab'+(S.tab===x.name?' active':'')+'" data-tab="'+x.name+'">'
      +icon(x.glyph,24)+'<span class="tlabel">'+esc(t('common',x.labelKey))+'</span></button>').join('');
    brand = base===st.length-1 && (top==='Home'||top==='RegistrationHome');
  }
  document.getElementById('overlays').innerHTML = (S.dialog?dialogHTML():'') + (S.sheet?PartySheetHTML():'')
    + (S.join.scanner?ScannerHTML():'') + (S.toast?ToastHTML():'') + (S.bio?BioPromptHTML():'');
  paintStatusBar(brand);
  restoreScroll();
  fitCodes();
  /* DeviceAttestationScreen: provisionDeviceKey() resolves → replace('RegisterPersonal') */
  if(S.boot==='ready' && !S.retired && topRoute()==='DeviceAttestation' && !S.attestTerminal && !S._attestArmed){
    S._attestArmed=true;
    later(2200,()=>{ S._attestArmed=false; if(topRoute()==='DeviceAttestation' && !S.attestTerminal) replaceTop('RegisterPersonal'); });
  }
  if(topRoute()!=='DeviceAttestation') S._attestArmed=false;
}

function bioPrompt(ns,key,android,ok,cancel){
  S.bio = key ? {title:t(ns,key+'.title'),subtitle:android?tp(ns,key+'.subtitle'):t(ns,key+'.subtitle'),negative:t(ns,key+'.negativeButton'),ok,cancel}

}

document.addEventListener('click',ev=>{
  const stop=ev.target.closest('[data-stop]');
  const holder=ev.target.closest('[data-act]');
  if(holder){
    if(stop && holder.contains(stop)) return;      // inner Pressable swallows taps on the card
    const fn=ACTIONS[holder.dataset.act];
    if(fn){ ev.preventDefault(); fn(holder); return; }
  }
  const tab=ev.target.closest('[data-tab]');
  if(tab){ switchTab(tab.dataset.tab); return; }
  const dev=ev.target.closest('[data-dev]');
  if(dev){ devGo(dev.dataset.dev); return; }
  const plat=ev.target.closest('[data-plat]');
  if(plat){ S.platform=plat.dataset.plat; buildDrawer(); render(); return; }
});

  if(joinEl){ const j=S.join; j.text=joinEl.value; j.scanNotice=null; if(j.phase==='failed') j.phase='idle'; rerenderKeepFocus('[data-join="text"]'); return; }
  const cadEl=ev.target.closest('[data-cad]');
  if(cadEl){ const f=cadEl.dataset.cad;
    if(f==='code'){ S.cad.code=cadEl.value; if(S.cad.codeError){ S.cad.codeError=null; rerenderKeepFocus('[data-cad="code"]'); } }
    else { S.cad.identity[f]=cadEl.value; if(S.cad.idErrors[f]){ delete S.cad.idErrors[f]; rerenderKeepFocus('[data-cad="'+f+'"]'); } }
    return; }
  const el=ev.target.closest('[data-field]'); if(!el) return;
  const f=el.dataset.field; let v=el.value;
  if(el.dataset.mask==='date'){ v=maskDateInput(v); el.value=v; }
  S.draft[f]=v;
  if(S.errors[f]){ delete S.errors[f]; rerenderKeepFocus('[data-field="'+f+'"]'); }
});
function rerenderKeepFocus(sel){
  const cur=document.querySelector(sel), pos=cur?cur.selectionStart:null; render();

}

const DEV_INDEX={}; DEV_GROUPS.forEach(g=>g.items.forEach(i=>{ DEV_INDEX[i.id]=i; }));
function buildDrawer(){
  const d=document.getElementById('devdrawer');
  const badge=b=>b?'<span class="badge '+(b==='state'?'state':b==='dev'?'dev':'')+'">'+(b==='state'?'state':b==='dev'?'dev only':'unreachable')+'</span>':'';
  d.innerHTML='<div class="dhead"><h2>All screens</h2>'
    +'<button data-act="close-drawer" aria-label="Close" style="background:none;border:0;cursor:pointer;color:var(--text);padding:6px">'+icon('xmark',20)+'</button></div>'
   +'<div class="dbody">'
     +'<div class="dgroup"><h3>Appearance</h3><div class="seg">'
       +'<button data-dev="theme:light" class="'+(S.theme==='light'?'on':'')+'">Light</button>'
       +'<button data-dev="theme:dark" class="'+(S.theme==='dark'?'on':'')+'">Dark</button>'
       +'<button data-dev="lang:en" class="'+(S.lang==='en'?'on':'')+'">English</button>'
       +'<button data-dev="lang:es" class="'+(S.lang==='es'?'on':'')+'">Español</button>'
     +'</div>'
     +'<div class="seg" style="margin-top:8px">'
       +'<button data-plat="ios" class="'+(S.platform==='ios'?'on':'')+'">iOS copy (Face ID)</button>'
       +'<button data-plat="android" class="'+(S.platform==='android'?'on':'')+'">Android copy</button>'
     +'</div>'
     +'<div class="dnote" style="margin-top:10px">Every i18n namespace (common, home, ballot, registration, scan, settings, join, timeline, continuity) is complete in Spanish, so nothing falls back to English through t(). '
       +'The boot screens, the Confirmation buttons and the pending sentence are localized now; the only English left under Español is the dev-only cycler and toggle labels. '
       +'Ballot text, names and the "Learn about" detail are authority-published data and are never translated.</div>'
     +'<div class="dnote">The platform switch picks the biometric copy only (Platform.OS): the base keys name Face ID, the \'.android\' siblings the fingerprint. The OS prompt is drawn as a stand-in — tap the Face ID square or the fingerprint sensor to pass, Cancel or outside to cancel. The frame stays the Pixel 8 chrome.</div>'
     +'<div class="dnote">The ◁ key in the bar under the tabs is Android hardware Back: an OS prompt or the scanner closes first, then dialogs, then the focused stack pops, then a non-first tab returns to Vote.</div></div>'
     +DEV_GROUPS.map(g=>'<div class="dgroup"><h3>'+esc(g.title)+'</h3>'
        +(g.note?'<div class="dnote">'+esc(g.note)+'</div>':'')
        +g.items.map(i=>'<button class="ditem" data-dev="'+i.id+'"><span style="flex:1;min-width:0">'+esc(i.label)
          +(i.sub?'<span class="dsub">'+esc(i.sub)+'</span>':'')+'</span>'+badge(i.badge)+'</button>').join('')
      +'</div>').join('')
     +'<div class="dgroup"><h3>Removed from the app</h3><div class="dnote">The ElectionInfo / OfficeInfo / CandidateInfo routes and the shared PlaceholderModal are gone from source: '
       +'"Learn about this …" is an in-place InfoDialog carrying the authority-published detail, and RegistrationInfo is now a real screen. '
       +'Review & Submit\'s mock "submitted" view and the Home card\'s "You voted" button are gone too: a saved vote lands on the Vote saved receipt, and the card shows the saved-vote line instead.</div></div>'
   +'</div>';
}
ACTIONS['close-drawer']=()=>{ document.getElementById('devdrawer').classList.remove('open'); };
document.getElementById('devfab').addEventListener('click',()=>{ buildDrawer(); document.getElementById('devdrawer').classList.add('open'); });
document.getElementById('devfab').innerHTML=icon('list-check',18,'#fff');

function devGo(id){
  if(id.startsWith('theme:')){ S.theme=id.split(':')[1]; buildDrawer(); render(); return; }
  if(id.startsWith('lang:')){ S.lang=id.split(':')[1]; buildDrawer(); render(); return; }
  const entry=DEV_INDEX[id]; if(!entry) return;
  document.getElementById('devdrawer').classList.remove('open');
  resetProto();
  entry.go();
  const r=topRoute();
  if(r==='ContinueOnAnotherDevice' && S.cad.branch==='resolving') enter(r);
  render();
}
/* Hooks for the verification script (scratch, not used by the page itself). */
window.__proto={ids:()=>Object.keys(DEV_INDEX),go:devGo,set(theme,lang){ S.theme=theme; S.lang=lang; render(); }};

/* boot */
render();
</script>
