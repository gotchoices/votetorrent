<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoteTorrent Voter</title>
<style>
/* ============================================================================
   Design tokens — transcribed verbatim from
   apps/VoteTorrentVoter/src/theme/themes.ts (lightTheme / darkTheme)
   ========================================================================= */
:root{
  --primary:#2196f3; --background:#fbfbfb; --surface:#fcfcfc; --card:#ffffff;
  --text:#000000; --textSecondary:#7d7d7d; --border:#e5e5e5; --notification:#FF3B30;
  --secondary:#000000; --accent:#d9d9d9; --error:#971d1d; --warning:#bcb600;
  --contrast:#262626; --success:#4caf50; --dark:#000000; --light:#ffffff;
  --important:#e8e3ad; --muted:#9e9e9e;
  --link:#2196f3; --progressFill:#34c759; --progressTrack:#e5e5e5;
  --secondaryButtonSurface:#f5f5f5;
  --registerNegative:#ef5644; --registerPositive:#3ebd5d; --validBadge:#e6c200;
  /* radii scale (theme/themes.ts `radii`) */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  /* globalStyles.cardSurface boxShadow (theme/styles.ts) */
  --cardShadow:0px 4px 16px 0px rgba(0,0,0,0.16);
}
:root[data-theme="dark"]{
  --primary:#237ec7; --background:#0d0d0d; --surface:#1c1c1c; --card:#1e1e1e;
  --text:#ebebeb; --textSecondary:#828282; --border:#333333; --notification:#ba1e15;
  --secondary:#ebebeb; --accent:#262626; --error:#d07a7a; --warning:#ece756;
  --contrast:#d9d9d9; --success:#699a6b; --dark:#000000; --light:#ffffff;
  --important:#474421; --muted:#616161;
  --link:#237ec7; --progressFill:#51b269; --progressTrack:#2a2a2a;
  --secondaryButtonSurface:#2a2a2a;
  --registerNegative:#ef5644; --registerPositive:#3ebd5d; --validBadge:#e6c200;
  /* globalStyles.cardSurface uses ONE boxShadow literal for both themes. */
  --cardShadow:0px 4px 16px 0px rgba(0,0,0,0.16);
}

/* Type scale — theme/themes.ts `type` (fontSize / lineHeight). captionSmall is the
   countdown's shrunk label step. */
.t-display{font-size:40px;line-height:48px}
.t-h1{font-size:32px;line-height:40px}
.t-h2{font-size:28px;line-height:34px}
.t-h3{font-size:24px;line-height:30px}
.t-h4{font-size:20px;line-height:26px}
.t-body{font-size:16px;line-height:22px}
.t-caption{font-size:16px;line-height:20px}
.t-captionSmall{font-size:12px;line-height:16px}
.w-regular{font-weight:400}.w-medium{font-weight:500}.w-bold{font-weight:700}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  /* fonts.regular.fontFamily === 'System' in themes.ts */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:#3a3a3c;color:var(--text);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:0;
}
@media (min-width:900px){ body{padding:24px} }

/* ---- Phone frame: Pixel 8 == 412 x 915 dp ---- */
#device{
  width:412px;height:915px;max-width:100vw;max-height:100vh;
  position:relative;overflow:hidden;background:var(--background);
  display:flex;flex-direction:column;
  /* RN <Text> with no fontSize renders at 14 */
  font-size:14px;
}
@media (min-width:900px){
  #device{border-radius:34px;box-shadow:0 24px 70px rgba(0,0,0,.55);border:8px solid #101012;height:931px}
}
@media (max-width:911px){ #device{width:100vw;height:100vh;height:100dvh} }

/* ---- Android status bar ---- */
#statusbar{
  flex:0 0 auto;height:28px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:12px;font-weight:600;
  position:relative;z-index:5;
}
#statusbar .sb-icons{display:flex;gap:5px;align-items:center}

/* ---- stack area: header + body of the focused route, plus modal routes above ---- */
#stackarea{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.routeview{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:var(--background)}
.routebody{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* ---- native-stack header (@react-navigation/native-stack default, Android) ---- */
.navheader{
  flex:0 0 auto;min-height:56px;background:var(--card);
  display:flex;align-items:center;gap:4px;padding:0 4px;
  border-bottom:1px solid var(--border);position:relative;z-index:4;
}
.navheader .hbtn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:0;background:none;color:var(--text);cursor:pointer;border-radius:50%;
}
.navheader .hbtn:active{background:rgba(128,128,128,.18)}
.navheader .htitle{
  font-size:20px;font-weight:500;color:var(--text);
  padding-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;
}
.navheader.has-btn .htitle{padding-left:4px}

.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
.pad16{padding:16px}              /* globalStyles.container */
.fill{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
/* ScrollView contentContainerStyle {flexGrow:1, justifyContent:center, alignItems:center} */
.centercol{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}

/* ---- bottom tab bar (createBottomTabNavigator) ---- */
#tabbar{
  flex:0 0 auto;height:62px;background:var(--card);border-top:1px solid var(--border);
  display:flex;align-items:stretch;position:relative;z-index:4;
}
#tabbar.hidden{display:none}
#tabbar .tab{
  flex:1 1 0;min-width:0;border:0;background:none;cursor:pointer;padding:7px 0 9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--textSecondary);font-family:inherit;
}
#tabbar .tab .tlabel{font-size:12px;font-weight:700;letter-spacing:.1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabbar .tab.active{color:var(--primary)}

/* ---- Android 3-button system navigation (prototype affordance: Back = hardware back) ---- */
#navbar{flex:0 0 auto;height:40px;background:var(--card);display:flex;align-items:center;justify-content:space-around;z-index:4}
#navbar button{width:64px;height:36px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--textSecondary);border-radius:18px}
#navbar button:active{background:rgba(128,128,128,.18)}
#navbar button[disabled]{cursor:default;opacity:.55}

/* ---- shared surfaces ---- */
/* globalStyles.cardSurface */
.cardSurface{
  border-radius:16px;padding:16px;margin:10px 4px;background:var(--card);
  box-shadow:var(--cardShadow);
}
.btn{
  border:0;cursor:pointer;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;
  text-align:center;width:100%;
}
.btn:active{filter:brightness(.94)}
.btn-solid{background:var(--primary);color:var(--light);border-radius:var(--r-pill)}
.btn-outline{
  background:var(--secondaryButtonSurface);color:var(--primary);
  border:1px solid var(--primary);border-radius:var(--r-pill);
}
.inline-btn{width:auto;display:inline-flex}
/* buttons inherit the RN text size of their context; a type class (.t-h4 …) still wins */
button{font-family:inherit;font-size:inherit}
.plain{background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit;text-align:left}

/* ProgressBar */
.pbar{height:8px;border-radius:var(--r-pill);background:var(--progressTrack);overflow:hidden}
.pbar>i{display:block;height:8px;border-radius:var(--r-pill);background:var(--progressFill)}

/* breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.breadcrumb .crumb{font-size:16px;line-height:20px;color:var(--textSecondary);background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.breadcrumb .crumb.current{color:var(--text);font-weight:500;cursor:default}

.ulink{color:var(--link);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;font-size:16px;line-height:20px;text-align:left}

/* ---- modal / dialog layers ---- */
/* RN <Modal> covers the app window: everything between the system status bar and the
   system navigation bar (hardware Back stays reachable and closes it via onRequestClose). */
#overlays{position:absolute;top:28px;left:0;right:0;bottom:40px;z-index:50;pointer-events:none}
#overlays>*{pointer-events:auto}
#overlays:empty{display:none}
.overlay{position:absolute;inset:0;z-index:40;display:flex}
.overlay.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* InfoDialog backdrop */
.dlg-backdrop{background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:0 24px}
.dlg-card{
  width:100%;max-width:420px;background:var(--card);border-radius:var(--r-lg);
  padding:48px 24px 40px;display:flex;flex-direction:column;align-items:center;position:relative;
  max-height:calc(100% - 32px);
}
.dlg-close{position:absolute;top:16px;right:16px;background:none;border:0;cursor:pointer;color:var(--text);padding:0}
.dlg-title{font-size:20px;line-height:26px;font-weight:700;text-align:center;margin:0 0 16px;color:var(--text)}
.dlg-sub{font-size:16px;line-height:22px;font-weight:500;text-align:center;margin:0 0 32px;color:var(--text)}
.dlg-content{align-self:stretch;max-height:320px;margin-bottom:24px;overflow-y:auto;overflow-x:hidden;padding-bottom:4px}
.dlg-body{font-size:16px;line-height:20px;text-align:center;margin:0;color:var(--textSecondary)}
/* PartyDropdown sheet */
.sheet-backdrop{background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:0 24px}
.sheet{width:100%;background:var(--card);border-radius:var(--r-lg);padding:0 16px}
.sheet .opt{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:16px 0;width:100%;
  background:none;border:0;cursor:pointer;font:inherit;color:var(--text);text-align:left;
}
.sheet .opt span{flex:1;font-size:16px;line-height:22px}
.sheet .odiv{height:1px;background:var(--border)}
/* presentation:'modal' route — on Android native-stack this is a full-screen route that
   slides up over the tab's own stack (the tab bar stays below it). Own header with the X. */
.routemodal{
  position:absolute;inset:0;z-index:30;background:var(--background);
  overflow:hidden;display:flex;flex-direction:column;
  animation:slideup .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ---- FieldGroup ---- */
.fgcard{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);padding:0 16px}
/* row paddingVertical 3 + the INPUT's own 44dp min height (the touch target); an error line
   carries marginBottom 13 (components/FieldGroup.tsx) */
.fgrow{padding:3px 0}
.fgrow input{
  width:100%;border:0;outline:0;background:none;padding:0;font-family:inherit;
  font-size:16px;line-height:22px;min-height:44px;color:var(--text);
}
.fgrow input::placeholder{color:var(--textSecondary)}
.fgrow.err input::placeholder{color:var(--error)}
.fgerr{margin-top:4px;font-size:16px;line-height:20px;color:var(--error)}
.fgrow .fgerr{margin-top:0;margin-bottom:13px}
.fgdivider{height:1px;background:var(--border)}

/* ContinueOnAnotherDevice TextInput: borderWidth 1, radius 8, padding 12, minHeight 44 */
.rninput{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;min-height:44px;
  background:none;outline:0;font-family:inherit;font-size:16px;color:var(--text)}
.rninput::placeholder{color:var(--textSecondary)}
.rninput.err::placeholder{color:var(--error)}

/* StepDots */
.stepdots{display:flex;justify-content:center;align-items:center;gap:8px}
.stepdots i{width:8px;height:8px;border-radius:var(--r-pill);background:var(--progressTrack);display:block}
.stepdots i.on{width:24px;background:var(--primary)}

/* ActivityIndicator: size small = 20, size large = 36 */
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--primary);border-top-color:transparent;animation:spin .9s linear infinite;flex:0 0 auto}
.spinner.lg{width:36px;height:36px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Timeline rail (components/TimelineRail.tsx) */
.tl-conn{position:absolute;left:21px;width:2px;display:block}
.tl-dot{position:absolute;display:block;border-radius:50%}
.tl-notch{position:absolute;width:0;height:0;left:-8px;top:21px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:8px solid var(--card)}
.tl-accent{position:absolute;left:0;width:4px;background:var(--primary)}

/* ---- prototype navigator (drawer) — prototype-only affordance ---- */
#devfab{
  position:absolute;right:12px;bottom:112px;z-index:55;width:44px;height:44px;border-radius:50%;
  background:#111;color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);opacity:.88;
}
#devdrawer{position:absolute;inset:0;z-index:60;background:var(--background);display:none;flex-direction:column}
#devdrawer.open{display:flex}
#devdrawer .dhead{
  padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;background:var(--card);gap:8px;
}
#devdrawer .dhead h2{margin:0;font-size:18px;font-weight:700;color:var(--text)}
#devdrawer .dbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 28px}
.dgroup{margin-top:18px}
.dgroup:first-child{margin-top:4px}
.dgroup h3{
  margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--textSecondary);
}
.ditem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:15px;color:var(--text);
}
.ditem:active{background:var(--secondaryButtonSurface)}
.ditem .dsub{display:block;font-size:12px;color:var(--textSecondary);margin-top:2px}
.badge{
  flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:999px;
  background:#fde2df;color:#a02216;text-transform:uppercase;
}
:root[data-theme="dark"] .badge{background:#4a1b16;color:#f0a79c}
.badge.state{background:#e3f0fd;color:#14538f}
:root[data-theme="dark"] .badge.state{background:#14304a;color:#8ec4f5}
.badge.dev{background:#f6f1c7;color:#5f5a00}
:root[data-theme="dark"] .badge.dev{background:#3d3a12;color:#ece756}
.dnote{font-size:12px;line-height:17px;color:var(--textSecondary);margin:2px 0 10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:78px;min-height:38px;padding:0 12px;border-radius:var(--r-pill);cursor:pointer;
  background:var(--secondaryButtonSurface);color:var(--textSecondary);border:1px solid var(--border);
  font-family:inherit;font-size:14px;
}
.seg button.on{background:var(--primary);color:var(--light);border-color:var(--primary);font-weight:700}
</style>
</head>
<body>

<div id="device">
  <div id="statusbar">
    <span id="sb-clock">10:30</span>
    <span class="sb-icons" id="sb-icons"></span>
  </div>
  <div id="stackarea"></div>
  <div id="tabbar"></div>
  <div id="navbar">
    <button id="nav-back" aria-label="Back (hardware back)" title="Back (Android hardware back)"></button>
    <button id="nav-home" aria-label="Home" disabled></button>
    <button id="nav-recents" aria-label="Recents" disabled></button>
  </div>
  <!-- RN <Modal> renders above the whole app window — header + tab bar included, system bars excluded. -->
  <div id="overlays"></div>
  <button id="devfab" title="All screens (prototype navigator)" aria-label="All screens"></button>
  <div id="devdrawer" role="dialog" aria-label="All screens"></div>
</div>

<script>
"use strict";
/* ============================================================================
 * VoteTorrent — Voter app · interactive HTML recreation
 *
 * Source of truth: apps/VoteTorrentVoter/src
 *   navigation/index.tsx + types.ts · theme/themes.ts + styles.ts · i18n/index.ts
 *   providers/** · screens/** · components/** · timeline/** (+ packages/ui-web
 *   src/lifecycle/timeline-core.js, ported below)
 *
 * Topology (navigation/index.tsx): the RootNavigator IS the bottom Tab.Navigator — five
 * tabs in locked order Vote · Timeline · Registration · Scan · Settings. Each tab owns its
 * own native stack; every push and every presentation:'modal' route lives INSIDE that tab's
 * stack, so the tab bar stays visible except on the register-flow routes it is explicitly
 * hidden for. The Timeline stack re-registers Ballot / IndividualQuestion / ReviewSubmit /
 * VoteReceipt / RegistrationHome / RegistrationInfo / the register flow / ContinueOnAnotherDevice /
 * JoinNetwork so a row action pushes within Timeline and Back returns to the rail, and adds
 * Keyholders and Results. VoteReceipt lives on the Vote stack too; JoinNetwork on the Settings and
 * Registration stacks too. A retired device replaces the WHOLE tab navigator with
 * DeviceRetiredNotice. A ToastProvider wraps the navigator (one app-wide toast).
 * ========================================================================= */

  'gear': '<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4c0-.5 0-1-.1-1.5l2-1.5a.7.7 0 0 0 .2-.9l-1.9-3.3a.7.7 0 0 0-.8-.3l-2.4.9a8.8 8.8 0 0 0-2.5-1.5l-.4-2.5a.7.7 0 0 0-.7-.6h-3.8a.7.7 0 0 0-.7.6l-.4 2.5a8.8 8.8 0 0 0-2.5 1.5l-2.4-.9a.7.7 0 0 0-.8.3L2.5 8.1a.7.7 0 0 0 .2.9l2 1.5a9 9 0 0 0 0 3l-2 1.5a.7.7 0 0 0-.2.9l1.9 3.3c.2.3.5.4.8.3l2.4-.9c.8.6 1.6 1.1 2.5 1.5l.4 2.5c0 .3.4.6.7.6h3.8c.3 0 .6-.3.7-.6l.4-2.5c.9-.4 1.7-.9 2.5-1.5l2.4.9c.3.1.6 0 .8-.3l1.9-3.3a.7.7 0 0 0-.2-.9l-2-1.5c.1-.5.1-1 .1-1.5z"/>',
  'bell': '<path d="M12 2a1.6 1.6 0 0 1 1.6 1.6v.8A6.5 6.5 0 0 1 18.5 11v3.2l1.8 2.6a1 1 0 0 1-.8 1.6H4.5a1 1 0 0 1-.8-1.6l1.8-2.6V11a6.5 6.5 0 0 1 4.9-6.6v-.8A1.6 1.6 0 0 1 12 2zm0 20a3 3 0 0 1-3-3h6a3 3 0 0 1-3 3z"/>',

/** t('ns','key',{vars}) — i18next with keySeparator:false, fallbackLng:'en', and the
 *  `_one`/`_other` plural suffix when a numeric `count` is passed. */
function t(ns,key,vars){
  let k = key;
  if(vars && typeof vars.count==='number'){
    const suf = vars.count===1 ? '_one' : '_other';
    if((RES.en[ns]||{})[key+suf]!==undefined) k = key+suf;
  }
  let s = ((RES[S.lang]||{})[ns]||{})[k];
  if(s===undefined) s = (RES.en[ns]||{})[k];
  if(s===undefined) return key;
  if(vars) for(const v in vars) s = s.split('{{'+v+'}}').join(vars[v]===undefined?'':String(vars[v]));
  return s;
}
/** Platform.OS branch (D-101): iOS reads the Face ID copy (the base key), Android the '.android'
 *  sibling. Only call it for keys that HAVE an '.android' sibling. */

  for(const ev of PREPARATION){ if(at[ev]===null||at.votingStarts===null) continue;
    if(at[ev]>at.votingStarts) conflicts.push({code:'OUT_OF_ORDER',event:ev}); }

}

    const parts=new Intl.DateTimeFormat(language,{timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ms));
    const get=type=>{ const f=parts.find(p=>p.type===type); if(!f) throw new Error('missing'); return Number(f.value); };
    return {year:get('year'),month:get('month'),day:get('day')};
  }catch(_){ const d=new Date(ms); return {year:d.getUTCFullYear(),month:d.getUTCMonth()+1,day:d.getUTCDate()}; }
}

  if(dd===0) return {key:'subtitle.today',params:{weekday:wd}};

  if(dd>=1&&dd<=6) return {key:'subtitle.futureWeekday',params:{weekday:wd}};
  if(dd<=-2) return {key:'subtitle.pastDate',params:{date:formatRailDate(ms,timeZone,language)}};

function resolveAbsentStatus(id,at,nowMs){
  const crossed=x=>at[x]!==null&&nowMs>=at[x], notYet=x=>at[x]!==null&&nowMs<at[x];
  if(PREPARATION.includes(id)) return STRICT_CHAIN.some(crossed)?'past':'unknown';
  const i=STRICT_CHAIN.indexOf(id);
  if(STRICT_CHAIN.slice(i+1).some(crossed)) return 'past';
  if(PREPARATION.concat(STRICT_CHAIN.slice(0,i)).some(notYet)) return 'future';

function deriveTimeline({timeline,now,language,timeZone}){
  language=language||'en'; timeZone=timeZone||'UTC';

  const {at,conflicts}=parseTimeline(timeline);
  if(conflicts.some(c=>c.code==='UNPARSEABLE'||c.code==='OUT_OF_ORDER')) return {indeterminate:true};
  if(STAGES.every(id=>at[id]===null)) return {indeterminate:true};
  const cur=finestStage(at,nowMs);
  const rows=STAGES.map(id=>{
    const ms=at[id];
    const status = id===cur ? 'current' : ms!==null ? (nowMs>=ms?'past':'future') : resolveAbsentStatus(id,at,nowMs);
    const railLabel = status==='current' ? {kind:'now'} : ms!==null ? {kind:'date',text:formatRailDate(ms,timeZone,language)} : {kind:'unknown'};
    return {stageId:id,titleKey:STAGE_TITLE_KEY[id],status,instantMs:ms,railLabel,
      subtitle: ms!==null ? relativeDateSubtitle(ms,nowMs,language,timeZone) : null};
  });

const ballot = () => {

  if(S.ballotVariant==='unsupported1') b.unsupportedQuestionCount=1;

/* useBallot(getBallot) → {ballot, failed}. getBallot rejects with no election to read. */
function useBallot(){
  if(S.ballotRead==='failed' || S.electionRead==='none') return {ballot:null,failed:true};
  if(S.ballotRead==='loading') return {ballot:null,failed:false};
  return {ballot:ballot(),failed:false};
}
const electionTitle = () => S.longNames ? LONG_ELECTION_TITLE : ELECTION_TITLE;
/* useNetworkName(): Network.Name of the open network, else the common:networkName copy (no
   network open yet, or its name not read yet). */
const networkName  = () => S.longNames ? LONG_NETWORK_NAME : (S.hasNetwork && S.netName ? S.netName : t('common','networkName'));
/* VoterAppProvider.nowMs(): the one clock every election-window read uses. The __DEV__ clock
   offset is SHARED by Home and Timeline (the dashed control on the Timeline drives both). */
const nowMs = () => Date.now()+S.clockOffsetMs;
/* VoterAppProvider.getElection(): real read derived from the timeline; a __DEV__ override
   keeps id/title and overlays that state's DEV_LIFECYCLE_CONTENT. Rejects (null) with no
   election or an indeterminate timeline. */
function getElection(){
  if(S.electionRead!=='ok') return null;
  const now=nowMs();
  const view=deriveTimeline({timeline:tlBlob(),now});      // readVoterElection passes no language/timeZone
  if(view.indeterminate || S.tlRead==='failed') return null;
  const base={id:'fixture-election-1',title:electionTitle()};
  if(S.lifecycleOverride) return Object.assign(base,{lifecycleState:S.lifecycleOverride},devLifecycleContent(S.lifecycleOverride,S.overrideAt));
  const lc=lifecycleFromTimeline(view,now);
  Object.assign(base,lc);
  if(S.keyholders.length>0) base.keysTotal=S.keyholders.length;
  if(['ReleasingKeys','Validation','Complete'].includes(lc.lifecycleState) && S.keysMeasured!==undefined) base.keysReleased=S.keysMeasured;
  return base;
}

/* --- BallotSelectionProvider (verbatim semantics) --- */
function toggleCandidate(officeId,candidateId,voteFor){
  const cur=S.selectionMap[officeId]||[];
  if(voteFor===1){ S.selectionMap[officeId] = cur[0]===candidateId ? [] : [candidateId]; return; }
  if(cur.includes(candidateId)){ S.selectionMap[officeId]=cur.filter(i=>i!==candidateId); return; }
  if(cur.length>=voteFor) return;                 // at cap → silent no-op
  S.selectionMap[officeId]=cur.concat([candidateId]);
}
function computeCompletedCount(offices){ return {completed:offices.filter(o=>(S.selectionMap[o.id]||[]).length>0).length,total:offices.length}; }
function resolveSelectionSummary(office){
  const ids=S.selectionMap[office.id]||[];
  if(!ids.length) return {summary:t('ballot','notYetAnswered'),hasSelection:false};
  return {summary:ids.map(id=>office.candidates.find(c=>c.id===id)).filter(Boolean).map(c=>c.name).join(', '),hasSelection:true};
}

const TABS=[
  {name:'Vote',        labelKey:'tabVote',        glyph:'check-to-slot'},
  {name:'Timeline',    labelKey:'tabTimeline',    glyph:'timeline'},
  {name:'Registration',labelKey:'tabRegistration',glyph:'user-plus'},

  {name:'Settings',    labelKey:'tabSettings',    glyph:'gear'},

/** REGISTRATION_FULLSCREEN_ROUTES — hide the tab bar on the Registration AND Timeline tabs. */
const REGISTRATION_FULLSCREEN_ROUTES=['DeviceAttestation','RegisterPersonal','RegisterAddressParty','RegisterConfirm','Confirmation','ContinueOnAnotherDevice'];

const stack   = () => S.stacks[S.tab];
const topRoute= () => { const st=stack(); return st[st.length-1]; };
function clearTimers(){ S.timers.forEach(clearTimeout); S.timers=[]; }
function later(ms,fn){ S.timers.push(setTimeout(fn,ms)); }
function afterNav(){ clearTimers(); render(); }
function enter(r){ const f=ROUTES[r]&&ROUTES[r].onEnter; if(f) f(); }
function push(r){ clearTimers(); stack().push(r); enter(r); render(); }
function replaceTop(r){ clearTimers(); const st=stack(); st[st.length-1]=r; enter(r); render(); }
function canPop(){ return !(topRoute()==='ContinueOnAnotherDevice' && S.cad.branch==='pending' && S.cad.failure===null && !S.cad.allowLeave); }  // beforeRemove prevented
function goBack(){ if(stack().length>1 && canPop()) stack().pop(); afterNav(); }
function popToTop(){ if(!canPop()) return; S.stacks[S.tab]=[S.stacks[S.tab][0]]; afterNav(); }
function switchTab(name){
  if(name===S.tab){ popToTop(); return; }       // tabPress on the focused tab pops its stack to top
  S.tab=name; afterNav();
}
/** Android hardware back. Modals (InfoDialog/PartyDropdown) take it first via onRequestClose;
 *  then the focused stack pops; at a non-first tab's root bottom-tabs' backBehavior
 *  'firstRoute' returns to Vote; at Vote's root the app would background (no-op here). */
function hardwareBack(){
  if(document.getElementById('devdrawer').classList.contains('open')){ ACTIONS['close-drawer'](); return; }
  if(S.bio){ ACTIONS['bio-cancel'](); return; }
  if(S.join.scanner){ ACTIONS['scan-close'](); return; }     // Modal onRequestClose
  if(S.boot!=='ready' || S.retired) return;
  if(S.dialog){ S.dialog=null; render(); return; }
  if(S.sheet){ S.sheet=null; render(); return; }
  if(stack().length>1){ goBack(); return; }
  if(S.tab!=='Vote'){ S.tab='Vote'; afterNav(); }
}

/** CountdownTimer — components/CountdownTimer.tsx. Adaptive units at the 24h boundary
 *  (days/hours/minutes ≥ 24h, else hours/minutes/seconds) and the two-step shrink: digits
 *  display→h2 and labels caption→captionSmall when any group exceeds 2 digits OR the three
 *  labels total more than 16 characters. */
function countdownInner(targetMs,offsetMs){
  if(!Number.isFinite(targetMs)) return '';
  const ms=Math.max(0,targetMs-(Date.now()+(offsetMs||0))), tot=Math.floor(ms/1000), p=n=>String(n).padStart(2,'0');
  const groups = tot>=86400
    ? [[String(Math.floor(tot/86400)),'countdown.days'],[p(Math.floor((tot%86400)/3600)),'countdown.hours'],[p(Math.floor((tot%3600)/60)),'countdown.minutes']]
    : [[p(Math.floor(tot/3600)),'countdown.hours'],[p(Math.floor((tot%3600)/60)),'countdown.minutes'],[p(tot%60),'countdown.seconds']];
  const labels=groups.map(g=>t('home',g[1]));
  const shrink = Math.max(...groups.map(g=>g[0].length))>2 || labels.reduce((s,l)=>s+l.length,0)>16;
  const dig=shrink?'h2':'display', lab=shrink?'captionSmall':'caption';
  return groups.map((g,i)=>(i>0?'<span style="'+fs(dig)+'color:var(--text);margin-top:4px">:</span>':'')
      +'<div style="display:flex;flex-direction:column;align-items:center;margin:0 4px">'
      +'<span style="'+fs(dig)+'color:var(--text)">'+g[0]+'</span>'
      +'<span style="'+fs(lab)+'color:var(--textSecondary);text-transform:uppercase;letter-spacing:1px;margin-top:4px">'+esc(labels[i])+'</span></div>').join('');
}
function CountdownTimer(targetMs,offsetMs){
  const inner=countdownInner(targetMs,offsetMs);
  if(!inner) return '';
  return '<div class="countdown" data-target="'+targetMs+'" data-offset="'+(offsetMs||0)+'" style="display:flex;align-items:flex-start">'+inner+'</div>';
}

/* ---- Review & Submit (screens/ballot/ReviewSubmitScreen.tsx + engines/vote-casting.ts) ---- */
/** One plain message per closed ineligibility reason; not-registered and device-key-rotated share one. */
const REASON_KEY={'election-unavailable':'submit.reason.electionUnavailable','window-closed':'submit.reason.windowClosed',
  'ballot-unconfirmed':'submit.reason.ballotUnconfirmed','no-ballots':'submit.reason.noBallots','unsupported-question':'submit.reason.unsupportedQuestion',
  'dependent-question':'submit.reason.dependentQuestion','selection-invalid':'submit.reason.selectionInvalid','required-unanswered':'submit.reason.requiredUnanswered',
  'below-minimum':'submit.reason.belowMinimum','device-check-failed':'submit.reason.deviceCheckFailed','not-registered':'submit.reason.notRegistered',
  'device-key-rotated':'submit.reason.notRegistered','registration-ambiguous':'submit.reason.registrationAmbiguous','unreadable-key':'submit.reason.unreadableKey',
  'already-saved':'submit.reason.alreadySaved'};
/** The reasons whose refusal names questions (the screen lists each by its displayed title). */
const REASON_QUESTIONS={'selection-invalid':['office-us-senate'],'below-minimum':['office-state-board-education'],
  'unsupported-question':['office-state-senate'],'dependent-question':['office-governor']};
function reviewEligibility(offices,failed){
  if(S.elig==='checking') return null;
  if(failed) return {eligible:false,reason:'election-unavailable',questions:[]};
  if(S.reviewReason) return {eligible:false,reason:S.reviewReason,questions:(REASON_QUESTIONS[S.reviewReason]||[]).map(id=>offices.find(o=>o.id===id)).filter(Boolean)};
  const sv=S.savedVote.state;
  if(sv==='saved'||sv==='sent'||sv==='unreadable') return {eligible:false,reason:'already-saved',questions:[]};
  const missing=offices.filter(o=>o.required && !(S.selectionMap[o.id]||[]).length);
  if(missing.length) return {eligible:false,reason:'required-unanswered',questions:missing};
  return {eligible:true,replacesStale:sv==='stale'};
}
/** One typed message per closed failure stage and reason (castFailureText); never error text. */
const FAILURE_COPY={'build-failed':['submit.failure.buildFailed'],'sign-canceled':['submit.failure.canceled',1],
  'sign-biometric-unavailable':['submit.failure.biometricUnavailable',1],'sign-failed':['submit.failure.signFailed'],
  'signature-invalid':['submit.failure.signatureInvalid'],'seal-canceled':['submit.failure.canceled',1],
  'seal-key-invalidated':['submit.failure.keyInvalidated',1],'seal-failed':['submit.failure.sealFailed'],
  'store-already-saved':['submit.reason.alreadySaved'],'store-unreadable':['submit.failure.storeUnreadable'],
  'store-failed':['submit.failure.storeFailed'],'unexpected':['submit.failure.unexpected']};
function castFailureText(f){ const c=FAILURE_COPY[f]||FAILURE_COPY.unexpected; return c[1]?tp('ballot',c[0]):t('ballot',c[0]); }

/* ---- Vote receipt + SendVoteCard (screens/ballot/SendVoteCard.tsx, engines/vote-send-flow.ts) ---- */
/** A fully sent vote's statuses come back from the sent store on mount (readVoteSent). */
function sendStatuses(){
  if(S.savedVote.state==='sent'){ const o={}; S.receiptBallots.forEach(id=>o[id]={phase:'sent'}); return o; }
  return S.send.statuses;
}
function sendAllSent(){ const st=sendStatuses(), ids=S.receiptBallots; return ids.length>0 && ids.every(id=>st[id]&&st[id].phase==='sent'); }
const OUTCOME_KEY={'no-network':'send.noNetwork','no-rendezvous':'send.noRendezvous','rendezvous-unreachable':'send.failed',
  canceled:'send.canceled','biometric-unavailable':'send.biometricUnavailable',unreadable:'send.failed',failed:'send.failed',
  'voting-closed':'send.votingClosed','election-key-missing':'send.keyMissing','window-unreadable':'send.windowUnreadable'};
function SendVoteCard(){
  const st=sendStatuses(), ids=S.receiptBallots, sd=S.send, body=fs('body'), cap=fs('caption'), med='font-weight:500;';
  const allSent=sendAllSent();
  const lineFor=s=>{ if(!s) return null; switch(s.phase){
    case 'waiting': return {text:t('ballot','send.waiting',{size:s.size}),tone:'var(--textSecondary)'};
    case 'joined': return {text:t('ballot','send.joined'),tone:'var(--textSecondary)'};
    case 'confirming': return {text:tp('ballot','send.confirming'),tone:'var(--textSecondary)'};
    case 'sent': return {text:t('ballot','send.sent'),tone:'var(--success)'};
    case 'not-sent': return {text:t('ballot',s.reason==='voting-closed'?'send.notSentClosed':'send.notSent'),tone:'var(--error)'};
  } return null; };
  const anyNotSent=ids.some(id=>st[id]&&st[id].phase==='not-sent');
  let h='<div style="margin-top:16px"><div style="color:var(--text);'+body+med+'">'+esc(t('ballot','send.heading'))+'</div>';
  h+= allSent ? '<div style="margin-top:8px;color:var(--success);'+body+med+'">'+esc(t('ballot','send.allSent'))+'</div>'
              : '<div style="margin-top:8px;color:var(--textSecondary);'+cap+'">'+esc(t('ballot','send.explain'))+'</div>';
  if(ids.length>1 || Object.keys(st).length>0)
    h+=ids.map((id,i)=>{ const l=lineFor(st[id]); return l===null?'' : '<div style="margin-top:8px;color:'+l.tone+';'+body+'">'
      +esc((ids.length>1?t('ballot','send.ballotLabel',{index:i+1})+': ':'')+l.text)+'</div>'; }).join('');
  if(!allSent){
    /* the label colour is colors.background in source, not colors.light */
    h+='<button class="btn" data-act="send-vote" '+(sd.sending?'disabled ':'')+'style="margin-top:12px;min-height:44px;padding:12px 24px;font-weight:600;background:var(--primary);color:var(--background);border-radius:var(--r-pill);opacity:'+(sd.sending?0.5:1)+'">'
       +esc(t('ballot',anyNotSent||sd.outcome!==null?'send.retryCta':'send.cta'))+'</button>'
      +'<div style="margin-top:8px;color:var(--textSecondary);'+cap+'">'+esc(tp('ballot','send.hint'))+'</div>';
  }
  if(sd.outcome!==null) h+='<div style="margin-top:8px;color:var(--error);'+body+'">'
    +esc(sd.outcome==='biometric-unavailable'?tp('ballot','send.biometricUnavailable'):t('ballot',OUTCOME_KEY[sd.outcome]))+'</div>';
  return h+'</div>';
}
/** buildReceiptBallots: rows follow the ballot's question order; a blank question says "Left blank". */
function receiptViews(){
  const choices=S.savedChoices||{}, offices=FIXTURE_BALLOT.offices, two=S.receiptBallots.length>1;
  return S.receiptBallots.map((id,i)=>{
    const qs=offices.filter(o=>!two || (i===0?o.group==='Federal':o.group!=='Federal'));
    return {ballotId:id,description:BALLOT_DESCRIPTION,nonceGroups:formatNonceGroups(S.receipt.badNonce&&i===0?'not-a-nonce':SAMPLE_NONCES[i%2]),
      questions:qs.map(o=>{ const ids=choices[o.id]||[]; return {title:o.title,blank:ids.length===0,
        choices:ids.map(c=>(o.candidates.find(x=>x.id===c)||{}).name).filter(Boolean)}; })};
  });
}
/** A completed choice set over the fixture (one optional question left blank). */
function sampleChoices(){ const m={}; FIXTURE_BALLOT.offices.forEach(o=>{ if(o.id!=='office-us-house') m[o.id]=o.candidates.slice(0,o.voteFor).map(c=>c.id); }); return m; }

/* ---- Results (screens/timeline/ResultsScreen.tsx) ---- */
const pct=(n,of)=>of>0?Math.round(n/of*100):0;
function ResultsBody(){
  const body=fs('body'), h4=fs('h4');
  const card=(inner,extra)=>'<div style="border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:8px;'+(extra||'')+'">'+inner+'</div>';
  const txt=(s,c,x)=>'<div style="color:'+(c||'var(--text)')+';'+body+(x||'')+'">'+esc(s)+'</div>';
  const R=S.results; let h='';
  if(R==='loading') h+=txt(t('timeline','results.computing'),'var(--textSecondary)');
  if(R==='failed') h+=txt(t('timeline','results.loadFailed'),'var(--error)');
  if(R==='no-election') h+=txt(t('timeline','results.noElection'));
  if(R==='awaiting-keys'||R==='awaiting-nokey')
    h+=card('<div style="color:var(--text);'+h4+'">'+esc(t('timeline','results.lockedTitle'))+'</div>'+txt(t('timeline','results.lockedBody'))
      +(R==='awaiting-keys'?txt(t('timeline','results.releasedCount',{released:1,needed:3})):txt(t('timeline','results.noKey'),'var(--textSecondary)')));
  if(R==='unavailable')
    h+=card('<div style="color:var(--error);'+h4+'">'+esc(t('timeline','results.unavailableTitle'))+'</div>'
      +txt(t('timeline','results.unavailableReason',{reason:'election-key-inconsistent'}),'var(--textSecondary)'));
  if(R==='no-blocks') h+=card(txt(t('timeline','results.noBlocksYet'),'var(--warning)'));
  if(R==='tallied'||R==='no-ballots'){
    const res=sampleResults(); if(R==='no-ballots') res.ballots=[];
    const nc=res.totals.invalid+res.totals.excluded;
    h+=card('<div style="color:var(--text);'+h4+'">'+esc(t('timeline','results.validVotes',{count:res.totals.valid}))+'</div>'
      +(nc>0?txt(t('timeline','results.notCountedVotes',{count:nc}),'var(--warning)'):'')
      +txt(t('timeline','results.checkedNote'),'var(--textSecondary)'));
    if(res.ballots.length===0) h+=txt(t('timeline','results.noBallots'));
    h+=res.ballots.map(b=>card((b.description?'<div style="color:var(--text);'+h4+'">'+esc(b.description)+'</div>':'')
      +b.questions.map(q=>{ const tot=q.options.reduce((n,o)=>n+o.count,0);
        return '<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">'+txt(q.title,null,'font-weight:700;')
          +(q.counted ? q.options.map(o=>'<div style="display:flex;flex-direction:column;gap:4px">'
              +'<div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--text);'+body+'flex-shrink:1;min-width:0">'+esc(o.title)+'</span>'
              +'<span style="color:var(--text);'+body+'white-space:nowrap">'+esc(t('timeline','results.optionCount',{count:o.count,percent:pct(o.count,tot)}))+'</span></div>'
              +'<div style="height:8px;border-radius:4px;overflow:hidden;background:var(--progressTrack)"><div style="height:8px;border-radius:4px;background:var(--progressFill);width:'+pct(o.count,tot)+'%"></div></div></div>').join('')
            : txt(t('timeline','results.questionNotCounted'),'var(--textSecondary)'))
          +(q.counted&&q.blank>0?txt(t('timeline','results.blank',{count:q.blank}),'var(--textSecondary)'):'')+'</div>'; }).join(''))).join('');
  }
  /* the published tally shows under any tallied result, the zero-block one included */
  if(R==='tallied'||R==='no-ballots'||R==='no-blocks'){
    const P=S.publication;
    if(P==='none') h+=txt(t('timeline','results.notPublished'),'var(--textSecondary)');
    if(P==='matches') h+=card(txt(t('timeline','results.publishedMatches',{date:new Date(S.tlAnchor-2*HOUR).toLocaleString(S.lang)})));
    if(P==='differs') h+=card(txt(t('timeline','results.publishedDiffers',{published:2,local:3}),'var(--warning)'));
    if(P==='invalid') h+=card(txt(t('timeline','results.publishedInvalid'),'var(--error)'));
  }
  h+='<button class="plain" data-act="results-refresh" '+(R==='loading'?'disabled ':'')+'style="min-height:44px;display:flex;align-items:center;justify-content:center;width:100%;color:var(--link);'+body+'">'+esc(t('timeline','results.refreshCta'))+'</button>';
  return '<div class="scroll" data-scroll="results"><div style="padding:16px;display:flex;flex-direction:column;gap:16px">'+h+'</div></div>';
}

   if(!o) return '<div class="pad16 fill">'+(failed?'<div class="t-body" style="color:var(--textSecondary)">'+esc(t('ballot','ballotUnavailable'))+'</div>':'')+'</div>';
   const isFirst=S.currentQuestionIndex===0;
   return '<div class="pad16 fill">'
    +'<div class="scroll" data-scroll="iq">'
     +'<div class="breadcrumb">'
       +'<button class="crumb" data-act="pop-to-top">'+esc(t('common','breadcrumb.home'))+'</button>'+icon('chevron-right',10,'var(--textSecondary)')
       +'<button class="crumb" data-act="back">'+esc(t('common','breadcrumb.ballot'))+'</button>'+icon('chevron-right',10,'var(--textSecondary)')
       +'<span class="crumb current">'+esc(o.title)+'</span></div>'
     +'<div class="t-h4 w-medium" style="color:var(--text);margin-bottom:16px">'+esc(t('ballot','voteForN',{n:o.voteFor}))+'</div>'
     +CandidateSelector(o)
    +'</div>'
    +'<div style="margin-top:24px;display:flex;flex-direction:column;gap:12px;flex:0 0 auto">'
      +(isFirst?'':'<button class="btn btn-outline" data-act="prev-question" style="min-height:48px;padding:14px 24px;font-weight:600">'+esc(t('ballot','previousCta'))+'</button>')
      +'<button class="btn btn-solid" data-act="next-question" style="min-height:48px;padding:14px 24px;font-weight:600">'+esc(t('ballot','nextCta'))+'</button>'
    +'</div></div>';
}},

/* ReviewSubmitScreen — the real local Submit. Eligibility is evaluated on every focus (the
   "Checking…" line), so a closed reason shows before any prompt. Submit signs with the device
   key (prompt 1) and seals the record (prompt 2), then opens VoteReceipt with revealOnOpen. */
ReviewSubmit:{ header:'stack', title:()=>t('ballot','reviewSubmitTitle'),
  onEnter(){ S.elig='checking'; S.reviewFailure=null; later(700,()=>{ if(topRoute()==='ReviewSubmit'){ S.elig='ready'; render(); } }); },
  body(){
  const {ballot:b,failed}=useBallot(); const offices=b?b.offices:[];
  const el=reviewEligibility(offices,failed);
  const body=fs('body'), cap=fs('caption');
  const blanks=offices.filter(o=>!(S.selectionMap[o.id]||[]).length);
  const submitDisabled = !(el && el.eligible) || S.reviewPending;
  let h='<div style="margin-top:8px">'
   +(failed?'<div class="t-body" style="color:var(--textSecondary)">'+esc(t('ballot','ballotUnavailable'))+'</div>':'')
   +offices.map(o=>{ const {summary,hasSelection}=resolveSelectionSummary(o);
      return '<div class="cardSurface">'
        +'<div class="t-caption" style="color:var(--textSecondary)">'+esc(o.title)+'</div>'
        +'<div class="t-body" style="margin-top:4px;color:'+(hasSelection?'var(--success)':'var(--textSecondary)')+'">'+esc(summary)+'</div></div>'; }).join('')
   +'</div>';
  if(offices.length>0 && blanks.length>0)
    h+='<div style="margin-top:12px"><div style="color:var(--text);'+body+'">'+esc(t('ballot','submit.blankHeading'))+'</div>'
      +blanks.map(o=>'<div><div style="color:var(--textSecondary);'+body+'">'+esc(o.title)+'</div>'
        +(o.required?'<div style="color:var(--error);'+cap+'">'+esc(t('ballot','submit.blankRequiredTag'))+'</div>':'')+'</div>').join('')+'</div>';
  if(offices.length>0 && el && el.eligible && blanks.length===offices.length)
    h+='<div style="margin-top:12px;color:var(--text);'+body+'">'+esc(t('ballot','submit.allBlank'))+'</div>';
  if(el && !el.eligible) h+=el.questions.map(o=>'<div style="margin-top:12px;color:var(--textSecondary);'+body+'">'+esc(o.title)+'</div>').join('');
  let status='';
  if(el===null) status+='<div style="color:var(--textSecondary);'+body+'">'+esc(t('ballot','submit.checking'))+'</div>';
  if(el && !el.eligible) status+='<div style="color:var(--error);'+body+'">'+esc(t('ballot',REASON_KEY[el.reason]))+'</div>';
  if(el && el.eligible && el.replacesStale) status+='<div style="color:var(--text);'+body+'">'+esc(t('ballot','submit.staleReplace'))+'</div>';
  if(S.reviewFailure) status+='<div style="color:var(--error);'+body+'">'+esc(castFailureText(S.reviewFailure))+'</div>';
  status+='<div style="color:var(--textSecondary);'+cap+'">'+esc(t('ballot','submit.localNote'))+'</div>';
  return '<div class="pad16 fill"><div class="scroll" data-scroll="review">'+h+'</div>'
   +'<div style="margin-top:12px;display:flex;flex-direction:column;gap:4px;flex:0 0 auto">'+status+'</div>'
   +'<div style="display:flex;gap:16px;padding:0 20px;margin-top:24px;flex:0 0 auto">'
     +'<button class="btn btn-outline" data-act="back" '+(S.reviewPending?'disabled ':'')+'style="flex:1;min-width:0;min-height:44px;padding:12px 24px;font-weight:600">'+esc(t('ballot','continueVotingCta'))+'</button>'
     +'<button class="btn btn-solid" data-act="submit-ballot" '+(submitDisabled?'disabled ':'')+'style="flex:1;min-width:0;min-height:44px;padding:12px 24px;font-weight:600;opacity:'+(submitDisabled?0.5:1)+'">'
       +esc(S.reviewPending?t('ballot','submit.saving'):t('ballot','submitCta'))+'</button></div>'
  +'</div>';
}},

/* VoteReceiptScreen — "Vote saved". Status and loss lines render from the non-secret marker with
   no prompt; choices and vote codes appear only after a reveal (Face ID / fingerprint), which
   Review & Submit's revealOnOpen triggers once. Re-hidden on blur. Copy shows a toast. */
VoteReceipt:{ header:'stack', title:()=>t('ballot','receipt.title'),
  onEnter(){ if(S.receipt.revealOnOpen && ['saved','stale'].includes(S.savedVote.state)){ S.receipt.revealOnOpen=false; later(450,()=>{ if(topRoute()==='VoteReceipt') ACTIONS['receipt-reveal'](); }); } },
  body(){
  const r=S.receipt, sv=S.savedVote, body=fs('body'), cap=fs('caption'), med='font-weight:500;';
  const load = r.load==='loading' ? 'loading' : sv.state==='none' ? 'none' : sv.state==='unreadable' ? 'unreadable' : 'saved';
  let h='';
  if(load==='loading') h+='<div style="color:var(--textSecondary);'+body+'">'+esc(t('ballot','receipt.loading'))+'</div>';
  if(load==='none') h+='<div style="color:var(--text);'+body+'">'+esc(t('ballot','receipt.none'))+'</div>';
  if(load==='unreadable') h+='<div style="color:var(--error);'+body+med+'">'+esc(t('ballot','receipt.unreadable'))+'</div>'
    +'<div style="margin-top:16px;color:var(--textSecondary);'+body+'">'+esc(t('ballot','receipt.loss'))+'</div>';
  if(load==='saved'){
    const kind = sv.state==='stale' ? 'stale' : 'saved';
    const revisionKnown = sv.state==='sent' ? true : sv.revisionKnown!==false;
    const allSent = sendAllSent();
    h+='<div style="color:var(--text);'+body+med+'">'+esc(t('ballot',allSent?'receipt.statusSent':'receipt.status'))+'</div>';
    if(kind==='stale') h+='<div style="margin-top:16px;color:var(--error);'+body+med+'">'+esc(t('ballot','receipt.stale'))+'</div>';
    if(!revisionKnown) h+='<div style="margin-top:16px;color:var(--textSecondary);'+body+'">'+esc(t('ballot','receipt.revisionUnknown'))+'</div>';
    h+='<div style="margin-top:16px;color:var(--textSecondary);'+body+'">'+esc(t('ballot','receipt.loss'))+'</div>';
    if(kind==='saved' && revisionKnown) h+=SendVoteCard();
    if(!r.revealed){
      h+='<div style="margin-top:16px">'
        +'<button class="btn btn-outline" data-act="receipt-reveal" '+(r.busy?'disabled ':'')+'style="min-height:44px;padding:12px 24px;font-weight:600;opacity:'+(r.busy?0.5:1)+'">'+esc(t('ballot','receipt.revealCta'))+'</button>'
        +'<div style="margin-top:8px;color:var(--textSecondary);'+cap+'">'+esc(tp('ballot','receipt.revealHint'))+'</div>'
        +(r.notice?'<div style="margin-top:8px;color:var(--error);'+body+'">'+esc(r.notice==='biometric-unavailable'?tp('ballot','receipt.revealBiometricUnavailable'):t('ballot',r.notice==='canceled'?'receipt.revealCanceled':'receipt.revealFailed'))+'</div>':'')
      +'</div>';
    } else {
      h+='<div style="margin-top:16px"><div style="color:var(--text);'+body+med+'">'+esc(t('ballot','receipt.choicesHeading'))+'</div>'
        +receiptViews().map((v,i)=>'<div class="cardSurface" style="margin-top:12px">'
          +(v.description!==null?'<div style="color:var(--text);'+body+med+'">'+esc(v.description)+'</div>':'')
          +v.questions.map(q=>'<div style="margin-top:8px"><div style="color:var(--textSecondary);'+cap+'">'+esc(q.title)+'</div>'
            +'<div style="color:'+(q.blank?'var(--textSecondary)':'var(--success)')+';'+body+'">'+esc(q.blank?t('ballot','receipt.leftBlank'):q.choices.join(', '))+'</div></div>').join('')
          +'<div style="margin-top:12px;color:var(--textSecondary);'+cap+'">'+esc(t('ballot','receipt.nonceLabel'))+'</div>'
          +(v.nonceGroups===null
            ? '<div style="color:var(--error);'+body+'">'+esc(t('ballot','receipt.unreadable'))+'</div>'
            : '<div style="display:flex;flex-wrap:wrap;margin-top:4px">'+v.nonceGroups.map(g=>'<span style="margin-right:8px;color:var(--text);'+body+'font-family:ui-monospace,Menlo,monospace">'+g+'</span>').join('')+'</div>'
              +'<div style="display:flex;align-items:center;flex-wrap:wrap;margin-top:8px">'
                +'<button class="btn btn-outline inline-btn" data-act="receipt-copy" style="min-height:44px;padding:8px 20px;margin-right:12px;font-weight:600">'+esc(t('ballot','receipt.copyCta'))+'</button>'
                +'<span style="flex:1;min-width:0;color:var(--error);'+cap+med+'">'+esc(t('ballot','receipt.copyWarning'))+'</span></div>')
        +'</div>').join('')+'</div>';
    }
  }
  return '<div class="pad16 fill"><div class="scroll" data-scroll="receipt">'+h+'</div>'
   +'<div style="display:flex;padding:0 20px;margin-top:24px;flex:0 0 auto">'
     +'<button class="btn btn-solid" data-act="pop-to-top" style="flex:1;min-height:44px;padding:12px 24px;font-weight:600">'+esc(t('ballot','receipt.doneCta'))+'</button></div>'
  +'</div>';
}},

/* ===== TIMELINE STACK ===== */

Keyholders:{ header:'stack', title:()=>t('timeline','keyholders.screenTitle'), body(){
  if(S.keyholdersRead==='loading') return '<div class="fill"></div>';
  if(S.keyholdersRead==='failed' || S.electionRead==='none')
    return '<div class="scroll"><div class="pad16 centercol" style="gap:24px">'+IndeterminateFrame('noop',true)+'</div></div>';
  const list=S.keyholders;
  if(list.length===0){
    return '<div class="scroll"><div class="pad16 centercol" style="gap:24px"><div style="display:flex;flex-direction:column;align-items:center;gap:24px">'
      +icon('key',48,'var(--muted)')
      +'<div style="color:var(--text);'+fs('h4')+'text-align:center">'+esc(t('timeline','keyholders.emptyHeading'))+'</div>'
      +'<div style="color:var(--textSecondary);'+fs('body')+'text-align:center">'+esc(t('timeline','keyholders.emptyBody'))+'</div>'
    +'</div></div></div>';

  const e=getElection();
  const total = e && e.keysTotal!==undefined ? e.keysTotal : list.length;

  +'</div></div>';
}},

/* ===== REGISTRATION STACK (also re-registered on the Timeline stack) ===== */
/* RegistrationScreen — the card reads the authoritative status (resolveRegistrationStatus) on
   every focus; the __DEV__ toggle overrides it for the session. An engine-derived registration
   carries no date, so the Valid-through badge renders with an empty date. */
RegistrationHome:{ header:'none', body(){
  const ov=S.isRegistered[S.tab];
  const reg = ov===undefined ? S.regEngine : !!ov;
  const regAt = ov===true ? (S.registeredAt[S.tab]||null) : null;
  let code='';
  const ca=S.codeAvail;
  const link=(act,label)=>'<button class="plain" data-act="'+act+'" style="min-height:44px;display:flex;align-items:center;color:var(--link);font-size:16px">'+esc(label)+'</button>';
  const note=k=>'<div style="color:var(--textSecondary);font-size:16px">'+esc(t('continuity',k))+'</div>';
  if(ca==='available'){
    code='<div style="margin-top:16px">'+link('show-code',t('continuity','code.showAgainLink'))
      +(S.codeRevealed?RegistrationCodeCard(S.codeRevealed):'')+'</div>';
  } else if(ca==='not-registered'){
    code='<div style="margin-top:16px">'+link('open-continue',t('continuity','newDevice.entryLink'))+'</div>';
  } else if(ca==='read-failed'||ca==='read-failed-unknown'){
    code='<div style="margin-top:16px">'+note('code.unavailable')+link('code-retry',t('continuity','code.retryButton'))
      +(ca==='read-failed-unknown'?link('open-continue',t('continuity','newDevice.entryLink')):'')+'</div>';
  } else if(ca==='not-sent'||ca==='not-holder'||ca==='unavailable'){
    code='<div style="margin-top:16px">'+note('code.notAvailableOnDevice')+'</div>';
  } else if(ca===null){
    code='<div style="margin-top:16px">'+note('code.checking')+'</div>';
  }
  return NetworkHeader('reg-help')
   +'<div class="scroll" data-scroll="reghome"><div class="pad16">'
     +(!S.hasNetwork?'<button class="plain" data-act="open-join" style="min-height:44px;display:flex;align-items:center;color:var(--link);font-size:16px">'+esc(t('join','entryLink'))+'</button>':'')
     +RegistrationCard(reg,regAt)
     +code
     +devText('toggle-registered','Toggle isRegistered (dev): '+String(reg))
   +'</div></div>';
}},

RegistrationInfo:{ header:'modal', title:()=>t('registration','headerTitle'), body(){
  const label='<div class="t-caption w-medium" style="color:var(--textSecondary)">', val='<div class="t-body" style="color:var(--text)">';
  const card=inner=>'<div style="background:var(--card);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px">'+inner+'</div>';
  const st=S.regStatus;
  const SENT={registered:'registration.isRegistered',pending:'registration.pending',notRegistered:'registration.notRegistered',indeterminate:'registration.unknown'};
  const sentence = st===null ? null : st==='indeterminate' ? t('timeline',SENT.indeterminate)
     : t('timeline',SENT[st],{bold:t('timeline','registration.isRegisteredBold'),network:networkName()});
  const showNet = st!==null && st!=='indeterminate';
  let dl;
  if(S.riRead==='loading') dl=Spinner(false,'align-self:flex-start');
  else if(S.riRead==='none' || S.electionRead==='none') dl=val+esc(t('registration','info.noElection'))+'</div>';
  else {
    const re=normalizeInstant(tlBlob().registrationEnds);
    const passed = re!==null && re<=Date.now();
    dl='<div style="display:flex;flex-direction:column;gap:4px">'+label+esc(t('registration','info.election'))+'</div>'+val+esc(electionTitle())+'</div></div>'
      +(re!==null?'<div style="display:flex;flex-direction:column;gap:4px">'+label+esc(t('registration',passed?'info.deadlinePassed':'info.deadline'))+'</div>'
        +val+esc(new Intl.DateTimeFormat(S.lang,{dateStyle:'long',timeStyle:'short'}).format(new Date(re)))+'</div></div>':'');
  }
  return '<div class="scroll" data-scroll="reginfo"><div style="padding:16px;display:flex;flex-direction:column;gap:16px">'
    +card('<div style="color:var(--text);font-weight:700;'+fs('h4')+'">'+esc(t('registration','info.statusHeading'))+'</div>'
      +(sentence===null?Spinner(false,'align-self:flex-start'):val+esc(sentence)+'</div>')
      +(showNet?'<div style="display:flex;flex-direction:column;gap:4px">'+label+esc(t('registration','info.network'))+'</div>'+val+esc(networkName())+'</div></div>':''))
    +card(dl)
    +card('<div style="color:var(--text);font-weight:700;'+fs('h4')+'">'+esc(t('registration','info.howHeading'))+'</div>'
      +['info.step1','info.step2','info.step3','info.step4'].map((k,i)=>'<div style="display:flex;gap:8px">'
        +'<span class="t-body" style="color:var(--primary);min-width:20px">'+(i+1)+'.</span>'
        +'<span class="t-body" style="color:var(--text);flex:1;min-width:0">'+esc(t('registration',k))+'</span></div>').join(''))
  +'</div></div>';
}},

/* ConfirmationScreen — the voter submits SELF-SIGNED requests, waits (bounded) for the office's
   challenge with a Stop control, answers it (iOS: the Face ID prompt fires here), then shows an
   honest PENDING state that re-reads the Association status every 10 s for at most 10 min and
   moves to "registered" only when the office has approved. It pops only on Done / Back. */
Confirmation:{ header:'none', onEnter(){ S.confirm=freshConfirm(); }, body(){
  const c=S.confirm, f=c.failure;
  if(f==='identity-lost' && !c.pending) return IdentityRecoveryView('confirm-faceid');
  const errorCopy = f==='recoverable-action' ? tp('registration','confirmation.error.biometricNotEnrolled')
                  : f==='terminal' ? t('registration','confirmation.error.terminal')
                  : f==='recoverable-transient' ? t('registration','confirmation.error.transient')
                  : f==='intake-unavailable' ? t('registration','confirmation.error.intakeUnavailable')
                  : f==='no-election' ? t('registration','confirmation.error.noElection')
                  : f==='wait-stopped' ? t('registration','confirmation.error.waitStopped') : null;
  const cta='margin-top:32px;min-height:44px;padding:0 24px;font-weight:600;';
  const outline=(act,label,mt)=>'<button class="btn inline-btn" data-act="'+act+'" style="margin-top:'+(mt||16)+'px;min-height:44px;padding:0 24px;font-weight:600;background:none;border:1px solid var(--primary);border-radius:var(--r-pill);color:var(--primary)">'+esc(label)+'</button>';
  const line=(s,color,mt)=>'<div class="t-body" style="color:'+(color||'var(--text)')+';text-align:center;margin-top:'+(mt||16)+'px">'+esc(s)+'</div>';
  let h='<div class="t-h2 w-medium" style="color:var(--text);text-align:center">'+esc(t('registration','confirmation.heading'))+'</div>'
   +'<div class="t-body" style="color:var(--textSecondary);text-align:center;margin-top:16px">'+esc(tp('registration','confirmation.body'))+'</div>'
   +'<div style="margin-top:32px">'+icon('fingerprint',96,'var(--primary)')+'</div>'
   +(c.waiting?'':'<div class="t-caption" style="color:var(--textSecondary);text-align:center;margin-top:8px">'+esc(tp('registration','confirmation.caption'))+'</div>');
  if(c.pending && c.outcome==='registered'){
    h+=line(t('registration','confirmation.registered'))
      +'<button class="btn btn-solid inline-btn" data-act="pop-to-top" style="'+cta+'">'+esc(t('registration','confirmation.doneCta'))+'</button>';
  } else if(c.pending){
    h+=line(t('registration','confirmation.pending'));
    if(c.notShared) h+=line(t('registration','confirmation.notShared'),'var(--textSecondary)');
    if(c.codeAvail==='available') h+=RegistrationCodeCard('code');
    else if(c.codeAvail==='read-failed') h+=line(t('continuity','code.unavailable'),'var(--textSecondary)')+outline('confirm-code-retry',t('continuity','code.retryButton'));
    else if(c.codeAvail==='not-sent'||c.codeAvail==='not-holder')
      h+=line(t('continuity','code.notAvailableOnDevice'),'var(--textSecondary)');
    if(c.pollExpired) h+=line(t('registration','confirmation.pendingCheckLater'),'var(--textSecondary)');
    h+=outline('pop-to-top',t('registration','confirmation.pendingBackCta'));
  } else if(c.waiting){
    h+='<div style="margin-top:24px;display:flex;flex-direction:column;align-items:center">'+Spinner(true)
      +line(t('registration','confirmation.waiting'))
      +(c.notShared?line(t('registration','confirmation.notShared'),'var(--textSecondary)'):'')
      +'<button class="btn inline-btn" data-act="confirm-stop" style="margin-top:24px;min-height:44px;padding:0 24px;font-weight:700;'+fs('body')+'background:none;border:1px solid var(--primary);border-radius:var(--r-pill);color:var(--primary)">'+esc(t('registration','confirmation.waitingCancel'))+'</button></div>';
  } else {
    if(errorCopy) h+=line(errorCopy);
    if(f==='terminal'||f==='no-election'){ /* no CTA at all */ }
    else if(f==='recoverable-action'){
      h+='<button class="btn btn-solid inline-btn" data-act="setup-unlock" style="'+cta+'">'+esc(t('registration','confirmation.error.setupCta'))+'</button>'
       +outline('confirm-faceid',t('registration','confirmation.retryCta'));
    } else {
      h+='<button class="btn btn-solid inline-btn" data-act="confirm-faceid" '+(c.busy?'disabled ':'')+'style="'+cta+'">'+esc(errorCopy?t('registration','confirmation.retryCta'):tp('registration','confirmation.cta'))+'</button>';
    }
  }
  return '<div class="scroll" data-scroll="confirm"><div class="pad16 centercol">'+h+'</div></div>';
}},

/* ContinueOnAnotherDeviceScreen — new-device continuity: code → identity fallback → restart,
   then a NON-DISMISSIBLE pending wait (no close X, hardware back prevented). */
ContinueOnAnotherDevice:{ header:'none',
  onEnter(){ S.cad={branch:'resolving',code:'',codeError:null,submitError:null,identity:Object.assign({},EMPTY_IDENTITY),idErrors:{},failure:null};
    later(800,()=>{ if(topRoute()==='ContinueOnAnotherDevice' && S.cad.branch==='resolving'){ S.cad.branch='code'; render(); } }); },
  body(){
  const c=S.cad;
  if(c.branch==='resolving') return '<div class="pad16 fill" style="align-items:center">'+Spinner(false)+'</div>';
  if(c.failure==='identity-lost')
    return '<div class="fill">'+IdentityRecoveryView('cad-retry')
      +'<div style="display:flex;justify-content:center;padding-bottom:24px">'+outlineBtn('cad-leave',t('continuity','newDevice.backToRegistrationButton'))+'</div></div>';
  const card=inner=>'<div class="cardSurface">'+inner+'</div>';
  const heading=(k,color)=>'<div style="color:'+(color||'var(--text)')+';'+fs('h4')+'margin-bottom:8px">'+esc(t('continuity',k))+'</div>';
  const body=(k,color)=>'<div style="color:'+(color||'var(--textSecondary)')+';font-size:16px;margin-bottom:16px">'+esc(k)+'</div>';
  const cta=(act,label,bold)=>'<button class="btn btn-solid" data-act="'+act+'" style="margin-top:16px;min-height:44px;padding:0 24px;font-weight:'+(bold?700:600)+'">'+esc(label)+'</button>';
  const linkRow=(act,label)=>'<button class="plain" data-act="'+act+'" style="margin-top:16px;min-height:44px;display:flex;align-items:center;color:var(--link);font-size:16px">'+esc(label)+'</button>';
  const err=(text,size)=>'<div style="margin-top:4px;color:var(--error);font-size:16px">'+esc(text)+'</div>';
  const idField=(f,ph,errKey)=>'<div style="margin-top:12px"><input class="rninput'+(errKey?' err':'')+'" data-cad="'+f+'" placeholder="'+esc(ph)+'" value="'+esc(c.identity[f])+'" style="border-color:'+(errKey?'var(--error)':'var(--border)')+'" autocomplete="off">'
     +(errKey?err(t('registration','form.errors.required')):'')+'</div>';
  let inner='';
  if(c.branch==='code'){
    inner=card('<div style="color:var(--textSecondary);font-size:16px;margin-bottom:8px">'+esc(t('continuity','newDevice.codeFieldLabel'))+'</div>'
      +'<input class="rninput'+(c.codeError?' err':'')+'" data-cad="code" placeholder="'+esc(t('continuity','newDevice.codeFieldPlaceholder'))+'" value="'+esc(c.code)+'" autocapitalize="characters" style="border-color:'+(c.codeError?'var(--error)':'var(--primary)')+'" autocomplete="off">'
      +(c.codeError?err(c.codeError):'')
      +(c.submitError?err(c.submitError):'')
      +cta('cad-submit-code',t('continuity','newDevice.submitButton'),true)
      +linkRow('cad-lost-code',t('continuity','newDevice.lostCodeLink'))
      +linkRow('cad-restart',t('continuity','newDevice.restartLink')));
  } else if(c.branch==='identity'){
    const r=k=>t('registration',k), e=c.idErrors;
    inner=card(heading('newDevice.identityFallbackHeading')+body(t('continuity','newDevice.identityFallbackBody'))
      +idField('firstName',r('form.firstName'),e.firstName)+idField('lastName',r('form.lastName'),e.lastName)
      +idField('dob',r('form.dobPlaceholder'))+idField('email',r('form.email'))+idField('phone',r('form.phone'))
      +idField('addressLine1',r('form.addressLine1'))+idField('addressLine2',r('form.addressLine2'))+idField('addressLine3',r('form.addressLine3'))
      +(c.submitError?err(c.submitError):'')
      +cta('cad-submit-identity',t('continuity','newDevice.identityFallbackSubmitButton'),true)
      +linkRow('cad-back-to-code',t('continuity','newDevice.backToCodeLink')));
  } else if(c.branch==='restart'){
    inner=card(heading('restart.heading')+body(t('continuity','restart.body'))+cta('cad-restart-confirm',t('continuity','restart.confirmButton'),true));
  } else if(c.branch==='pending'){
    const f=c.failure;
    const errorCopy = f==='recoverable-action' ? tp('registration','confirmation.error.biometricNotEnrolled')
                    : f==='terminal' ? t('registration','confirmation.error.terminal')
                    : f==='recoverable-transient' ? t('registration','confirmation.error.transient')
                    : f==='intake-unavailable' ? t('registration','confirmation.error.intakeUnavailable') : null;
    inner=card(errorCopy
      ? body(errorCopy,'var(--text)')
        +(f==='recoverable-action'?cta('setup-unlock',t('registration','confirmation.error.setupCta'),false):'')
        +(f==='terminal'?'':outlineBtn('cad-retry',t('continuity','newDevice.retryButton')))
        +(f==='terminal'?outlineBtn('cad-leave',t('continuity','newDevice.backToRegistrationButton')):'')
      : heading('newDevice.pendingHeading')+body(t('continuity','newDevice.pendingBody'))+body(t('continuity','newDevice.checkBackLaterBody'))
        +outlineBtn('cad-leave',t('continuity','newDevice.checkBackLaterButton')));
  } else if(c.branch==='approved'){
    inner=card(heading('newDevice.approvedHeading')+cta('pop-to-top',t('registration','form.continueCta'),true));
  } else if(c.branch==='rejected'){
    inner=card(heading('newDevice.rejectedHeading','var(--error)')+body(t('continuity','newDevice.rejectedBody')));
  }
  /* pending is non-dismissible unless it carries a failure; the explicit buttons always leave */
  const showClose = c.branch!=='pending' || c.failure!==null;
  return '<div class="scroll" data-scroll="cad"><div class="pad16">'
    +'<div style="display:flex;justify-content:flex-end;min-height:44px">'
      +(showClose?'<button class="plain" data-act="back" aria-label="'+esc(t('common','close'))+'" style="min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--text)">'+icon('xmark',22)+'</button>':'')
    +'</div>'
    +'<div class="t-h2 w-medium" style="color:var(--text);margin-bottom:16px">'+esc(t('continuity','newDevice.screenTitle'))+'</div>'
    +inner
  +'</div></div>';
}},

   Paste or scan the authority's join code, compare the fingerprint with the one the authority
   published, then tap Join. A scan only FILLS the field; only the Join tap joins. Every failure
   is translated copy picked by the typed reason, never engine text. */
JoinNetwork:{ header:'stack', title:()=>t('join','headerTitle'), body(){
  const j=S.join, body=fs('body'), cap=fs('caption');
  const sec='color:var(--textSecondary);'+body, txt='color:var(--text);'+body;

  const decoded = j.text.trim().length===0 ? null : decodeJoinCode(j.text);
  const busy = j.phase==='joining';
  const scanDisabled = busy || j.availability!=='ready';
  const scannedOk = j.scanNotice==='scanned' && decoded && decoded.ok;
  const statusKind = j.availability==='none' ? 'none' : j.availability==='blocked' ? 'blocked' : scannedOk ? 'scanned'
    : (j.scanNotice==='denied'||j.scanNotice==='failed') ? j.scanNotice : null;
  let h='<div style="'+sec+'margin-bottom:16px">'+esc(t('join','intro'))+'</div><div class="cardSurface">';
  h+='<button class="plain" data-act="join-scan" '+(scanDisabled?'disabled ':'')+'style="width:100%;min-height:44px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;padding:0 16px;'
    +'background:var(--secondaryButtonSurface);border:1px solid '+(scanDisabled?'var(--border)':'var(--primary)')+';border-radius:var(--r-md);'
    +'color:'+(scanDisabled?'var(--textSecondary)':'var(--primary)')+';font-weight:700;font-size:16px;line-height:22px">'
    +icon('qrcode',16,'currentColor','margin-right:4px')+esc(t('join','scanButton'))+'</button>';

    +'<span style="'+sec+'margin-bottom:8px">'+esc(t('join','codeLabel'))+'</span>'
    +'<button class="plain" data-act="join-paste" '+(busy?'disabled ':'')+'style="min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:flex-end;color:var(--link);font-size:16px">'+esc(t('join','pasteButton'))+'</button></div>';
  h+='<textarea data-join="text" '+(busy?'disabled ':'')+'placeholder="'+esc(t('join','codePlaceholder'))+'" autocapitalize="none" spellcheck="false" '
    +'style="width:100%;min-height:96px;border:1px solid '+(decoded&&!decoded.ok?'var(--error)':'var(--primary)')+';border-radius:8px;padding:12px;'
    +'background:none;outline:0;resize:none;font-family:inherit;'+cap+'color:var(--text);word-break:break-all">'+esc(j.text)+'</textarea>';
  if(decoded && !decoded.ok) h+='<div style="margin-top:8px;color:var(--error);'+cap+'">'+esc(t('join',JOIN_DECODE_KEY[decoded.reason]))+'</div>';
  if(statusKind){
    h+='<div style="margin-top:8px">';
    if(statusKind==='scanned') h+='<div style="display:flex;align-items:flex-start">'+icon('circle-check',16,'var(--text)','margin:3px 8px 0 0')
      +'<span style="'+txt+'flex-shrink:1">'+esc(t('join','scannedNotice'))+'</span></div>';
    else h+='<div role="alert" style="display:flex;align-items:flex-start;background:var(--card);border:1px solid var(--warning);border-radius:var(--r-sm);padding:16px">'
      +icon('triangle-exclamation',16,'var(--warning)','margin:3px 8px 0 0')
      +'<span style="'+txt+'flex-shrink:1">'+esc(t('join',{none:'cameraNone',blocked:'cameraBlocked',denied:'cameraDenied',failed:'cameraFailed'}[statusKind]))+'</span></div>'
      +(statusKind==='blocked'?'<button class="plain" data-act="noop" style="min-height:44px;display:flex;align-items:center;color:var(--link);font-size:16px">'+esc(t('join','openSettings'))+'</button>':'');
    h+='</div>';
  }
  if(decoded && decoded.ok)
    h+='<div style="margin-top:16px"><div style="'+sec+'">'+esc(t('join','previewNetwork'))+'</div>'
      +'<div style="'+txt+'font-weight:700;margin-bottom:12px">'+esc(decoded.code.name)+'</div>'
      +'<div style="'+sec+'">'+esc(t('join','previewFingerprint'))+'</div>'
      +'<div style="'+txt+'font-weight:700;margin-bottom:12px;user-select:text">'+esc(decoded.fingerprint)+'</div>'
      +'<div style="'+sec+'margin-bottom:16px">'+esc(t('join','previewCheck'))+'</div></div>';
  if(j.phase==='failed') h+='<div style="margin-top:8px;color:var(--error);'+body+'">'+esc(t('join',j.failKey))+'</div>';
  if(busy) h+='<div style="margin-top:16px;display:flex;align-items:center;min-height:44px">'+Spinner(false)
      +'<span style="'+sec+'margin-left:12px;flex-shrink:1">'+esc(t('join','step.'+j.step))+'</span></div>';
  else { const ok=decoded&&decoded.ok;
    h+='<button class="btn" data-act="join-submit" '+(ok?'':'disabled ')+'style="margin-top:16px;min-height:44px;padding:0 24px;font-weight:700;border-radius:var(--r-pill);'
      +'background:'+(ok?'var(--primary)':'var(--secondaryButtonSurface)')+';color:'+(ok?'var(--light)':'var(--textSecondary)')+'">'+esc(t('join','joinButton'))+'</button>'; }
  return '<div class="scroll" data-scroll="join"><div class="pad16">'+h+'</div></div></div>';
}},
};

/* ---------------------------------------------------------------------------
 * 9. TIMELINE SCREEN — screens/timeline/TimelineScreen.tsx + components/TimelineRail.tsx +
 *    TimelineRow.tsx + TimelineRegistrationPanel.tsx
 * ------------------------------------------------------------------------ */
function currentTimelineView(){
  if(S.tlRead==='failed' || S.electionRead==='none') return {indeterminate:true};
  return deriveTimeline({timeline:tlBlob(),now:Date.now()+S.clockOffsetMs,timeZone:DEVICE_TZ,language:S.lang});
}
function timelineClockStops(view){
  const stageStops=view.rows.filter(r=>r.instantMs!==null).map(r=>({stageId:r.stageId,instantMs:r.instantMs,nowMs:r.instantMs+60000,probe:false}));
  const ts=(view.rows.find(r=>r.stageId==='tallyingStarts')||{}).instantMs, vs=(view.rows.find(r=>r.stageId==='votingStarts')||{}).instantMs;
  const tsMs=ts==null?null:ts, vsMs=vs==null?null:vs;
  const probe = tsMs!==null ? tsMs-23*HOUR : null;
  const nextAfterVs = vsMs===null ? null : view.rows.map(r=>r.instantMs).filter(x=>x!==null&&x>vsMs).reduce((m,x)=>m===null||x<m?x:m,null);
  const valid = probe!==null && vsMs!==null && probe>vsMs && (nextAfterVs===null || probe<nextAfterVs);
  return valid ? stageStops.concat([{stageId:'votingStarts',instantMs:tsMs,nowMs:probe,probe:true}]) : stageStops;
}
function TimelineBody(){
  if(S.tlRead==='loading') return '<div class="fill"></div>';
  const view=currentTimelineView();
  if(view.indeterminate)
    return '<div class="fill" style="justify-content:center;align-items:center;padding:0 24px">'+IndeterminateFrame('tl-retry',false)+'</div>';
  const nowMs=Date.now()+S.clockOffsetMs;
  const range=computeHeaderDateRange(view.rangeStartMs,view.rangeEndMs,S.lang,DEVICE_TZ);
  const reRow=view.rows.find(r=>r.stageId==='registrationEnds');
  const before = reRow.instantMs==null ? true : nowMs<reRow.instantMs;
  /* __DEV__ clock-offset control: live → each present stage (+60 s) → the final-day probe → live */
  const stops=timelineClockStops(view);
  const eff = S.clockStopIndex>stops.length ? 0 : S.clockStopIndex;
  const active = eff>0 ? stops[eff-1] : undefined;
  const offDays=Math.round(S.clockOffsetMs/DAY);
  const sign=n=>(n>=0?'+':'')+n;
  const lbl = active && active.probe ? t('timeline','dev.clockOffsetLabel')+' '+t('timeline',STAGE_TITLE_KEY[active.stageId])+' '+t('timeline','dev.finalDayStop')
    : active ? t('timeline','dev.clockOffsetLabel')+' '+t('timeline',STAGE_TITLE_KEY[active.stageId])+' '+sign(Math.round((active.instantMs-Date.now())/DAY))
    : S.clockOffsetMs===0 ? t('timeline','dev.clockOffsetLabel')+' 0' : t('timeline','dev.clockOffsetLabel')+' '+sign(offDays);
  return '<div class="scroll" data-scroll="tl"><div style="padding:16px">'
    +'<button class="plain" data-act="tl-clock" style="border:1px dashed var(--warning);padding:4px 8px;margin:0 8px 8px;min-height:44px;display:flex;align-items:center;color:var(--warning);'+fs('caption')+'">'+esc(lbl)+'</button>'
    +'<div style="padding:0 8px 16px">'
      +'<div style="color:var(--text);'+fs('h2')+'">'+esc(electionTitle())+'</div>'
      +(range?'<div style="color:var(--textSecondary);'+fs('body')+'margin-top:8px">'+esc(t('timeline','header.dateRange',range))+'</div>':'')
    +'</div>'
    +TimelineRail(view.rows, id => id==='registrationEnds' && S.regStatus!==null ? RegistrationPanel(S.regStatus,before)
        : id==='votingStarts' && S.savedVote.state!=='none' ? SavedVoteNotice(S.savedVote,null) : '')
  +'</div></div>';
}
function TimelineRail(rows,renderPanel){
  if(rows.length!==10) return '';
  const ci=rows.findIndex(r=>r.status==='current');
  const eff = ci!==-1 ? ci : rows.every(r=>r.status==='past') ? rows.length-1 : -1;
  const ts=rows.find(r=>r.stageId==='tallyingStarts');
  const target = ts && typeof ts.instantMs==='number' && Number.isFinite(ts.instantMs) ? ts.instantMs : undefined;
  const dotCY=16+16+TY.h4[1]/2;   // TIMELINE_CARD_MARGIN_V + card padding + h4 lineHeight/2
  return '<div data-testid="timeline-rail">'+rows.map((row,i)=>{
    const filled=row.status==='past'||row.status==='current', ds=row.status==='current'?24:20;
    const above=i<=eff?'var(--primary)':'var(--border)', below=i<eff?'var(--primary)':'var(--border)';
    const isNow=row.railLabel.kind==='now';
    const label = isNow ? t('timeline','rail.now') : row.railLabel.kind==='date' ? row.railLabel.text : '—';
    return '<div style="display:flex">'
      +'<div style="width:64px;flex:0 0 64px;position:relative"><span style="position:absolute;top:'+(dotCY-TY.body[1]/2)+'px;right:8px;white-space:nowrap;'+fs('body')
        +'font-weight:'+(isNow?700:400)+';color:'+(isNow?'var(--primary)':'var(--textSecondary)')+'">'+esc(label)+'</span></div>'
      +'<div style="width:44px;flex:0 0 44px;position:relative">'
        +(i>0?'<i class="tl-conn" style="top:0;height:'+dotCY+'px;background:'+above+'"></i>':'')
        +(i<rows.length-1?'<i class="tl-conn" style="top:'+dotCY+'px;bottom:0;background:'+below+'"></i>':'')
        +'<i class="tl-dot" style="top:'+(dotCY-ds/2)+'px;left:'+((44-ds)/2)+'px;width:'+ds+'px;height:'+ds+'px;'
          +(filled?'border:4px solid var(--primary);background:var(--card)':'border:2px solid var(--border);background:var(--background)')+'"></i>'
      +'</div>'
      +'<div style="flex:1;min-width:0">'+TimelineRow(row,renderPanel(row.stageId),row.stageId==='votingStarts'?target:undefined)+'</div>'
    +'</div>';

function rowActions(id,status){
  const a=[];
  if(id==='registrationEnds' && status!=='past') a.push({act:'tl-registration',key:'registration.editCta',v:'link'});
  /* Saved and unreadable (and sent) hide Vote now; stale offers it again. A saved vote is linked
     ("View saved vote") from the current row as well as the past one. */
  const sv=S.savedVote.state, canVote = sv==='none'||sv==='stale', hasSaved = sv!=='none';
  if(id==='votingStarts'){
    if(status==='future') a.push({act:'tl-ballot',key:'voting.previewBallotCta',v:'link'});
    else if(status==='current'){
      if(canVote) a.push({act:'tl-ballot',key:'voting.voteNowCta',v:'primary'});
      if(hasSaved) a.push({act:'tl-submission',key:'voting.viewSubmissionCta',v:'link'});
    }
    else if(status==='past' && hasSaved) a.push({act:'tl-submission',key:'voting.viewSubmissionCta',v:'link'});
  }
  if(id==='releasingKeys') a.push({act:'tl-keyholders',key:'keyholders.viewCta',v:'outline'});
  if(id==='tallyingStarts' && (status==='current'||status==='past')) a.push({act:'tl-results',key:'results.viewCta',v:'outline'});
  if(status==='past') a.push({act:'tl-details',key:'row.detailsCta',v:'link',details:true});
  return a;
}

/** TimelineRegistrationPanel — the {{bold}} sentinel split: only `registration.isRegistered`
 *  carries the placeholder, so only "registered" renders a nested bold run. */
function RegistrationPanel(status,before){
  const KEY={registered:'registration.isRegistered',pending:'registration.pending',notRegistered:'registration.notRegistered',indeterminate:'registration.unknown'};
  const SENT='\u0000BOLD\u0000';
  const resolved = status==='indeterminate' ? t('timeline',KEY[status],{bold:SENT}) : t('timeline',KEY[status],{bold:SENT,network:networkName()});
  const parts=resolved.split(SENT), bold=t('timeline','registration.isRegisteredBold');
  const sentence = parts.length===2 ? esc(parts[0])+'<b style="font-weight:700">'+esc(bold)+'</b>'+esc(parts[1]) : esc(resolved);
  return '<div style="margin-top:16px;padding:16px;background:var(--secondaryButtonSurface);border-radius:var(--r-sm)">'
    +'<div style="color:var(--text)">'+sentence+'</div>'
    +'<button class="plain" data-act="tl-registration" style="margin-top:8px;min-height:44px;display:flex;align-items:center;color:var(--link);font-weight:700;text-decoration:underline">'
      +esc(t('timeline',before?'registration.editCta':'registration.viewCta'))+'</button></div>';
}
