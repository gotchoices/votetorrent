<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoteTorrent Authority</title>
<style>
/* ============================================================================
   Design tokens — transcribed verbatim from
   apps/VoteTorrentAuthority/src/theme/themes.ts (lightTheme / darkTheme)

   NOTE these are NOT the voter app's tokens. The Authority app runs an
   iOS-system-blue primary (#007AFF / #0A84FF), a pure-white light background,
   a much darker textSecondary (#3F3F3F) and a dark `border` that equals the
   dark `background` (#121212) — a deliberate "borderless in dark" choice that
   this recreation preserves rather than "fixes".

   warningText (#806600 light / #bcb600 dark) is the text-safe warning tint:
   `warning` is ~2:1 on a white card, so warning-coloured LABELS use
   warningText while icons, borders and fills keep `warning`.
   ========================================================================= */
:root{
  color-scheme:light;
  --primary:#007AFF; --background:#FFFFFF; --surface:#FFFFFF; --card:#FFFFFF;
  --text:#000000; --textSecondary:#3F3F3F; --border:#D0D0D0; --notification:#FF3B30;
  --secondary:#000000; --accent:#d9d9d9; --error:#971d1d; --warning:#bcb600; --warningText:#806600;
  --contrast:#262626; --success:#096904; --important:#e8e3ad;
  --dark:#000000; --light:#ffffff; --muted:#9e9e9e;
  --link:#0a7ea4;                      /* ThemedText type="link" hardcodes this */
  --tabInactive:gray;                  /* tabBarInactiveTintColor: "gray" */
  /* globalStyles.cardSurface shadow (offset 0,6 · opacity .18 · radius 18) */
  --cardShadow:0 6px 18px rgba(0,0,0,0.18);
  --footerShadow:0 -1px 1px rgba(0,0,0,0.1);
  --pillAlpha:22;                      /* pill.ts PILL_TINT_ALPHA */
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --primary:#0A84FF; --background:#121212; --surface:#171717; --card:#1C1C1E;
  --text:#ebebeb; --textSecondary:#5b5b5b; --border:#121212; --notification:#FF453A;
  --secondary:#FFFFFF; --accent:#606060; --error:#FF453A; --warning:#bcb600; --warningText:#bcb600;
  --contrast:#dadada; --success:#89a690; --important:#e8e3adc8;
  --dark:#000000; --light:#ffffff; --muted:#6e6e6e;
  --link:#0a7ea4;
  --cardShadow:0 6px 18px rgba(0,0,0,0.5);
  --footerShadow:0 -1px 1px rgba(0,0,0,0.5);
}

/* Type scale — components/ThemedText.tsx */
.t-title{font-size:24px;line-height:30px;font-weight:700}
.t-cardTitle{font-size:22px;line-height:28px;font-weight:700}
.t-header{font-size:19px;line-height:25px}
.t-subtitle{font-size:18px;line-height:24px;font-weight:400}
.t-default{font-size:16px;line-height:24px}
.t-defaultSemiBold{font-size:16px;line-height:24px;font-weight:600}
.t-link{font-size:16px;line-height:30px;color:var(--link);text-decoration:underline}
.t-small{font-size:14px;line-height:20px;font-weight:400}
.t-smallBold{font-size:14px;line-height:20px;font-weight:600}
.t-tiny{font-size:11px;line-height:15px;font-weight:400}
.t-tinyBold{font-size:11px;line-height:15px;font-weight:600}
.muted{color:var(--textSecondary)}
.italic{font-style:italic}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  /* fonts.regular.fontFamily === 'System' in themes.ts */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:#3a3a3c;color:var(--text);
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:0;
}
@media (min-width:900px){ body{padding:24px} }

/* ---- Phone frame: Pixel 8 == 412 x 915 dp ---- */
#device{
  width:412px;height:915px;max-width:100vw;max-height:100vh;
  position:relative;overflow:hidden;background:var(--background);
  display:flex;flex-direction:column;
}
@media (min-width:900px){
  #device{border-radius:34px;box-shadow:0 24px 70px rgba(0,0,0,.55);border:8px solid #101012;height:931px}
}
@media (max-width:911px){ #device{width:100vw;height:100vh;height:100dvh} }

/* ---- Android status bar ---- */
#statusbar{
  flex:0 0 auto;height:28px;background:var(--card);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:12px;font-weight:600;color:var(--text);
  position:relative;z-index:5;
}
#statusbar .sb-icons{display:flex;gap:5px;align-items:center}

/* ---- @react-navigation/native-stack header (Android) ---- */
.navheader{
  flex:0 0 auto;min-height:56px;background:var(--card);
  display:flex;align-items:center;gap:2px;padding:0 4px;
  border-bottom:1px solid var(--border);position:relative;z-index:4;
}
.navheader .hbtn{
  min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:0;background:none;color:var(--text);cursor:pointer;border-radius:50%;padding:0 8px;
}
.navheader .hbtn:active{background:rgba(128,128,128,.18)}
/* headerButton in navigation/index.tsx: padding 8, marginHorizontal 4 */
.navheader .htitle{
  font-size:20px;font-weight:500;color:var(--text);
  padding-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.navheader.has-btn .htitle{padding-left:4px}
/* HeaderTitle()/useTabHeaderOptions(): ThemedText type="header" == 19px, not 20/500 */
.navheader .htitle.tabtitle{font-size:19px;font-weight:400}
.navheader .hright{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-right:4px}

/* ---- screen body ---- */
#screen{flex:1 1 auto;position:relative;overflow:hidden;background:var(--background);display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screenpad{padding:16px}                         /* globalStyles.container */
.fill{flex:1;display:flex;flex-direction:column;min-height:0}
.section{margin-bottom:20px}                     /* globalStyles.section */
.sectionTitle{margin-bottom:16px}
.detail{display:flex;flex-direction:row;flex-wrap:wrap}
.subDetails{margin-left:8px}

/* ---- bottom tab bar (createBottomTabNavigator) ---- */
#tabbar{
  flex:0 0 auto;height:62px;background:var(--card);border-top:1px solid var(--border);
  display:flex;align-items:stretch;position:relative;z-index:4;
}
#tabbar.hidden{display:none}
#tabbar .tab{
  flex:1;border:0;background:none;cursor:pointer;padding:7px 0 9px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--tabInactive);
}
/* tabBarIcon: ONE icon family for every tab (navigation/index.tsx iconMap —
   check-to-slot / list-check / building-columns / gear, size 22). The old
   E/T/A letters beside a gear were replaced in the UI design pass. */
#tabbar .tab .tlabel{font-size:12px;font-weight:700;letter-spacing:.1px}
#tabbar .tab.active{color:var(--text)}
#tabbar .tab .tbadge{
  position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--notification);color:var(--light);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}

/* ---- globalStyles.cardSurface ---- */
.cardSurface{
  border-radius:16px;padding:16px;margin:10px 4px;background:var(--card);
  box-shadow:var(--cardShadow);
}
.card-row{display:flex;flex-direction:row;align-items:center}
.card-img{width:56px;height:56px;border-radius:4px;object-fit:cover;flex:0 0 auto;background:var(--accent)}
.card-content{flex:1;min-width:0;margin-right:8px;padding-right:8px}
.card-content.with-img{margin-left:16px}
.card-chevron{margin-left:8px;flex:0 0 auto}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.infoline{display:flex;flex-direction:row;align-items:center;margin-top:2px;min-width:0}
.infoline .il-label{flex:0 0 auto}
.infoline .il-value{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- CustomButton ---- */
.btn{
  border:0;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;
  gap:12px;position:relative;width:auto;align-self:stretch;
  font-size:16px;font-weight:600;text-transform:uppercase;text-align:center;
  background:var(--accent);color:var(--text);
}
.btn:active{filter:brightness(.94)}
/* RN: a CustomButton in a column View stretches (alignSelf auto → stretch), so
   outside a row it spans the container minus its 4px side margins. */
.btn{width:calc(100% - 8px)}
.btn.tall{border-radius:28px;padding:16px 32px;margin:8px 4px;min-height:56px}
.btn.thin{border-radius:18px;padding:6px 22px;margin:8px 4px;min-height:36px}
.btn.disabled{opacity:.5;cursor:default;pointer-events:none}
.btn .righticon{position:absolute;right:16px;top:0;bottom:0;display:flex;align-items:center}
.btnrow{display:flex;flex-direction:row;gap:16px;padding:0 20px}
.btnrow .btn{flex:1;margin-left:0;margin-right:0;width:auto}

/* ---- ChipButton ---- */
.chip{
  display:inline-flex;flex-direction:row;align-items:center;height:32px;padding:0 20px;
  border-radius:16px;gap:8px;background:var(--accent);color:var(--text);
  border:0;cursor:pointer;font-family:inherit;font-size:16px;line-height:24px;
  align-self:flex-start;max-width:100%;
}
.chip .ctext{text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .cicon{
  width:24px;height:24px;border-radius:12px;background:var(--dark);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.chip.full{align-self:stretch;justify-content:center;height:48px;padding:0 28px;border-radius:24px;margin:8px 0}
.chip.disabled{opacity:.5;pointer-events:none}
.chiprow{display:flex;flex-direction:row;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ---- SyncChip ---- */
.syncchip{
  display:flex;flex-direction:row;align-items:center;height:32px;padding:0 12px;
  border-radius:16px;gap:8px;background:var(--card);
}

/* ---- CustomTextInput ---- */
.field{margin-bottom:10px}
.field .ftitle{display:flex;align-items:center;justify-content:space-between}
.field .fwrap{position:relative;margin-top:8px;display:flex;flex-direction:row;align-items:center}
.field input,.field textarea{
  flex:1;min-width:0;padding:14px;border-radius:28px;font-size:14px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-family:inherit;outline:0;
}
.field textarea{border-radius:16px;resize:none}
.field input::placeholder,.field textarea::placeholder{color:var(--textSecondary);font-style:italic}
.field .ficon{margin-left:10px;margin-right:6px;flex:0 0 auto;display:flex}

/* ---- CollapsibleSection ---- */
.collapse{margin-top:16px}
.collapse .ctitle{display:flex;flex-direction:row;align-items:center;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;color:var(--text);width:100%;text-align:left}
.collapse .ctitle .cchev{margin-right:16px;display:flex}
.collapse .csearch{
  display:flex;flex-direction:row;align-items:center;padding:8px;padding-left:16px;
  margin:8px 0;border-radius:32px;border:1px solid var(--border);background:var(--card);gap:8px;
}
.collapse .csearch input{flex:1;min-width:0;border:0;outline:0;background:none;padding:4px;color:var(--text);font-family:inherit;font-size:16px}
.collapse .csearch input::placeholder{color:var(--text)}

/* ---- Footer (components/Footer.tsx) ---- */
.footer{
  flex:0 0 auto;padding:16px;background:var(--card);box-shadow:var(--footerShadow);
  position:relative;z-index:3;
}
.footer.row{display:flex;flex-direction:row;gap:16px;padding-left:20px;padding-right:20px}
.footer.row>.btn{flex:1;margin-left:0;margin-right:0;width:auto}
.adminCheck .btn,.btn.inline{width:auto}

/* ---- Switch (RN Switch) ---- */
.sw{width:51px;height:31px;border-radius:16px;background:var(--accent);position:relative;cursor:pointer;flex:0 0 auto;border:0;padding:0;transition:background .15s}
.sw.on{background:var(--primary)}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .15s}
.sw.on i{left:22px}
.row-between{display:flex;flex-direction:row;justify-content:space-between;align-items:center;margin-bottom:16px}

/* ---- status pill (pill.ts + VerdictBadge/RegistrantRow) ---- */
.pill{
  display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  padding:2px 8px;border-radius:10px;font-size:14px;line-height:20px;font-weight:600;
}
/* TaskCard chip — height 24, radius 12 */
.taskchip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:12px;align-self:flex-start;margin-bottom:4px;font-size:14px;line-height:20px}
.banner{display:flex;flex-direction:row;align-items:center;gap:8px;margin-bottom:12px}
.radio{display:flex;flex-direction:row;align-items:center;gap:8px;padding:4px 0;cursor:pointer;background:none;border:0;font-family:inherit;color:var(--text);font-size:15px;text-align:left}
.radio .ro{width:20px;height:20px;border-radius:10px;border:2px solid var(--textSecondary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.radio.on .ro{border-color:var(--primary)}
.radio .ri{width:10px;height:10px;border-radius:5px;background:var(--primary)}
.radiorow{display:flex;flex-direction:row;gap:24px}
.bullet{display:flex;flex-direction:row}
.emptystate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:12px;text-align:center}
.centerstate{flex:1;display:flex;align-items:center;justify-content:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--primary);border-top-color:transparent;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;line-height:24px;word-break:break-all;margin-bottom:8px}
.authimg{width:200px;height:200px;border-radius:8px;align-self:center;margin:16px auto;display:block;background:var(--accent);object-fit:cover}
.officerentry{margin:12px 0}
.officer-img{width:56px;height:56px;border-radius:4px;margin-bottom:8px;background:var(--accent)}
.officer-status{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.removebtn{width:24px;height:24px;border-radius:12px;border:1px solid var(--error);display:flex;align-items:center;justify-content:center;background:none;cursor:pointer;flex:0 0 auto}
.adminCheck{display:flex;flex-direction:row;align-items:center;margin-top:12px;gap:12px}
.confirmcard{border-radius:16px;padding:16px;margin:10px 4px;background:var(--card);box-shadow:var(--cardShadow)}
.stepper{display:inline-flex;flex-direction:row;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;align-self:flex-start}
.stepper button{width:40px;height:40px;background:var(--card);border:0;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;color:var(--text)}
.stepper .val{min-width:40px;text-align:center;font-size:16px;font-weight:600}
.leftmark{border-left:4px solid var(--warning)}
/* 44x44 header-row glyph button (NetworksScreen exportIconButton) */
.iconbtn{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;padding:0}
/* components/DateField.tsx pill */
.datepill{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:10px;padding:12px 14px;border-radius:28px;border:1px solid var(--border);background:var(--card)}
/* ElectionRevisionForm removable tag chip */
.tagchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card)}
/* VerificationChecklist row: 44pt tap target, 44pt glyph box */
.checkrow{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:44px;width:100%;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;color:var(--text);text-align:left}
.glyph44{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
/* AssociationRequestApproval candidate row / ReassociationReviewToggle option row */
.candrow{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:44px;width:calc(100% - 8px);cursor:pointer;font-family:inherit;color:var(--text)}
.candrow.off{cursor:default}
.optrow{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:44px;width:100%;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;color:var(--text)}
/* invite share text: monospace, numberOfLines={4} */
.mono4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:20px}
input:disabled,textarea:disabled{opacity:.6}

/* presentation:'modal' route — slides up over the whole app */
.routemodal{
  position:absolute;left:0;right:0;top:16px;bottom:0;z-index:30;background:var(--background);
  border-radius:12px 12px 0 0;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 -6px 28px rgba(0,0,0,.35);animation:slideup .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.routemodal .navheader{border-radius:12px 12px 0 0}
.modal-scrim{position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.28)}

/* language dropdown (SettingsScreen) */
.langwrap{position:relative}
.langbtn{display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--text);border:0;border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600}
.langmenu{position:absolute;top:48px;right:0;border-radius:8px;min-width:140px;z-index:999;background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.15);overflow:hidden}
.langmenu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;background:none;border:0;cursor:pointer;font-family:inherit;font-size:16px;color:var(--text);gap:8px}
.langmenu button.on{background:color-mix(in srgb, var(--primary) 20%, transparent)}

/* ---- dev drawer (prototype-only affordance) ---- */
#devfab{
  position:absolute;right:12px;bottom:74px;z-index:45;width:44px;height:44px;border-radius:50%;
  background:#111;color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
#devdrawer{position:absolute;inset:0;z-index:60;background:var(--background);display:none;flex-direction:column}
#devdrawer.open{display:flex}
#devdrawer .dhead{
  padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;background:var(--card);
}
#devdrawer .dhead h2{margin:0;font-size:18px;font-weight:700;color:var(--text)}
#devdrawer .dbody{flex:1;overflow-y:auto;padding:12px 16px 28px}
.dgroup{margin-top:18px}
.dgroup:first-child{margin-top:4px}
.dgroup h3{
  margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--textSecondary);
}
.ditem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:15px;color:var(--text);
}
.ditem:active{filter:brightness(.95)}
.ditem .dsub{display:block;font-size:12px;color:var(--textSecondary);margin-top:2px}
.badge{
  flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:999px;
  background:#fde2df;color:#a02216;text-transform:uppercase;
}
:root[data-theme="dark"] .badge{background:#4a1b16;color:#f0a79c}
.badge.state{background:#e3f0fd;color:#14538f}
:root[data-theme="dark"] .badge.state{background:#14304a;color:#8ec4f5}
.badge.dev{background:#e7e2fb;color:#4b2ea0}
:root[data-theme="dark"] .badge.dev{background:#2b2350;color:#bfb0f5}
.dnote{font-size:12px;line-height:17px;color:var(--textSecondary);margin:2px 0 10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:78px;min-height:38px;padding:0 12px;border-radius:999px;cursor:pointer;
  background:var(--card);color:var(--textSecondary);border:1px solid var(--border);
  font-family:inherit;font-size:14px;
}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
</style>
</head>
<body>

<div id="device">
  <div id="statusbar">
    <span id="sb-clock">10:30</span>
    <span class="sb-icons" id="sb-icons"></span>
  </div>
  <div id="chrome"></div>
  <div id="screen"></div>
  <div id="tabbar"></div>
  <div id="overlays"></div>
  <button id="devfab" title="All screens (prototype navigator)" aria-label="All screens"></button>
  <div id="devdrawer" role="dialog" aria-label="All screens"></div>
</div>

<script>
"use strict";
/* ============================================================================
 * VoteTorrent — Authority app · interactive HTML recreation
 *
 * Source of truth: apps/VoteTorrentAuthority/src
 *   navigation/{index.tsx,types.ts} · theme/{themes,styles}.ts · i18n/index.ts
 *   components/** · screens/** · providers/**
 *
 * Navigation topology (navigation/index.tsx) — deliberately NOT the voter
 * app's shape. Here the ROOT is a native stack whose FIRST screen ("Home")
 * is the 4-tab bottom Tab.Navigator. Every other route is pushed onto that
 * ROOT stack, i.e. ABOVE the tabs — so the tab bar disappears the moment you
 * leave a tab, and "back" returns to whichever tab you left from.
 * ========================================================================= */

/* ---------------------------------------------------------------------------
 * 1. ICONS — the FontAwesome6 (Free) glyph names the app actually asks for,
 *    drawn as inline SVG. Names match the `FontAwesome6 name=` props 1:1.

/** components/ThemedText.tsx */
function T(type, text, cls, style){
  /* Flex containers trim leading/trailing whitespace inside a flex item; RN's
     <Text> does not. The app relies on that trailing space ("Name: " + value),
     so pin it with an NBSP or every label/value pair renders as "Name:Value". */
  const t2 = String(text).replace(/^ +/,m=>'&nbsp;'.repeat(m.length))
                         .replace(/ +$/,m=>'&nbsp;'.repeat(m.length));
  return '<span class="t-'+type+(cls?' '+cls:'')+'"'+(style?' style="'+style+'"':'')+'>'+t2+'</span>';
}
/** components/CustomButton.tsx */
function Button(o){
  const bg = o.bg || 'var(--accent)';
  let fg = o.forceDarkText ? 'var(--dark)' : 'var(--text)';
  if(o.bg==='var(--success)'||o.bg==='var(--error)'||o.bg==='var(--primary)') fg='var(--light)';
  return '<button class="btn '+(o.size==='thin'?'thin':'tall')+(o.disabled?' disabled':'')+(o.inline?' inline':'')+'"'
    + ' style="background:'+bg+';color:'+fg+(o.flex?';flex:1':'')+'"'
    + ' data-act="'+(o.act||'noop')+'"'+(o.data?' data-id="'+esc(o.data)+'"':'')+'>'
    + (o.icon?icon(o.icon,20,fg):'')
    + '<span style="flex-shrink:1">'+esc(o.title).toUpperCase()+'</span>'
    + (o.rightIcon?'<span class="righticon">'+icon(o.rightIcon,20,fg)+'</span>':'')
    + '</button>';
}
/** components/ChipButton.tsx */
function Chip(o){
  return '<button class="chip'+(o.full?' full':'')+(o.disabled?' disabled':'')+'"'
    + ' data-act="'+(o.act||'noop')+'"'+(o.data?' data-id="'+esc(o.data)+'"':'')+'>'
    + (o.icon?'<span class="cicon">'+icon(o.icon,16,'var(--light)')+'</span>':'')
    + '<span class="ctext">'+esc(o.label).toUpperCase()+'</span></button>';
}
/** components/SyncChip.tsx — configFault takes precedence over syncState (D-14 / 56-10) */
function SyncChip(){
  /* icon keeps `warning`; the LABEL uses the text-safe `warningText` token. */
  const p = S.configFault
    ? {icon:'triangle-exclamation', color:'var(--warning)', text:'var(--warningText)', label:t('syncNotConfigured')}
    : ({connected:{icon:'wifi',        color:'var(--success)', text:'var(--success)',     label:t('syncConnected')},
        syncing:  {icon:'rotate',      color:'var(--warning)', text:'var(--warningText)', label:t('syncSyncing')},
        offline:  {icon:'link-slash',  color:'var(--error)',   text:'var(--error)',       label:t('syncOffline')}})[S.syncState];
  return '<div class="syncchip">'+icon(p.icon,14,p.color)

/** components/InfoCard.tsx — `titleType` (default cardTitle): plain navigation

  const info=(o.info||[]).map(i=>'<div class="infoline">'

/** components/CustomTextInput.tsx — `imageUrl` mirrors isImageUrlField: the title
 *  row carries a MAKE PERMANENT chip (disabled on an empty URL or while a pin
 *  runs) and, when "Show help icons" is on, the circle-info glyph. `status` is
 *  the permanentStatus line under the input (hooks/useMediaPin): muted while
 *  pinning, primary once permanent, error on a failed fetch. */
function Field(o){
  const statusColor = !o.status ? '' : o.status.tone==='error' ? 'var(--error)'
                    : o.status.tone==='success' ? 'var(--primary)' : 'var(--textSecondary)';
  const titleRight = o.imageUrl
    ? '<span style="display:flex;align-items:center;gap:8px">'
        + Chip({label:t('makePermanent'), act:o.pinAct||'noop', disabled:!(o.value||'').trim()||o.pinning})
        + (S.showHelpIcons?icon('circle-info',16,'var(--text)'):'')+'</span>'
    : (o.right||'');
  return '<div class="field">'
    + (o.title?'<div class="ftitle">'+T('defaultSemiBold',esc(o.title))+titleRight+'</div>':'')
    + '<div class="fwrap">'
      + (o.multiline
          ? '<textarea rows="'+(o.rows||3)+'" placeholder="'+esc(o.placeholder||o.title||'')+'"'
            +(o.field?' data-field="'+o.field+'"':'')+(o.disabled?' disabled':'')+'>'+esc(o.value||'')+'</textarea>'
          : '<input type="text" value="'+esc(o.value||'')+'" placeholder="'+esc(o.placeholder||o.title||'')+'"'
            +(o.field?' data-field="'+o.field+'"':'')+(o.disabled?' disabled':'')+'>')
      + (o.icon?'<span class="ficon">'+icon(o.icon,20,o.iconColor||'var(--text)')+'</span>':'')
    + '</div>'
    + (o.status?'<div style="margin:6px 0 0 14px;font-size:13px;line-height:18px;color:'+statusColor+'">'+esc(o.status.label)+'</div>':'')
    + '</div>';
}

        ? '<div style="display:flex;align-items:center;gap:8px;margin-bottom:'+(o.headGap||8)+'px">'

/** registration/components/LifecycleConfirmCard.tsx — 4px LEFT border (error when
 *  destructive, border otherwise), defaultSemiBold title, `default` body, then a
 *  two-slot row (gap 8): dismiss FIRST (left), confirm second. The typed variant
 *  is always destructive and arms only on a case-insensitive trimmed match. */
function ConfirmCard(o){
  const destructive = o.variant==='typed' || o.tone==='destructive';
  const armed = o.variant!=='typed' || (S.typedConfirm.trim().toLowerCase()===String(o.matchText||'').trim().toLowerCase() && S.typedConfirm.trim()!=='');

/** screens/tasks/components/ThresholdProgressNote.tsx — small / textSecondary /
 *  lineHeight 20. Nothing at threshold<=1, on a null status, or when the session
 *  is unreachable. At/after the threshold it reads "Threshold reached" however
 *  many signatures arrived. Never a reject count (no veto framing). */
function ThresholdNote(st){
  if(!st || st.threshold<=1 || st.unreachable) return '';
  const text = st.reached ? t('signatureTaskThresholdReached')
                          : t('signatureTaskThresholdProgress',{signed:st.signatures, threshold:st.threshold});
  return '<div>'+T('small',esc(text),'muted','line-height:20px')+'</div>';
}

/** screens/tasks/components/TaskCard.tsx — the image renders only when the
 *  network/authority has an imageUrl (none in this mock), so content starts at
 *  marginLeft 16 with no thumbnail. Chip → title → threshold note → date →
 *  subtitle → network. */
function TaskCard(task){
  const chip = task.type==='release-key'
    ? {label:t('chipRelease'),   color:'var(--important)'}
    : {label:t('chipSignature'), color:'var(--accent)'};
  const sub = task.subtitle==='@readyRemaining' ? t('ready')+' - '+t('remaining') : t(task.subtitle);
  return '<div class="cardSurface card-row" style="position:relative;cursor:pointer" data-act="open-task" data-id="'+esc(task.signatureType||task.type)+'">'
    + '<div class="card-content with-img">'
      + '<div class="taskchip" style="background:'+chip.color+'">'+T('small',esc(chip.label).toUpperCase())+'</div>'
      + T('cardTitle',esc(task.title),'ell')
      + ThresholdNote(S.tasksNoThreshold?null:task.status)
      + (task.date?T('defaultSemiBold',esc(task.date),'ell'):'')
      + T('default',esc(sub),'ell')
      + '<div style="opacity:.6;margin-top:4px">'+T('small',esc(task.network),'ell')+'</div>'
    + '</div>'
    + '<span class="card-chevron">'+icon('chevron-right',20,'var(--text)')+'</span>'
    + '<span style="position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:7px;background:var(--notification)"></span>'
    + '</div>';
}

/** screens/tasks/TasksScreen.tsx */
function TasksTab(){
  if(!S.hasNetwork) return NoNetwork();
  const err = S.tasksLoadError ? InlineError('signatureTasksEngine: strand read timed out') : '';
  if(S.tasksEmpty){
    return '<div class="emptystate" style="justify-content:center;padding-top:48px">'
      + err
      + icon('clipboard-list',48,'var(--textSecondary)')
      + T('title',esc(t('noTasks')))
      + T('default',esc(t('noTasksHelper')))
      + '</div>';
  }
  const groups = [];
  TASKS.forEach(task=>{
    let g = groups.find(x=>x.key===task.group);
    if(!g){ g={key:task.group, items:[]}; groups.push(g); }
    g.items.push(task);
  });
  return '<div class="scroll"><div class="screenpad">'
    + err
    + groups.map(g=>'<div class="section">'+T('title',esc(g.key))
        + '<div>'+g.items.map(TaskCard).join('')+'</div></div>').join('')
    + '</div></div>';
}

RegistrationRequestApproval:{ header:'stack', title:()=>t('registrationRequestApprovalScreenTitle'), body(){
  const r=S.selectedRequest, q=S.rq;
  const mode = r.status==='p' ? 'pending' : r.status==='a' ? 'approved' : 'rejected';
  const thresholdAboveOne = !!(q.signing && q.signing.threshold>1);
  const unreachable = mode==='pending' && q.unreachable;
  const closedDup = q.closedDup;
  const UNREAD = {'not-a-recipient':'registrationContentNotRecipient','no-opener':'registrationContentNoKey',
                  'unreadable':'registrationContentUnreadable','tampered':'registrationContentTampered'};
  const unreadKey = UNREAD[r.payloadAccess];
  const readable = !unreadKey;
  const voteRecorded = mode==='pending' && thresholdAboveOne && !q.task && !unreachable && readable;
  const gateMet = checklistGateMet(q.checked);
  const canDecide = S.canWrite;
  const approveDisabled = !gateMet || !canDecide || q.dupCheckFailed || closedDup || (thresholdAboveOne && !q.task) || !readable;
  const rejectDisabled = !canDecide || closedDup || (thresholdAboveOne && !q.task) || (!readable && r.payloadAccess!=='tampered');
  const err = q.dupCheckFailed ? t('possibleDuplicateCheckFailed') : (q.carry||'');
  const rows = [[t('registrationRequestApprovalReceivedAtLabel'), fmtDate(r.receivedAt)],
                [t('registrationRequestApprovalSubmittedAtLabel'), fmtDate(r.submittedAt)],
                ['lastName', r.name.split(',')[0]], ['firstName',(r.name.split(',')[1]||'').trim()], ['district','SD-08'],
                ['dateOfBirth','1990-02-11'],
                [t('registrationRequestApprovalRequesterKeyLabel'), '04e2b...']];
  const CHECKS=[['id','verificationChecklistItemId'],['roll','verificationChecklistItemRoll'],
                ['eligibility','verificationChecklistItemEligibility'],['none','verificationChecklistItemNone']];
  const readOnly = mode!=='pending';
  return '<div class="fill"><div class="scroll"><div class="screenpad" style="padding-bottom:24px">'
    + (err ? '<div data-testid="registration-request-approval-error">'+InlineError(err)+'</div>' : '')
    /* no scope banner on this screen: without `vrg` both decision buttons are simply disabled */
    /* BridgeSourceCallout — sitemap glyph, warning left border; the bridge's
       assertion, not a signature from the registrant */
    + (r.issuerType==='bridge'
        ? Callout({border:'var(--warning)', icon:'sitemap', heading:t('bridgeSourceCalloutHeading'), headGap:4,
                   body:T('default',esc(t('bridgeSourceCalloutBody',{bridgeLabel:r.bridgeLabel})))}) : '')
    + (r.hasPriorRejections
        ? Callout({border:'var(--warning)', icon:'circle-exclamation', heading:t('priorRejectionsCalloutHeading'),
                   body:T('small',esc(t('priorRejectionsCalloutRow',
                     {date:fmtDate(now-95*DAY), officer:'bafy…u-2222', reason:'Address could not be verified'})),'muted')}) : '')
    /* PossibleDuplicateCallout — directly beneath prior rejections; never for a closed request */
    + (q.duplicate && !closedDup && mode==='pending'
        ? Callout({border:'var(--warning)', icon:'circle-exclamation', heading:t('possibleDuplicateHeading'),
                   body:T('default',esc(t('possibleDuplicateBody',{name:'Okonkwo, Ada'})))
                     + '<div style="margin-top:8px">'+Chip({label:t('possibleDuplicateViewOtherButton'), full:true, act:'open-other-request'})+'</div>'}) : '')
    + (!unreachable ? ThresholdNote(q.signing) : '')
    + (voteRecorded ? '<div>'+T('small',esc(t('signatureTaskThresholdVoteRecorded')),'muted')+'</div>' : '')
    + (closedDup
        ? '<div style="margin-bottom:12px;display:flex;flex-direction:column;gap:8px">'
          + TintPill(t('possibleDuplicateClosedLabel'),'var(--warning)')
          + Chip({label:t('possibleDuplicateViewOtherButton'), full:true, act:'open-other-request'})+'</div>' : '')
    + (unreachable
        ? '<div style="margin-bottom:12px;display:flex;flex-direction:column;gap:8px">'
          + TintPill(t('registrationRequestStatusRejected'),'var(--error)')
          + T('small',esc(t('signatureTaskThresholdUnreachable')))+'</div>' : '')
    /* an unread payload renders WHY, in place of the summary and the checklist */
    + (!readable
        ? Callout({border:'var(--warning)', icon:'circle-exclamation', inline:t(unreadKey), alignTop:true})
        : '<div class="cardSurface" data-testid="registration-request-approval-summary">'
            + T('title',esc(t('registrationRequestApprovalSummaryTitle')))
            + rows.map(x=>'<div style="margin-bottom:8px">'+T('small',esc(x[0]),'muted')+'<div>'+T('default',esc(x[1]))+'</div></div>').join('')
          + '</div>'
          + '<div class="cardSurface" data-testid="verification-checklist">'
            + T('defaultSemiBold',esc(t('verificationChecklistSectionTitle')))
            + CHECKS.map(c=>{ const on=q.checked.indexOf(c[0])>=0;
                return '<button class="checkrow" data-act="'+(readOnly?'noop':'toggle-check')+'" data-id="'+c[0]+'" role="checkbox" aria-checked="'+on+'"'+(readOnly?' style="cursor:default"':'')+'>'
                  + '<span class="glyph44">'+icon(on?'square-check':'square',20,on?'var(--success)':'var(--textSecondary)')+'</span>'
                  + '<span class="t-defaultSemiBold" style="flex:1">'+esc(t(c[1]))+'</span></button>'; }).join('')
            + T('small',esc(t('verificationChecklistBindingNotice')),'muted')
            + (readOnly ? '<div>'+T('small',esc(t('verificationChecklistDecidedAtLabel')+': '+fmtDate(now-1*DAY)),'muted')+'</div>' : '')
          + '</div>')
    + (mode==='approved'
        ? '<div>'+T('default',esc(t('registrationRequestApprovalApprovedByLabel',{officer:'bafy…u-1111', date:fmtDate(now-1*DAY)})))+'</div>'
          + Button({title:t('registrationRequestApprovalViewRegistrantButton'), act:'open-registrant', data:REGISTRANTS[0].registrantId}) : '')
    + (mode==='rejected'
        ? '<div style="display:flex;flex-direction:column">'+TintPill(t('registrationRequestStatusRejected'),'var(--error)')
          + T('default','Duplicate of an existing registration')+T('small','bafy…u-2222')+T('tiny',fmtDate(now-1*DAY))+'</div>' : '')
    + '</div></div>'
    /* stacked (no `row`) footer: a two-across row clipped APPROVE REGISTRATION.
       Neither decided mode, an unreachable session, nor an open reject card renders it. */
    + (mode==='pending' && !unreachable && !S.rejectOpen
        ? Footer(Button({title:t('registrationRequestApprovalApproveButton'), icon:'check', bg:'var(--success)', size:'thin', disabled:approveDisabled, act:'rq-approve'})
               + Button({title:t('registrationRequestApprovalRejectButton'), icon:'xmark', bg:'var(--error)', size:'thin', disabled:rejectDisabled,
                         act:thresholdAboveOne?'rq-vote-reject':'open-reject'}))
        : '')
    /* RejectReasonCard — CONFIRM REJECTION arms only once a non-blank reason is typed */
    + (mode==='pending' && S.rejectOpen
        ? '<div class="confirmcard" style="border-left:4px solid var(--error)" data-testid="reject-reason-card">'
          + T('defaultSemiBold',esc(t('registrationRequestRejectTitle')))+'<div></div>'
          + T('default',esc(t('registrationRequestRejectBody',{name:r.name})))
          + Field({placeholder:t('registrationRequestRejectReasonPlaceholder'), multiline:true, rows:2, value:S.rejectReason, field:'rejectReason'})
          + '<div class="btnrow" style="padding:0;gap:8px;margin-top:8px">'
            + Button({title:t('registrationRequestRejectKeepReviewingButton'), size:'thin', flex:true, act:'close-reject'})
            + Button({title:t('registrationRequestRejectConfirmButton'), size:'thin', flex:true, bg:'var(--error)',
                      disabled:S.rejectReason.trim()==='', act:'close-reject'})
          + '</div></div>'
        : '')
    + '</div>';
  }},

ProvisionSigningKey:{ header:'stack', title:()=>t('signingKeyProvisioningScreenTitle'), body(){
  const p=S.signingPhase;
  const heading=(k,color)=>'<div style="font-size:20px;line-height:26px;font-weight:700;color:'+(color||'var(--text)')+'">'+esc(t(k))+'</div>';
  const bodyTxt=(k,muted)=>'<div style="margin:8px 0 16px">'+T('small',esc(t(k)),muted?'muted':'','line-height:20px')+'</div>';
  const iconRow=(name,color)=>'<div style="display:flex;justify-content:center;margin:24px 0 12px">'+icon(name,32,color)+'</div>';
  if(p==='success'||p==='awaiting-network'){
    const aw=p==='awaiting-network';
    return pad(iconRow('circle-check','var(--success)')
      + heading(aw?'signingKeyProvisioningAwaitingNetworkHeading':'signingKeyProvisioningSuccessHeading')
      + bodyTxt(aw?'signingKeyProvisioningAwaitingNetworkBody':'signingKeyProvisioningSuccessBody',true)
      + Button({title:t('signingKeyProvisioningContinueButton'), act:'back'}));
  }
  if(p==='network-user-unresolved'){
    return pad(iconRow('triangle-exclamation','var(--warning)')
      + heading('signingKeyProvisioningNetworkUserUnresolvedHeading')
      + bodyTxt('signingKeyProvisioningNetworkUserUnresolvedBody',true)
      + Button({title:t('signingKeyProvisioningNetworkUserUnresolvedRetryButton'), act:'provision-key'}));
  }
  /* the two terminals: no icon and NO button — an accent dead-end button would lie */
  if(p==='no-recovery'){
    return pad(heading('signingKeyProvisioningNoRecoveryHeading','var(--error)')+bodyTxt('signingKeyProvisioningNoRecoveryBody'));
  }
  if(p==='recovery-unsupported-os'){
    return pad(heading('signingKeyProvisioningRecoveryUnsupportedOsHeading','var(--error)')+bodyTxt('signingKeyProvisioningRecoveryUnsupportedOsBody'));
  }
  const first = p!=='recovery' && p!=='recovery-error';
  const err = (p==='first-run-error'||p==='recovery-error') ? t('deviceSigningErrorLockout') : '';
  return pad(iconRow(first?'fingerprint':'key',first?'var(--text)':'var(--warning)')
    + heading(first?'signingKeyProvisioningFirstRunHeading':'signingKeyProvisioningRecoveryHeading')
    + bodyTxt(first?'signingKeyProvisioningFirstRunBody':'signingKeyProvisioningRecoveryBody',true)
    + InlineError(err)
    + Button({title:t(first?'signingKeyProvisioningSetupButton':'signingKeyProvisioningRecoveryButton'), act:'provision-key'}));
  }},

DashboardSignInCode:{ header:'stack', title:()=>t('dashboardSignInCodeTitle'), body(){
  const st=S.signinState;
  const remaining = Math.max(0, Math.round((S.signinExpiresAt-Date.now())/1000));
  const label = Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');
  const armed = S.exportConfirmText.trim().toLowerCase()==='i confirm';
  let body='';
  if(st==='uploading') body += '<div style="margin-bottom:16px">'+T('default',esc(t('dashboardSignInCodeUploading')))+'</div>';
  if(st==='idle')      body += '<div style="margin-bottom:16px">'+T('default',esc(t('dashboardSignInCodeIdle')))+'</div>';
  if(st==='generated') body += '<div style="margin-bottom:16px">'+T('default',esc(t('dashboardSignInCodeBody',{minutes:10})))+'</div>'
    /* 84 chars — it WRAPS. numberOfLines={1} clipped the value the officer
       is meant to read aloud (the 47/50 UI defect class). */
    + '<div class="code">'+esc(SIGNIN_CODE)+'</div>'
    + '<div style="margin-bottom:16px">'+T('small',esc(t('dashboardSignInCodeCountdown',{remaining:label})))+'</div>'
    + Button({title:t('dashboardSignInCodeCopyButton'), icon:'copy'});
  if(st==='used')    body += '<div style="margin-bottom:16px">'+T('default',esc(t('dashboardSignInCodeUsed')))+'</div>';
  if(st==='expired') body += '<div style="margin-bottom:16px">'+T('default',esc(t('dashboardSignInCodeExpired')))+'</div>';
  const confirming = st==='confirming';
  return '<div class="fill"><div class="scroll"><div class="screenpad">'
    /* no in-body title: the navigation header already shows it directly above */
    + '<div class="section">'+body+'</div>'
    + '</div></div>'
    + (confirming
        ? '<div class="screenpad" style="padding-bottom:0">'
          + '<div style="margin-bottom:16px">'+T('defaultSemiBold',esc(t('dashboardSignInCodeConfirmHeading')))+'</div>'
          + '<div style="margin-bottom:16px">'+T('default',esc(t('dashboardSignInCodeConfirmBody')))+'</div>'
          + Field({title:t('typeIConfirm'), placeholder:t('confirmIfSure'),
                   value:S.exportConfirmText, field:'exportConfirmText'})
          + '</div>' : '')
    + Footer(
        (st!=='generated' && !confirming
          ? Button({title:t('dashboardSignInCodeGenerateButton'), icon:'key',
                    bg:'var(--important)', forceDarkText:true, act:'open-export-confirm'}) : '')
      + (confirming
          ? Button({title:t('dashboardSignInCodeGenerateButton'), icon:'key', bg:'var(--error)',
                    disabled:!armed, act:'do-export'})
            + Button({title:t('cancel'), size:'thin', act:'cancel-export'}) : '')
      + (st==='generated' || st==='used' || st==='expired'
          ? (confirming?'':Button({title:t('dashboardSignInCodeDiscardButton'), icon:'trash', size:'thin', act:'discard-code'})) : ''))
    + '</div>';
  }},

CreateBallot:{ header:'stack', title:()=>t('ballotTemplate'), body(){
  /* Footer: PROPOSE (+ SUBMIT FOR CONFIRMATION once saved) or, while locked,
     WITHDRAW only (warning background, rotate-left). Submitting asks the device
     signer lazily — at threshold 1 no biometric prompt fires. */
  const locked=S.ballotConfirmed;
  return '<div class="fill">'+BallotTemplateForm(locked)
    + InlineError(S.ballotSubmitError?t('deviceSigningErrorGeneric'):'')

/** useTabHeaderOptions() — persistent tab chrome. */
function tabHeader(){
  /* TasksHeaderTitle: "All Networks" — but only once there IS a network; with
     none it is the same "Select Network" control the other tabs show. */
  const title = S.tab==='Tasks' && S.hasNetwork

      + '<button class="hbtn" data-act="go-settings-tab" aria-label="'+esc(t('a11yOpenSettings'))+'">'+icon('circle-user',24,'var(--text)')+'</button>'
    + '</div></div>';

function stackHeader(route, isModal){
  const def=SCREENS[route];
  const title=def.title?def.title():'';
  const btn = isModal
    ? '<button class="hbtn" data-act="back" aria-label="'+esc(t('close'))+'">'+icon('xmark',22,'var(--text)')+'</button>'
    : '<button class="hbtn" data-act="back" aria-label="Back">'+icon('arrow-left',22,'var(--text)')+'</button>';
  return '<div class="navheader has-btn">'+btn
    + '<div class="htitle">'+esc(title)+'</div>'
    + (def.right?'<div class="hright">'+def.right()+'</div>':'')
    + '</div>';
}

function render(){
  document.documentElement.setAttribute('data-theme',S.theme);

  /* AppProvider gates — rendered before any navigator mounts. */
  if(S.appState!=='ready'){
    document.getElementById('chrome').innerHTML='';
    document.getElementById('tabbar').className='hidden';
    /* AppProvider renders PLAIN RN <Text>/<TouchableOpacity> here — no themed
       buttons. "Try Again" / "Start Fresh" / "Failed to load network: " are
       literals in source; only the Syncing label is catalogued. */
    const plain = (txt,act,mt) => '<button data-act="'+act+'" style="background:none;border:0;padding:4px;cursor:pointer;font:inherit;font-size:14px;color:var(--text);margin-top:'+(mt||0)+'px">'+esc(txt)+'</button>';
    document.getElementById('screen').innerHTML = S.appState==='booting'
      ? '<div class="fill" style="align-items:center;justify-content:center;background:var(--background)"><div class="spinner"></div>'
        /* boot re-attach gated on the first-sync wait: Syncing label, then (once the
           budget has elapsed) Start Fresh — Try Again is deliberately NOT offered */
        + (S.bootSyncing ? '<div style="margin-top:16px;text-align:center;font-size:14px;color:var(--text)">'+esc(t('syncSyncing'))+'</div>'
            + plain('Start Fresh','boot-fresh',8) : '')
        + '</div>'
      : '<div class="fill" style="align-items:center;justify-content:center;background:var(--background);padding:24px;text-align:center">'
        + '<div style="margin-bottom:16px;font-size:14px;color:var(--text)">'+esc('Failed to load network: Error: no valid addresses for peer')+'</div>'
        + plain('Try Again','boot-retry') + '<div style="height:8px"></div>'
        + plain('Start Fresh','boot-fresh')
        + '</div>';
    paintStatusBar(); renderDevFab(); return;
  }

  const route = topRoute();
  const isModal = route!=='Home' && SCREENS[route].header==='modal';
  const baseRoute = isModal ? (S.stack[S.stack.length-2] || 'Home') : route;

  /* header chrome for the base screen */
  document.getElementById('chrome').innerHTML =
    baseRoute==='Home' ? tabHeader() : stackHeader(baseRoute,false);

  /* base body */
  let html = baseRoute==='Home' ? TAB_BODY[S.tab]() : SCREENS[baseRoute].body();

  /* presentation:"modal" route slides up over the whole app */
  if(isModal){
    html += '<div class="modal-scrim"></div>'
      + '<div class="routemodal">'+stackHeader(route,true)
      + '<div class="fill" style="overflow:hidden">'+SCREENS[route].body()+'</div></div>';
  }
  document.getElementById('screen').innerHTML = html;

  /* The tab bar belongs to the "Home" route only — every other route is a ROOT
     stack push that sits ABOVE the TabNavigator, so the bar disappears. */
  const tb=document.getElementById('tabbar');
  const showTabs = baseRoute==='Home' && !isModal;
  tb.className = showTabs ? '' : 'hidden';
  tb.innerHTML = showTabs ? TABS.map(x=>{
    const active = S.tab===x.name;
    const color = active ? 'var(--text)' : 'gray';
    const badge = x.name==='Tasks' && TASKS.length>0 && !S.tasksEmpty && S.hasNetwork
      ? '<span class="tbadge">'+TASKS.length+'</span>' : '';
    return '<button class="tab'+(active?' active':'')+'" data-tab="'+x.name+'" aria-label="'+esc(t(x.name.toLowerCase()))+'">'+badge
      + icon(x.glyph,22,color)
      + '<span class="tlabel">'+esc(t(x.name.toLowerCase()))+'</span></button>';
  }).join('') : '';

  paintStatusBar(); renderDevFab();
}

  'rq-approve'(){ if(S.rq.signing && S.rq.signing.threshold>1){ S.rq.task=false; S.rq.signing={threshold:2,signatures:S.rq.signing.signatures+1,reached:S.rq.signing.signatures+1>=2}; render(); } else goBack(); },
  'rq-vote-reject'(){ S.rq.task=false; render(); },
  'open-assoc'(el){ S.assoc=freshAssoc(el.dataset.id); push('AssociationRequestApproval'); },
  'pick-candidate'(el){ S.assoc.candidate=el.dataset.id; render(); },
  'assoc-approve'(){ S.assoc.confirm=true; render(); },
  'assoc-keep'(){ S.assoc.confirm=false; render(); },
  'assoc-confirm'(){ goBack(); },
  'open-reject'(){ S.rejectOpen=true; S.rejectReason=''; render(); },
  'close-reject'(){ S.rejectOpen=false; render(); },
  'toggle-add-form'(){ S.addFormOpen=!S.addFormOpen; render(); },
  'arm-device'(el){ S.confirmDevice=el.dataset.id; render(); },
  'disarm-device'(){ S.confirmDevice=null; render(); },
  'arm-peer'(el){ S.confirmPeer=el.dataset.id; render(); },
  'disarm-peer'(){ S.confirmPeer=null; render(); },

  /* key release ceremony — two biometric prompts the first time, none on a repeat */
  'key-release'(){ if(S.releasePhase!=='idle') return; S.releaseError=null; S.releasePhase='releasing'; render();
    setTimeout(()=>{ S.releasePhase='released'; render(); },900); },
  'kh-send'(){ S.khMode='sent'; render(); },
  'admin-send'(){ S.adminInvMode='sent'; render(); },
  'bis-save'(){ S.bis.bridge='saved'; S.bis.bridgeNotice='saved'; render(); },
  'bis-enable-intake'(){ S.bis.intakeSubmitting=true; render();
    setTimeout(()=>{ S.bis.intakeSubmitting=false; S.bis.intake='enabled'; render(); },700); },
  'reassoc-set'(el){ S.reassoc.mode=el.dataset.id; render(); },

  /* Secure signing + dashboard code */
  'provision-key'(){ S.signingPhase = S.hasNetwork ? 'success' : 'awaiting-network'; render(); },
  'open-export-confirm'(){ S.signinState='confirming'; S.exportConfirmText=''; render(); },
  'cancel-export'(){ S.signinState = S.signinExpiresAt>Date.now() ? 'generated' : 'idle'; render(); },
  'do-export'(){
    S.signinState='uploading'; render();
    setTimeout(()=>{ S.signinState='generated'; S.signinExpiresAt=Date.now()+10*MIN; render(); },900); },
  'discard-code'(){ S.signinState='idle'; S.signinExpiresAt=0; render(); },

  /* boot gates */
  'boot-retry'(){ S.appState='booting'; render(); setTimeout(()=>{S.appState='ready';render();},1400); },
  'boot-fresh'(){ S.appState='ready'; render(); },
};

document.addEventListener('click',ev=>{
  const holder=ev.target.closest('[data-act]');
  if(holder){ const fn=ACTIONS[holder.dataset.act];
    if(fn){ ev.preventDefault(); fn(holder); return; } }
  const tab=ev.target.closest('[data-tab]');
  if(tab){ switchTab(tab.dataset.tab); return; }
  const dev=ev.target.closest('[data-dev]');
  if(dev){ devGo(dev.dataset.dev); return; }
});
/* write-through binding for the two gated text inputs */
document.addEventListener('input',ev=>{
  const el=ev.target.closest('[data-field]'); if(!el) return;
  const f=el.dataset.field, pos=el.selectionStart;
  const path=f.split('.'); let o=S; for(let i=0;i<path.length-1;i++) o=o[path[i]];
  o[path[path.length-1]]=el.value;
  if(path[0]==='an'){ anRefreshError(); if(path[1]==='image') S.an.netPin=null; if(path[1]==='authImage') S.an.authPin=null; }
  if(path[0]==='bis'){ S.bis.bridgeNotice = S.bis.bridgeNotice==='co-sign-required' ? 'co-sign-required' : undefined; }
  render();
  const again=document.querySelector('[data-field="'+f+'"]');
  if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(_){ } }
});
/** AddNetwork: while a "missing fields" error shows, keep it in step with the form —
 *  shrink it as fields fill, clear it once nothing is missing. */
function anRefreshError(){
  if(!S.an.showingMissing) return;
  const m=anMissing();
  if(!m.length){ S.an.error=''; S.an.showingMissing=false; } else S.an.error=anMissingMessage(m);
}
/** useMediaPin.pin(): pinning → pinned (cid) | failed (a non-http(s) URL is invalid-url). */
function pinMedia(key,url){
  S.an[key]='pinning'; render();
  setTimeout(()=>{ S.an[key] = /^https?:\/\/\S+/.test(url.trim()) ? 'pinned' : 'failed'; render(); },900);
}
/* clock + sign-in-code countdown tick */
setInterval(()=>{
  const c=document.getElementById('sb-clock'), n=new Date();
  if(c) c.textContent=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');
  if(S.signinState==='generated' && topRoute()==='DashboardSignInCode'){
    if(S.signinExpiresAt<=Date.now()){ S.signinState='expired'; }
    render();
  }
},1000);

       +'<button data-dev="theme:light" class="'+(S.theme==='light'?'on':'')+'">Light</button>'
       +'<button data-dev="theme:dark" class="'+(S.theme==='dark'?'on':'')+'">Dark</button>'
       +'<button data-dev="lang:en" class="'+(S.lang==='en'?'on':'')+'">English</button>'
       +'<button data-dev="lang:es" class="'+(S.lang==='es'?'on':'')+'">Español</button>'
     +'</div>'
     +'<div class="dnote" data-testid="drawer-counts">'+ROUTE_COUNT+' root-stack routes (Home = the 4-tab navigator) · '+ENTRY_COUNT+' entries below.</div>'
     +'<div class="dnote">Copy is generated from the app’s i18n catalog. The Spanish map now covers every English key ('
       +Object.keys(ES).length+'/'+Object.keys(EN).length+'); a key with no Spanish value would fall back to English exactly as i18next does. '
       +'A few strings are literals in source (boot gate, invite paste placeholder, field names) and stay English in both languages.</div></div>'
     +DEV_GROUPS.map(g=>'<div class="dgroup"><h3>'+esc(g.title)+'</h3>'
        +(g.note?'<div class="dnote">'+esc(g.note)+'</div>':'')
        +g.items.map(i=>'<button class="ditem" data-dev="'+i.id+'"><span style="flex:1;min-width:0">'+esc(i.label)
          +(i.sub?'<span class="dsub">'+esc(i.sub)+'</span>':'')+'</span>'
          +(i.badge?'<span class="badge '+i.badge+'">'+esc(i.badge)+'</span>':'')
          +'</button>').join('')
      +'</div>').join('')
   +'</div>';
}
ACTIONS['close-drawer']=()=>{ document.getElementById('devdrawer').classList.remove('open'); };
document.getElementById('devfab').addEventListener('click',()=>{
  buildDrawer(); document.getElementById('devdrawer').classList.add('open');
});

function devGo(id){
  const drawer=document.getElementById('devdrawer');
  const keepOpen=()=>{ buildDrawer(); drawer.classList.add('open'); render(); };
  if(id.indexOf('theme:')===0){ S.theme=id.split(':')[1]; keepOpen(); return; }
  if(id.indexOf('lang:')===0){  S.lang =id.split(':')[1]; keepOpen(); return; }
  drawer.classList.remove('open');

  /* reset every transient so a dev jump always lands on a clean screen */
  S.appState='ready'; S.bootSyncing=false; S.hasNetwork=true; S.langMenu=false; S.moreOpen=false;
  S.electionsEmpty=false; S.tasksEmpty=false; S.tasksLoadError=false; S.authoritiesEmpty=false; S.authoritiesLoading=false;
  S.registrantsEmpty=false; S.requestsEmpty=false; S.pollingEmpty=false; S.peersEmpty=false;
  S.rejectOpen=false; S.rejectReason=''; S.lifecycleAction=null; S.typedConfirm=''; S.revealPrivate=false;
  S.confirmDevice=null; S.confirmPeer=null; S.addFormOpen=false; S.proposedAdmin=false;
  S.exportConfirmText=''; S.canWrite=true; S.isOfficer=true; S.configFault=null; S.syncState='connected';
  S.noDefaultUser=false; S.noNetworkUser=false; S.noRecentNetworks=false; S.exportTarget=null; S.exportState='confirming';
  S.importState='idle'; S.an=freshAddNetwork(); S.ndProposed=false; S.ndSigned=false; S.ndApplyError=false; S.revPin=undefined;
  S.releasePhase='idle'; S.releaseError=null; S.dkgState='pending'; S.khMode='send'; S.khError=''; S.adminInvMode='send';
  S.edProposed=false; S.edNoKeyholders=false; S.edNoBallots=false; S.edOneBallot=false; S.ceTimelineError=false;
  S.ballotReadOnly=false; S.ballotConfirmed=false; S.ballotSubmitError=false; S.addDeviceState='ready'; S.privateRead='readable';
  S.selectedRegistrant=REGISTRANTS[0]; S.selectedRequest=REQUESTS[0]; S.rq=freshRq(REQUESTS[0]);
  S.assoc=freshAssoc(); S.queueState='rows'; S.bis=freshBis(); S.reassoc=freshReassoc();
  S.taskType='election-revision'; S.taskProcessing=false; S.taskError=false; S.joinError='';
  S.attestProvisioned=false; S.signinState='idle'; S.signinExpiresAt=0; S.signingPhase='first-run';

  const go = (...routes)=>{ S.stack=['Home'].concat(routes); };
  const home = tab => { S.tab=tab; S.stack=['Home']; };
  const [kind,arg] = id.split(':');
  const AUTH=['AuthorityDetails'], INBOX=['AuthorityDetails','RegistrationInbox'];
  switch(kind){
    case 'tab':   home(arg); break;
    case 'sync':  S.configFault = arg==='fault' ? 'no bootstrap peers configured' : null;
                  if(arg!=='fault') S.syncState=arg; home('Elections'); break;
    case 'scope': S.canWrite = arg==='write'; S.isOfficer = arg!=='no-officer';
                  S.tab='Authorities'; go('AuthorityDetails','RegistrantsList'); break;
    case 'dkg':   S.dkgState=arg; S.tab='Elections'; go('ElectionDetails','Keyholder'); break;
    case 'task':  S.taskType=arg; S.tab='Tasks'; go('SignatureTask'); break;
    case 'sealed':S.privateRead=arg; S.tab='Authorities'; go('AuthorityDetails','RegistrantsList','RegistrantDetail'); break;
    case 'signing': S.signingPhase=arg; S.tab='Settings'; go('ProvisionSigningKey'); break;
    case 'add-device': S.addDeviceState=arg; S.tab='Settings'; go('AddDevice'); break;
    case 'reassoc': {
      const r=S.reassoc;
      if(arg==='automatic') r.mode='automatic';
      if(arg==='loading') r.phase='loading';
      if(arg==='co-sign'){ r.refused=true; r.notice='co-sign'; }
      if(arg==='save-error') r.notice='save-error';
      if(arg==='load-error'){ r.phase='unreadable'; r.notice='load-error'; }
      if(arg==='no-vrg') r.noVrg=true;
      S.tab='Elections'; go('ElectionDetails','RegistrationPolicy'); break; }
    case 'rq': {
      const pick = arg==='bridge' ? 'rq-002' : arg==='approved' ? 'rq-003' : arg==='rejected' ? 'rq-004' : 'rq-005';
      const r = Object.assign({}, REQUESTS.find(x=>x.requestId===pick));
      if(['not-a-recipient','no-opener','unreadable','tampered'].indexOf(arg)>=0) r.payloadAccess=arg;
      S.selectedRequest=r; S.rq=freshRq(r);
      if(arg==='checked') S.rq.checked=['id','roll'];
      if(arg==='reject') S.rejectOpen=true;
      if(arg==='threshold') S.rq.signing={threshold:2,signatures:1,reached:false};
      if(arg==='vote-recorded'){ S.rq.signing={threshold:2,signatures:1,reached:false}; S.rq.task=false; }
      if(arg==='unreachable'){ S.rq.signing={threshold:2,signatures:0,reached:false,unreachable:true}; S.rq.unreachable=true; }
      if(arg==='closed-dup') S.rq.closedDup=true;
      if(arg==='dup-check-failed'){ S.rq.dupCheckFailed=true; S.rq.checked=['id']; }
      if(arg==='no-scope'){ S.canWrite=false; S.rq.checked=['id']; }
      if(arg==='approved'||arg==='rejected') S.rq.checked=['id','roll','eligibility'];
      S.tab='Authorities'; go(...INBOX,'RegistrationRequestApproval'); break; }
    case 'assoc': {
      const a=S.assoc=freshAssoc(arg==='identity'||arg==='identity-picked' ? 'identity'
        : ['code-unmatched','code-unverifiable','no-evidence'].indexOf(arg)>=0 ? arg : 'code-matched');
      if(arg==='identity-picked') a.candidate='r-8f21c9ab';
      if(arg==='confirm') a.confirm=true;
      if(arg==='load-error') a.notice='load-error';
      if(arg==='decision-error') a.notice='decision-error';
      if(arg==='co-sign'){ a.notice='co-sign'; a.refused=true; }
      if(arg==='closed') a.status='a';
      if(arg==='no-scope') S.canWrite=false;
      S.tab='Authorities'; go(...INBOX,'AssociationRequestApproval'); break; }
    case 'bis': {
      const b=S.bis;
      if(arg==='loading'){ b.bridge='loading'; b.intake='loading'; b.peerCounts=null; }
      if(arg==='saved'){ b.bridge='saved'; b.draft='https://bridge.utah.gov/intake'; b.rest='success'; }
      if(arg==='invalid') b.draft='http://bridge.local:8080';
      if(arg==='save-error'){ b.draft='https://bridge.utah.gov/intake'; b.bridgeNotice='save-error'; }
      if(arg==='co-sign'){ b.draft='https://bridge.utah.gov/intake'; b.bridgeNotice='co-sign-required'; }
      if(arg==='errors'){ b.fs='error'; b.bridge='saved'; b.draft='https://bridge.utah.gov/intake'; b.rest='error'; b.peerCounts={pending:1,synced:2,failed:1}; }
      if(arg==='never'){ b.fs='never'; }
      if(arg==='intake-enabled') b.intake='enabled';
      if(arg==='intake-error') b.intakeError=true;
      if(arg==='no-counts') b.peerCounts=null;
      if(arg==='readonly') S.canWrite=false;
      S.tab='Authorities'; go(...INBOX,'BulkImportSync'); break; }
    default: devGoSimple(id, go, home);
  }
  render();
}

    case 'settings-no-default': S.noDefaultUser=true; home('Settings'); return;
    case 'settings-no-net-user':S.noNetworkUser=true; home('Settings'); return;
    case 'elections-empty':     S.electionsEmpty=true;   home('Elections'); return;
    case 'tasks-empty':         S.tasksEmpty=true;       home('Tasks'); return;
    case 'tasks-load-error':    S.tasksLoadError=true;   home('Tasks'); return;
    case 'authorities-empty':   S.authoritiesEmpty=true; home('Authorities'); return;
    case 'authorities-loading': S.authoritiesLoading=true; home('Authorities'); return;

    case 'networks-empty':      S.noRecentNetworks=true; S.tab='Elections'; go('Networks'); return;

    case 'import-validating':   S.importState='validating'; S.tab='Elections'; go(...NET,'ImportFoundingBundle'); return;
    case 'import-invalid':      S.importState='invalidSignature'; S.tab='Elections'; go(...NET,'ImportFoundingBundle'); return;
    case 'import-generic':      S.importState='genericError'; S.tab='Elections'; go(...NET,'ImportFoundingBundle'); return;
    case 'import-already':      S.importState='alreadyJoined'; S.tab='Elections'; go(...NET,'ImportFoundingBundle'); return;
    case 'import-success':      S.importState='success'; S.tab='Elections'; go(...NET,'ImportFoundingBundle'); return;
    case 'addnetwork-missing':  S.an.name='Utah Network'; S.an.showingMissing=true; S.an.error=anMissingMessage(anMissing());
                                S.tab='Elections'; go(...NET,'AddNetwork'); return;
    case 'addnetwork-ready':    Object.assign(S.an,{name:'Utah Network', authName:'Utah Lt. Governor', domain:'elections.utah.gov',
                                  adminName:'Deidre Henderson', adminTitle:'Lt. Governor', signed:true, relays:[NETWORK.relays[0]]});
                                S.tab='Elections'; go(...NET,'AddNetwork'); return;
    case 'addnetwork-pinned':   S.an.image='https://elections.utah.gov/img/seal.png'; S.an.netPin='pinned'; S.tab='Elections'; go(...NET,'AddNetwork'); return;
    case 'addnetwork-pin-failed':S.an.image='elections.utah.gov/seal'; S.an.netPin='failed'; S.tab='Elections'; go(...NET,'AddNetwork'); return;
    case 'network-proposed':    S.ndProposed=true; S.tab='Elections'; go(...NET,'NetworkDetails'); return;
    case 'network-apply-cosign':S.ndProposed=true; S.ndApplyError=true; S.tab='Elections'; go(...NET,'NetworkDetails'); return;

    case 'authority-proposed':  S.proposedAdmin=true; S.tab='Authorities'; go('AuthorityDetails'); return;
    case 'admin-invite-sent':   S.adminInvMode='sent'; S.tab='Authorities'; go('AuthorityDetails','ProposedAdministration','AdministratorInvitation'); return;
    case 'admin-invite-accept': S.adminInvMode='accept'; S.tab='Tasks'; go('AdministratorInvitation'); return;
    case 'admin-invite-loading':S.adminInvMode='accept-loading'; S.tab='Tasks'; go('AdministratorInvitation'); return;
    case 'admin-invite-failed': S.adminInvMode='accept-failed'; S.tab='Tasks'; go('AdministratorInvitation'); return;
    case 'admin-invite-no-network':S.adminInvMode='accept-needs-network'; S.hasNetwork=false; S.tab='Tasks'; go('AdministratorInvitation'); return;

    case 'election-proposed':     S.edProposed=true; S.tab='Elections'; go('ElectionDetails'); return;
    case 'election-no-keyholders':S.edNoKeyholders=true; S.tab='Elections'; go('ElectionDetails'); return;
    case 'election-one-ballot':   S.edOneBallot=true; S.tab='Elections'; go('ElectionDetails'); return;
    case 'election-no-ballots':   S.edNoBallots=true; S.tab='Elections'; go('ElectionDetails'); return;
    case 'create-election-order': S.ceTimelineError=true; S.tab='Elections'; go('CreateElection'); return;
    case 'createballot-locked':   S.ballotConfirmed=true; S.tab='Elections'; go('ElectionDetails','CreateBallot'); return;
    case 'editballot-preview':    S.ballotReadOnly=true; S.tab='Elections'; go('ElectionDetails','EditBallot'); return;

    case 'kh-sent':           S.khMode='sent'; S.tab='Elections'; go('ElectionDetails','KeyholderInvitation'); return;
    case 'kh-accept':         S.khMode='accept'; S.tab='Tasks'; go('KeyholderInvitation'); return;
    case 'kh-accept-loading': S.khMode='accept-loading'; S.tab='Tasks'; go('KeyholderInvitation'); return;
    case 'kh-accept-error':   S.khMode='accept-error'; S.tab='Tasks'; go('KeyholderInvitation'); return;

    case 'release-released':  S.releasePhase='released'; S.tab='Tasks'; go('KeyRelease'); return;
    case 'release-error':     S.releaseError='keyholderReleaseError'; S.tab='Tasks'; go('KeyRelease'); return;
    case 'release-auth':      S.releaseError='deviceSigningErrorGeneric'; S.tab='Tasks'; go('KeyRelease'); return;

    case 'registrants-empty':  S.registrantsEmpty=true; S.tab='Authorities'; go('AuthorityDetails','RegistrantsList'); return;
    case 'registrant-revealed':S.revealPrivate=true; S.tab='Authorities'; go('AuthorityDetails','RegistrantsList','RegistrantDetail'); return;

    case 'queue-error':        S.queueState='error'; S.tab='Authorities'; go('AuthorityDetails','RegistrationInbox'); return;
    case 'polling-empty':      S.pollingEmpty=true; S.tab='Authorities'; go('AuthorityDetails','PollingDevices'); return;

    case 'signin-confirming':S.signinState='confirming';S.tab='Settings'; go('DashboardSignInCode'); return;
    case 'signin-generated': S.signinState='generated'; S.signinExpiresAt=Date.now()+10*MIN; S.tab='Settings'; go('DashboardSignInCode'); return;
    case 'signin-used':      S.signinState='used';      S.tab='Settings'; go('DashboardSignInCode'); return;
    case 'signin-expired':   S.signinState='expired';   S.signinExpiresAt=Date.now()-1; S.tab='Settings'; go('DashboardSignInCode'); return;

    case 'booting':      S.appState='booting'; return;
    case 'boot-syncing': S.appState='booting'; S.bootSyncing=true; return;
    case 'bootError':    S.appState='bootError'; return;
  }
  /* plain routes — pushed with a plausible back-stack under them */
  if(!SCREENS[id]) return;
  const UNDER = {
    AuthorityDetails:[], OfficerDetails:['AuthorityDetails'],
    ProposedAdministration:['AuthorityDetails'], EditOfficer:['AuthorityDetails','ProposedAdministration'],
    AdministratorInvitation:['AuthorityDetails','ProposedAdministration'],
    AuthorityInvitation:['AuthorityDetails'],
    RegistrantsList:['AuthorityDetails'], RegistrantDetail:['AuthorityDetails','RegistrantsList'],
    RegistrationInbox:['AuthorityDetails'],
    RegistrationRequestApproval:['AuthorityDetails','RegistrationInbox'],
    AssociationRequestApproval:['AuthorityDetails','RegistrationInbox'],
    BulkImportSync:['AuthorityDetails','RegistrationInbox'],
    AssociationRequestStatus:['AuthorityDetails','RegistrationInbox'],
    PollingDevices:['AuthorityDetails'], AuthorityPeers:['AuthorityDetails'],
    ElectionDetails:[], RegistrationPolicy:['ElectionDetails'],
    EditElectionRevision:['ElectionDetails'], Keyholder:['ElectionDetails'],
    KeyholderInvitation:['ElectionDetails'], EditBallot:['ElectionDetails'], CreateBallot:['ElectionDetails'],
    EditQuestion:['ElectionDetails','EditBallot'],
    EditQuestionOption:['ElectionDetails','EditBallot','EditQuestion'],
    AddNetwork:['Networks'], NetworkDetails:['Networks'], Hosting:['Networks'], ImportFoundingBundle:['Networks'],
    NetworkStatistics:['Networks','NetworkDetails'], NetworkRevision:['Networks','NetworkDetails'],
    UserDetails:[], ReviseUser:['UserDetails'], AddKey:['UserDetails'],
    AddedKey:['UserDetails','AddKey'], RevokeKey:['UserDetails'],
    EditElection:['ScreenScaffoldsDebug'], AuthorityDetail:['ScreenScaffoldsDebug'],
    EditElectionWithFilter:['ScreenScaffoldsDebug'], EditRevisionForm:['ScreenScaffoldsDebug'],
    ProposedElection:['ScreenScaffoldsDebug'], ProposedRevision:['ScreenScaffoldsDebug'],
  };
  const TAB_OF = {Networks:'Elections', AddNetwork:'Elections', NetworkDetails:'Elections', Hosting:'Elections',
    ImportFoundingBundle:'Elections', NetworkStatistics:'Elections', NetworkRevision:'Elections',
    ElectionDetails:'Elections', CreateElection:'Elections', EditElectionRevision:'Elections', RegistrationPolicy:'Elections',
    Keyholder:'Elections', KeyholderInvitation:'Elections', EditBallot:'Elections', CreateBallot:'Elections',
    EditQuestion:'Elections', EditQuestionOption:'Elections',
    SignatureTask:'Tasks', KeyRelease:'Tasks',
    DefaultUser:'Settings', UserDetails:'Settings', ReviseUser:'Settings', AddKey:'Settings', AddedKey:'Settings',
    RevokeKey:'Settings', AddDevice:'Settings', ProvisionSigningKey:'Settings', AttestationProvisioningStatus:'Settings',
    DashboardSignInCode:'Settings', ScreenScaffoldsDebug:'Settings', EditElection:'Settings', AuthorityDetail:'Settings',
    EditElectionWithFilter:'Settings', EditRevisionForm:'Settings', ProposedElection:'Settings', ProposedRevision:'Settings'};
  if(id==='ProvisionSigningKey') S.signingPhase='first-run';
  S.tab = TAB_OF[id] || 'Authorities';
  go(...(UNDER[id]||[]), id);
}

/* boot */
render();
