<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoteTorrent Authority</title>
<style>
/* ============================================================================
   Design tokens — transcribed verbatim from
   apps/VoteTorrentAuthority/src/theme/themes.ts (lightTheme / darkTheme)

   NOTE these are NOT the voter app's tokens. The Authority app runs an
   iOS-system-blue primary (#007AFF / #0A84FF), a pure-white light background,
   a much darker textSecondary (#3F3F3F) and a dark `border` that equals the
   dark `background` (#121212) — a deliberate "borderless in dark" choice that
   this recreation preserves rather than "fixes".

   warningText (#806600 light / #bcb600 dark) is the text-safe warning tint:
   `warning` is ~2:1 on a white card, so warning-coloured LABELS use
   warningText while icons, borders and fills keep `warning`.
   ========================================================================= */
:root{
  color-scheme:light;
  --primary:#007AFF; --background:#FFFFFF; --surface:#FFFFFF; --card:#FFFFFF;
  --text:#000000; --textSecondary:#3F3F3F; --border:#D0D0D0; --notification:#FF3B30;
  --secondary:#000000; --accent:#d9d9d9; --error:#971d1d; --warning:#bcb600; --warningText:#806600;
  --contrast:#262626; --success:#096904; --important:#e8e3ad;
  --dark:#000000; --light:#ffffff; --muted:#9e9e9e;
  --link:#0a7ea4;                      /* ThemedText type="link" hardcodes this */
  --tabInactive:gray;                  /* tabBarInactiveTintColor: "gray" */
  /* globalStyles.cardSurface shadow (offset 0,6 · opacity .18 · radius 18) */
  --cardShadow:0 6px 18px rgba(0,0,0,0.18);
  --footerShadow:0 -1px 1px rgba(0,0,0,0.1);
  --pillAlpha:22;                      /* pill.ts PILL_TINT_ALPHA */
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --primary:#0A84FF; --background:#121212; --surface:#171717; --card:#1C1C1E;
  --text:#ebebeb; --textSecondary:#5b5b5b; --border:#121212; --notification:#FF453A;
  --secondary:#FFFFFF; --accent:#606060; --error:#FF453A; --warning:#bcb600; --warningText:#bcb600;
  --contrast:#dadada; --success:#89a690; --important:#e8e3adc8;
  --dark:#000000; --light:#ffffff; --muted:#6e6e6e;
  --link:#0a7ea4;
  --cardShadow:0 6px 18px rgba(0,0,0,0.5);
  --footerShadow:0 -1px 1px rgba(0,0,0,0.5);
}

/* Type scale — components/ThemedText.tsx */
.t-title{font-size:24px;line-height:30px;font-weight:700}
.t-cardTitle{font-size:22px;line-height:28px;font-weight:700}
.t-header{font-size:19px;line-height:25px}
.t-subtitle{font-size:18px;line-height:24px;font-weight:400}
.t-default{font-size:16px;line-height:24px}
.t-defaultSemiBold{font-size:16px;line-height:24px;font-weight:600}
.t-link{font-size:16px;line-height:30px;color:var(--link);text-decoration:underline}
.t-small{font-size:14px;line-height:20px;font-weight:400}
.t-smallBold{font-size:14px;line-height:20px;font-weight:600}
.t-tiny{font-size:11px;line-height:15px;font-weight:400}
.t-tinyBold{font-size:11px;line-height:15px;font-weight:600}
.muted{color:var(--textSecondary)}
.italic{font-style:italic}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  /* fonts.regular.fontFamily === 'System' in themes.ts */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:#3a3a3c;color:var(--text);
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:0;
}
@media (min-width:900px){ body{padding:24px} }

/* ---- Phone frame: Pixel 8 == 412 x 915 dp ---- */
#device{
  width:412px;height:915px;max-width:100vw;max-height:100vh;
  position:relative;overflow:hidden;background:var(--background);
  display:flex;flex-direction:column;
}
@media (min-width:900px){
  #device{border-radius:34px;box-shadow:0 24px 70px rgba(0,0,0,.55);border:8px solid #101012;height:931px}
}
@media (max-width:911px){ #device{width:100vw;height:100vh;height:100dvh} }

/* ---- Android status bar ---- */
#statusbar{
  flex:0 0 auto;height:28px;background:var(--card);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:12px;font-weight:600;color:var(--text);
  position:relative;z-index:5;
}
#statusbar .sb-icons{display:flex;gap:5px;align-items:center}

/* ---- @react-navigation/native-stack header (Android) ---- */
.navheader{
  flex:0 0 auto;min-height:56px;background:var(--card);
  display:flex;align-items:center;gap:2px;padding:0 4px;
  border-bottom:1px solid var(--border);position:relative;z-index:4;
}
.navheader .hbtn{
  min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:0;background:none;color:var(--text);cursor:pointer;border-radius:50%;padding:0 8px;
}
.navheader .hbtn:active{background:rgba(128,128,128,.18)}
/* headerButton in navigation/index.tsx: padding 8, marginHorizontal 4 */
.navheader .htitle{
  font-size:20px;font-weight:500;color:var(--text);
  padding-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.navheader.has-btn .htitle{padding-left:4px}
/* HeaderTitle()/useTabHeaderOptions(): ThemedText type="header" == 19px, not 20/500 */
.navheader .htitle.tabtitle{font-size:19px;font-weight:400}
.navheader .hright{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-right:4px}

/* ---- screen body ---- */
#screen{flex:1 1 auto;position:relative;overflow:hidden;background:var(--background);display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screenpad{padding:16px}                         /* globalStyles.container */
.fill{flex:1;display:flex;flex-direction:column;min-height:0}
.section{margin-bottom:20px}                     /* globalStyles.section */
.sectionTitle{margin-bottom:16px}
.detail{display:flex;flex-direction:row;flex-wrap:wrap}
.subDetails{margin-left:8px}

/* ---- bottom tab bar (createBottomTabNavigator) ---- */
#tabbar{
  flex:0 0 auto;height:62px;background:var(--card);border-top:1px solid var(--border);
  display:flex;align-items:stretch;position:relative;z-index:4;
}
#tabbar.hidden{display:none}
#tabbar .tab{
  flex:1;border:0;background:none;cursor:pointer;padding:7px 0 9px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--tabInactive);
}
/* tabBarIcon: ONE icon family for every tab (navigation/index.tsx iconMap —
   check-to-slot / list-check / building-columns / gear, size 22). The old
   E/T/A letters beside a gear were replaced in the UI design pass. */
#tabbar .tab .tlabel{font-size:12px;font-weight:700;letter-spacing:.1px}
#tabbar .tab.active{color:var(--text)}
#tabbar .tab .tbadge{
  position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--notification);color:var(--light);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
}

/* ---- globalStyles.cardSurface ---- */
.cardSurface{
  border-radius:16px;padding:16px;margin:10px 4px;background:var(--card);
  box-shadow:var(--cardShadow);
}
.card-row{display:flex;flex-direction:row;align-items:center}
.card-img{width:56px;height:56px;border-radius:4px;object-fit:cover;flex:0 0 auto;background:var(--accent)}
.card-content{flex:1;min-width:0;margin-right:8px;padding-right:8px}
.card-content.with-img{margin-left:16px}
.card-chevron{margin-left:8px;flex:0 0 auto}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.infoline{display:flex;flex-direction:row;align-items:center;margin-top:2px;min-width:0}
.infoline .il-label{flex:0 0 auto}
.infoline .il-value{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- CustomButton ---- */
.btn{
  border:0;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;
  gap:12px;position:relative;width:auto;align-self:stretch;
  font-size:16px;font-weight:600;text-transform:uppercase;text-align:center;
  background:var(--accent);color:var(--text);
}
.btn:active{filter:brightness(.94)}
/* RN: a CustomButton in a column View stretches (alignSelf auto → stretch), so
   outside a row it spans the container minus its 4px side margins. */
.btn{width:calc(100% - 8px)}
.btn.tall{border-radius:28px;padding:16px 32px;margin:8px 4px;min-height:56px}
.btn.thin{border-radius:18px;padding:6px 22px;margin:8px 4px;min-height:36px}
.btn.disabled{opacity:.5;cursor:default;pointer-events:none}
.btn .righticon{position:absolute;right:16px;top:0;bottom:0;display:flex;align-items:center}
.btnrow{display:flex;flex-direction:row;gap:16px;padding:0 20px}
.btnrow .btn{flex:1;margin-left:0;margin-right:0;width:auto}

/* ---- ChipButton ---- */
.chip{
  display:inline-flex;flex-direction:row;align-items:center;height:32px;padding:0 20px;
  border-radius:16px;gap:8px;background:var(--accent);color:var(--text);
  border:0;cursor:pointer;font-family:inherit;font-size:16px;line-height:24px;
  align-self:flex-start;max-width:100%;
}
.chip .ctext{text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .cicon{
  width:24px;height:24px;border-radius:12px;background:var(--dark);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.chip.full{align-self:stretch;justify-content:center;height:48px;padding:0 28px;border-radius:24px;margin:8px 0}
.chip.disabled{opacity:.5;pointer-events:none}
.chiprow{display:flex;flex-direction:row;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ---- SyncChip ---- */
.syncchip{
  display:flex;flex-direction:row;align-items:center;height:32px;padding:0 12px;
  border-radius:16px;gap:8px;background:var(--card);
}

/* ---- CustomTextInput ---- */
.field{margin-bottom:10px}
.field .ftitle{display:flex;align-items:center;justify-content:space-between}
.field .fwrap{position:relative;margin-top:8px;display:flex;flex-direction:row;align-items:center}
.field input,.field textarea{
  flex:1;min-width:0;padding:14px;border-radius:28px;font-size:14px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-family:inherit;outline:0;
}
.field textarea{border-radius:16px;resize:none}
.field input::placeholder,.field textarea::placeholder{color:var(--textSecondary);font-style:italic}
.field .ficon{margin-left:10px;margin-right:6px;flex:0 0 auto;display:flex}

/* ---- CollapsibleSection ---- */
.collapse{margin-top:16px}
.collapse .ctitle{display:flex;flex-direction:row;align-items:center;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;color:var(--text);width:100%;text-align:left}
.collapse .ctitle .cchev{margin-right:16px;display:flex}
.collapse .csearch{
  display:flex;flex-direction:row;align-items:center;padding:8px;padding-left:16px;
  margin:8px 0;border-radius:32px;border:1px solid var(--border);background:var(--card);gap:8px;
}
.collapse .csearch input{flex:1;min-width:0;border:0;outline:0;background:none;padding:4px;color:var(--text);font-family:inherit;font-size:16px}
.collapse .csearch input::placeholder{color:var(--text)}

/* ---- Footer (components/Footer.tsx) ---- */
.footer{
  flex:0 0 auto;padding:16px;background:var(--card);box-shadow:var(--footerShadow);
  position:relative;z-index:3;
}
.footer.row{display:flex;flex-direction:row;gap:16px;padding-left:20px;padding-right:20px}
.footer.row>.btn{flex:1;margin-left:0;margin-right:0;width:auto}
.adminCheck .btn,.btn.inline{width:auto}

/* ---- Switch (RN Switch) ---- */
.sw{width:51px;height:31px;border-radius:16px;background:var(--accent);position:relative;cursor:pointer;flex:0 0 auto;border:0;padding:0;transition:background .15s}
.sw.on{background:var(--primary)}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .15s}
.sw.on i{left:22px}
.row-between{display:flex;flex-direction:row;justify-content:space-between;align-items:center;margin-bottom:16px}

/* ---- status pill (pill.ts + VerdictBadge/RegistrantRow) ---- */
.pill{
  display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  padding:2px 8px;border-radius:10px;font-size:14px;line-height:20px;font-weight:600;
}
/* TaskCard chip — height 24, radius 12 */
.taskchip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:12px;align-self:flex-start;margin-bottom:4px;font-size:14px;line-height:20px}
.banner{display:flex;flex-direction:row;align-items:center;gap:8px;margin-bottom:12px}
.radio{display:flex;flex-direction:row;align-items:center;gap:8px;padding:4px 0;cursor:pointer;background:none;border:0;font-family:inherit;color:var(--text);font-size:15px;text-align:left}
.radio .ro{width:20px;height:20px;border-radius:10px;border:2px solid var(--textSecondary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.radio.on .ro{border-color:var(--primary)}
.radio .ri{width:10px;height:10px;border-radius:5px;background:var(--primary)}
.radiorow{display:flex;flex-direction:row;gap:24px}
.bullet{display:flex;flex-direction:row}
.emptystate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:12px;text-align:center}
.centerstate{flex:1;display:flex;align-items:center;justify-content:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--primary);border-top-color:transparent;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;line-height:24px;word-break:break-all;margin-bottom:8px}
.authimg{width:200px;height:200px;border-radius:8px;align-self:center;margin:16px auto;display:block;background:var(--accent);object-fit:cover}
.officerentry{margin:12px 0}
.officer-img{width:56px;height:56px;border-radius:4px;margin-bottom:8px;background:var(--accent)}
.officer-status{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.removebtn{width:24px;height:24px;border-radius:12px;border:1px solid var(--error);display:flex;align-items:center;justify-content:center;background:none;cursor:pointer;flex:0 0 auto}
.adminCheck{display:flex;flex-direction:row;align-items:center;margin-top:12px;gap:12px}
.confirmcard{border-radius:16px;padding:16px;margin:10px 4px;background:var(--card);box-shadow:var(--cardShadow)}
.stepper{display:inline-flex;flex-direction:row;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;align-self:flex-start}
.stepper button{width:40px;height:40px;background:var(--card);border:0;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;color:var(--text)}
.stepper .val{min-width:40px;text-align:center;font-size:16px;font-weight:600}
.leftmark{border-left:4px solid var(--warning)}
/* 44x44 header-row glyph button (NetworksScreen exportIconButton) */
.iconbtn{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;padding:0}
/* components/DateField.tsx pill */
.datepill{flex:1;min-width:0;display:flex;flex-direction:row;align-items:center;gap:10px;padding:12px 14px;border-radius:28px;border:1px solid var(--border);background:var(--card)}
/* ElectionRevisionForm removable tag chip */
.tagchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card)}
/* VerificationChecklist row: 44pt tap target, 44pt glyph box */
.checkrow{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:44px;width:100%;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;color:var(--text);text-align:left}
.glyph44{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
/* AssociationRequestApproval candidate row / ReassociationReviewToggle option row */
.candrow{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:44px;width:calc(100% - 8px);cursor:pointer;font-family:inherit;color:var(--text)}
.candrow.off{cursor:default}
.optrow{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:44px;width:100%;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;color:var(--text)}
/* invite share text: monospace, numberOfLines={4} */
.mono4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:20px}
input:disabled,textarea:disabled{opacity:.6}

/* App-wide overlays: RN Alert (Android Material dialog), ToastProvider, full-screen QR Modal */
#overlays{position:absolute;inset:0;z-index:50;pointer-events:none}
#overlays>*{pointer-events:auto}
.alertscrim{position:absolute;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px}
.alertbox{width:100%;max-width:320px;background:var(--card);border-radius:4px;box-shadow:0 11px 15px rgba(0,0,0,.2),0 24px 38px rgba(0,0,0,.14);padding:24px 24px 8px}
.alerttitle{font-size:20px;line-height:26px;font-weight:500;color:var(--text);margin-bottom:12px}
.alertbody{font-size:16px;line-height:24px;color:var(--textSecondary)}
.alertbtns{display:flex;justify-content:flex-end;gap:8px;margin:20px -16px 0;flex-wrap:wrap}
.alertbtns button{background:none;border:0;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--primary);padding:10px 8px;min-height:44px}
#overlays .toasthost{position:absolute;left:0;right:0;bottom:64px;display:flex;justify-content:center;padding:0 24px;pointer-events:none}
.toast{max-width:360px;padding:12px 20px;border-radius:22px;background:var(--text);color:var(--background);font-size:15px;line-height:20px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.qrmodal{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;padding-top:28px}
.qrmodal .btn{color:#000}
/* PairedBrowsers / VoterInviteCard / JoinNetwork */
.vstack{display:flex;flex-direction:column;gap:8px}
.joincard{border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
:root[data-theme="dark"] .joincard{border-color:var(--accent)}
.joincard textarea{border:1px solid var(--primary);border-radius:8px;padding:12px;min-height:96px;font-size:14px;font-family:inherit;color:var(--text);background:transparent;resize:none;outline:0;width:100%}
.joincard textarea.err{border-color:var(--error)}
.joincard textarea::placeholder{color:var(--textSecondary)}
:root[data-theme="dark"] .joincard textarea::placeholder{color:var(--text)}
.linkbtn{background:none;border:0;cursor:pointer;font-family:inherit;font-size:16px;color:var(--primary);min-height:44px;min-width:44px;padding:0;display:flex;align-items:center;justify-content:flex-end}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
/* presentation:'modal' route — slides up over the whole app */
.routemodal{
  position:absolute;left:0;right:0;top:16px;bottom:0;z-index:30;background:var(--background);
  border-radius:12px 12px 0 0;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 -6px 28px rgba(0,0,0,.35);animation:slideup .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.routemodal .navheader{border-radius:12px 12px 0 0}
.modal-scrim{position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.28)}

/* language dropdown (SettingsScreen) */
.langwrap{position:relative}
.langbtn{display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--text);border:0;border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600}
.langmenu{position:absolute;top:48px;right:0;border-radius:8px;min-width:140px;z-index:999;background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.15);overflow:hidden}
.langmenu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;background:none;border:0;cursor:pointer;font-family:inherit;font-size:16px;color:var(--text);gap:8px}
.langmenu button.on{background:color-mix(in srgb, var(--primary) 20%, transparent)}

/* ---- dev drawer (prototype-only affordance) ---- */
#devfab{
  position:absolute;right:12px;bottom:74px;z-index:45;width:44px;height:44px;border-radius:50%;
  background:#111;color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
#devdrawer{position:absolute;inset:0;z-index:60;background:var(--background);display:none;flex-direction:column}
#devdrawer.open{display:flex}
#devdrawer .dhead{
  padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;background:var(--card);
}
#devdrawer .dhead h2{margin:0;font-size:18px;font-weight:700;color:var(--text)}
#devdrawer .dbody{flex:1;overflow-y:auto;padding:12px 16px 28px}
.dgroup{margin-top:18px}
.dgroup:first-child{margin-top:4px}
.dgroup h3{
  margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--textSecondary);
}
.ditem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:15px;color:var(--text);
}
.ditem:active{filter:brightness(.95)}
.ditem .dsub{display:block;font-size:12px;color:var(--textSecondary);margin-top:2px}
.badge{
  flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:999px;
  background:#fde2df;color:#a02216;text-transform:uppercase;
}
:root[data-theme="dark"] .badge{background:#4a1b16;color:#f0a79c}
.badge.state{background:#e3f0fd;color:#14538f}
:root[data-theme="dark"] .badge.state{background:#14304a;color:#8ec4f5}
.badge.dev{background:#e7e2fb;color:#4b2ea0}
:root[data-theme="dark"] .badge.dev{background:#2b2350;color:#bfb0f5}
.dnote{font-size:12px;line-height:17px;color:var(--textSecondary);margin:2px 0 10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:78px;min-height:38px;padding:0 12px;border-radius:999px;cursor:pointer;
  background:var(--card);color:var(--textSecondary);border:1px solid var(--border);
  font-family:inherit;font-size:14px;
}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
</style>

/** utils/displayUtils.ts formatLocalTime — the phone's local 24-hour HH:MM. */
const fmtLocalTime = ms => { const d=new Date(ms); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
/** Local YYYY-MM-DD HH:MM from plain Date getters (PairedBrowsers / the Settings mint log). */
const fmtLocalDateTime = ms => { const d=new Date(ms), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); };
const fmtLocalDay = ms => fmtLocalDateTime(ms).slice(0,10);
function T(type, text, cls, style){
  /* Flex containers trim leading/trailing whitespace inside a flex item; RN's
     <Text> does not. The app relies on that trailing space ("Name: " + value),

  const t2 = String(text).replace(/^ +/,m=>'&nbsp;'.repeat(m.length))
                         .replace(/ +$/,m=>'&nbsp;'.repeat(m.length));

/** A deterministic QR-looking module grid (finder patterns + seeded fill). The app
 *  draws a real integer-module QR PNG (engines/qr-share); this only stands in for it. */
function QrSvg(seed, px){
  const n=29; let h=2166136261; for(const c of String(seed)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); }
  const rnd=()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return (h>>>0)/4294967296; };
  const finder=(x,y)=>'<rect x="'+x+'" y="'+y+'" width="7" height="7"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>';
  const inFinder=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  let cells='';
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(!inFinder(x,y) && rnd()<0.47) cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
  return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" width="'+px+'" height="'+px+'" shape-rendering="crispEdges" style="display:block;background:#fff" aria-hidden="true"><g fill="#000">'
    + finder(0,0)+finder(n-7,0)+finder(0,n-7)+cells+'</g></svg>';
}

/** screens/tasks/components/ThresholdProgressNote.tsx — small / textSecondary /
 *  lineHeight 20. Nothing at threshold<=1, on a null status, or when the session
 *  is unreachable. At/after the threshold it reads "Threshold reached" however
 *  many signatures arrived. Never a reject count (no veto framing). */
function ThresholdNote(st){
  if(!st || st.threshold<=1 || st.unreachable) return '';
  const text = st.reached ? t('signatureTaskThresholdReached')
                          : t('signatureTaskThresholdProgress',{signed:st.signatures, threshold:st.threshold});
  return '<div>'+T('small',esc(text),'muted','line-height:20px')+'</div>';
}

      + ThresholdNote(S.tasksNoThreshold?null:task.status)

/** screens/tasks/TasksScreen.tsx */
function TasksTab(){
  if(!S.hasNetwork) return NoNetwork();
  /* the load error is catalogued copy now, never the engine's message */
  const err = S.tasksLoadError ? InlineError(t('tasksLoadFailed')) : '';
  if(S.peerUnavailable==='Tasks' && !S.peerStale)
    return '<div class="scroll"><div class="screenpad">'+PeerNotice('unavailable')+'</div></div>';
  if(S.tasksEmpty){
    return '<div class="emptystate" style="justify-content:center;padding-top:48px">'
      + err
      + icon('clipboard-list',48,'var(--textSecondary)')
      + T('title',esc(t('noTasks')))
      + T('default',esc(t('noTasksHelper')))
      + '</div>';
  }
  const groups = [];
  TASKS.forEach(task=>{
    let g = groups.find(x=>x.key===task.group);
    if(!g){ g={key:task.group, items:[]}; groups.push(g); }
    g.items.push(task);
  });
  return '<div class="scroll"><div class="screenpad">'
    + err
    + (S.peerUnavailable==='Tasks' ? PeerNotice('stale') : '')
    + groups.map(g=>'<div class="section">'+T('title',esc(g.key))
        + '<div>'+g.items.map(TaskCard).join('')+'</div></div>').join('')
    + '</div></div>';
}

AuthorityDetails:{ header:'modal', title:()=>t('authority'),
  right:()=>Chip({label:t('unpin'), icon:'thumbtack-slash'}),
  body(){
    const ad=S.admin, proposed=S.proposedAdmin, pending=ad.pending;
    const peer=S.peerUnavailable==='AuthorityDetails';
    /* the roster waiting to take effect: the proposal, or the pending change */
    const waiting = proposed || pending;
    return pad(
      '<div class="section">'
      + '<div class="authimg"></div>'
      + detail(t('name'), AUTHORITY.name,'ell')
      + detail(t('domainName'), AUTHORITY.domainName,'ell')
      + detail(t('cid'), AUTHORITY.id,'ell')
      + detail(t('address'), AUTHORITY.address,'ell')
      + '<div class="detail">'+T('defaultSemiBold',esc(t('signature'))+': ')+T('default','['+esc(t('valid'))+']')+'</div>'
      /* an authority this device cannot find on the open network: a warning box in place
         of REVISE AUTHORITY, and no Administration section at all */
      + (S.authNotFound
          ? '<div role="alert" data-testid="authority-not-on-network" style="border:1px solid var(--warning);border-radius:8px;padding:12px;margin-top:8px;background:var(--card)">'
            + T('defaultSemiBold',esc(t('authorityNotOnNetworkTitle')))+'<div>'+T('small',esc(t('authorityNotOnNetworkBody')))+'</div></div>'
          : Button({title:t('reviseAuthority'), icon:'pencil', size:'thin', act:'go-network-revision'}))
      + '</div>'
      /* Administration */
      + (S.authNotFound ? '' : '<div class="section">'+T('title',esc(t('administration')))
        + (peer ? PeerNotice(S.peerStale?'stale':'unavailable') : '')
        + (peer && !S.peerStale ? '' :
            detail(t('priorCid'), 'bafyreiabc123…prior','ell')
          + '<div class="detail">'+T('defaultSemiBold',esc(t('handoffSignatures'))+': ')+'</div>'
          + '<div class="subDetails">'
            + OFFICERS.slice(0,2).map(o=>'<div class="detail">'+T('default',esc(o.name)+' ['+esc(trunc(o.userId,9))+']','ell')
                + T('default',' ('+esc(t('valid'))+')')+'</div>').join('')
          + '</div>'
          + detail(t('cid'), 'bafyreiadm77…admin','ell')
          /* "Effective" (when the administration took effect), not an expiry */
          + detail(t('effective'), fmtDate(now-400*DAY))
          + OFFICERS.map(o=>InfoCard({image:'', title:o.name, subtitle:o.title, icon:'chevron-right',
              act:'go-officer', data:o.userId, info:[{label:t('cid'),value:o.userId}]})).join('')
          /* a pending change shows its card (Cancel for an rad holder) and offers no way to
             build a second change; otherwise REVISE ADMINISTRATION unless a proposal is open */
          + (pending
              ? PendingAdminChangeCard({canCancel:ad.canCancel, error:ad.cancelError})
              : (ad.cancelled ? T('default',esc(t('adminChangeCancelled'))) : '')
                + (!proposed ? Button({title:t('reviseAdministration'), icon:'pencil', size:'thin', act:'go-proposed-admin'}) : '')))
        + PendingInvitationsSection()
      + '</div>')
      /* Proposed administration (proposal or pending roster) + Authorization */
      + (waiting && !S.authNotFound ? ProposedAdminBlock(proposed && !pending) : '')
      /* entry rows — deliberately NOT scope-gated (navigation ≠ access control) */
      + '<div class="section">'
        + InfoCard({title:t('registrantListScreenTitle'),      icon:'chevron-right', act:'go-registrants'})
        + InfoCard({title:t('registrationRequestScreenTitle'), icon:'chevron-right', act:'go-reg-inbox'})
        + InfoCard({title:t('pollingDeviceScreenTitle'),       icon:'chevron-right', act:'go-polling'})
        + InfoCard({title:t('authorityPeerScreenTitle'),       icon:'chevron-right', act:'go-peers'})
      + '</div>'
      /* Invited authorities */
      + '<div class="section">'
        + '<div style="margin-bottom:8px">'+T('title',esc(t('invitedAuthorities')))+'</div>'
        + '<div style="display:flex;justify-content:flex-end;margin-top:8px">'
          + Chip({label:t('inviteAuthority'), icon:'circle-plus', act:'go-authority-invitation'})+'</div>'
        + '<div style="margin:8px 0 4px">'+T('defaultSemiBold',esc(t('name')))+'</div>'
        + Field({placeholder:t('name')})

        + InfoCard({title:'Cache County Clerk', subtitle:t('unsent'), icon:'chevron-right'})
      + '</div>');
  }},

/* ---- Elections ------------------------------------------------------- */
ElectionDetails:{ header:'modal', title:()=>t('election'), body(){
  const e=ELECTIONS[0], r=REVISION;
  /* the details read: a peer failure before any read shows the notice IN PLACE of the
     screen; a plain failure is catalogued copy + TRY AGAIN */
  if(S.edLoad==='peer') return pad(PeerNotice('unavailable','ed-retry'));
  if(S.edLoad==='error') return pad('<div data-testid="election-details-load-error">'+InlineError(t('electionDetailsLoadFailed'))
    + Button({title:t('loadRetryButton'), icon:'rotate', size:'thin', act:'ed-retry'})+'</div>');
  const khs = S.edNoKeyholders ? [] : r.keyholders;
  const ballots = S.edNoBallots ? [] : (S.edOneBallot ? BALLOTS.slice(0,1) : BALLOTS);
  const BSTAT = b => b.state==='confirmed' ? t('statusConfirmed') : b.state==='locked' ? t('statusAwaitingConfirmation') : t('statusProposed');
  return pad(
    (S.edLoad==='stale' ? PeerNotice('stale','ed-retry') : '')
    + '<div class="section">'
      + T('cardTitle',esc(e.title))
      /* the authority NAME now (passed from the list), not its id */
      + detail(t('authority'), e.authorityName,'ell')
      + detail(t('type'), t('official'))
      + detail(t('dateTime'), fmtDate(e.date))
      + detail(t('coreSignature'), '3045022100c4e1…9f2b','ell')
    + '</div>'
    + '<div class="section">'
      + detail(t('revision'), '#'+r.revision+' - '+fmtDate(r.revisionTimestamp))
      + detail(t('tags'), r.tags.join(', '))
      + '<div style="margin:8px 0 2px">'+T('defaultSemiBold',esc(t('timeline')))+'</div>'
      + TimelineList(r.timeline)
      + detail(t('keyholderPolicy'), (khs.length?r.keyholderThreshold:0)+' of '+khs.length)
      + detail(t('revisionSignature'), r.signature.signature,'ell')
      /* the single PREVIEW chip renders ONLY with exactly one template */
      + (ballots.length===1 ? '<div style="height:8px"></div>'+Chip({label:t('previewBallots'), act:'go-ballot-preview'}) : '')
    + '</div>'
    + '<div class="section">'+T('defaultSemiBold',esc(t('keyholders')))
      + khs.map(KeyholderCard).join('')
      /* with exactly one keyholder still to accept, INVITE opens straight on that seat */
      + Button({title:t('invite'), icon:'paper-plane', size:'thin', act:'go-keyholder-invitation'})
    + '</div>'
    + '<div class="section">'
      + Button({title:t('reviseElection'), icon:'pencil', size:'thin', act:'go-election-revision'})
      + Button({title:t('cloneElection'), icon:'copy', size:'thin', disabled:true})
    + '</div>'
    + (S.edProposed ? ProposedElectionRevisionBlock() : '')
    + '<div class="section">'+T('title',esc(t('ballotTemplates')))
      /* a ballots read the network could not answer is not "no ballot yet" */
      + (S.edBallotsPeer ? PeerNotice('unavailable','ed-retry') : ballots.length
          ? ballots.map(b=>InfoCard({title:b.description||t('ballotTemplate'), subtitle:BSTAT(b),
              icon:'chevron-right', act:'go-edit-ballot'})).join('')
          : '<div>'+T('small',esc(t('noBallotYet')))+'</div>'
            + Button({title:t('createBallotTemplate'), icon:'plus', size:'thin', act:'go-create-ballot'}))
    + '</div>'
    + '<div class="section">'
      + InfoCard({title:t('registrationPolicyEntryTitle'), icon:'chevron-right', act:'go-reg-policy'})
    + '</div>'
    + '<div class="section">'
      + InfoCard({title:t('registrantListScreenTitle'), icon:'chevron-right', act:'go-registrants'})
    + '</div>'
    /* Results: decrypt + validate + tally on this device once enough keyholders released */
    + '<div class="section" data-testid="election-details-results-entry">'
      + InfoCard({title:t('resultsEntryTitle'), icon:'chevron-right', act:'go-results'})
    + '</div>'
    + '<div class="section">'+Chip({label:t('more'), act:'toggle-more'})
      + (S.moreOpen?Field({placeholder:t('filterAuthoritiesField')}):'')
    + '</div>');
  }},

/* screens/elections/ElectionResultsScreen.tsx — a non-modal push from Election Details.
   Locked until enough keyholders release their shares; then this device decrypts,
   validates and tallies. An officer of the election's authority may PUBLISH one signed
   tally (confirm dialog, biometric) once it covers every block this device holds; a
   published tally is re-checked against the local count. Footer: REFRESH. */
ElectionResults:{ header:'stack', title:()=>t('resultsScreenTitle'), body(){
  const R=S.res, ph=R.phase, card = inner => '<div class="cardSurface" style="margin:0;display:flex;flex-direction:column;gap:2px">'+inner+'</div>';
  const pct=(c,of)=>of>0?Math.round(c/of*100):0;
  let h = T('cardTitle',esc(ELECTIONS[0].title));
  if(ph==='loading') h += T('default',esc(t('resultsComputing')),'muted');
  if(ph==='failed')  h += T('default',esc(t('resultsLoadFailed')),'','color:var(--error)');
  if(ph==='no-election') h += T('default',esc(t('resultsNoElection')));
  if(ph==='awaiting') h += card(T('defaultSemiBold',esc(t('resultsLockedTitle'))) + T('default',esc(t('resultsLockedBody')))
      + (R.noKey ? T('default',esc(t('resultsNoElectionKey'))) : T('defaultSemiBold',esc(t('resultsReleasedCount',{released:R.released, needed:R.threshold}))))
      + T('small',esc(t('resultsReleaseFrom',{date:new Date(REVISION.timeline.releasingKeys).toLocaleString()})),'muted'));
  if(ph==='unavailable') h += card(T('defaultSemiBold',esc(t('resultsUnavailableTitle')),'','color:var(--error)')
      + T('small',esc(t('resultsUnavailableReason',{reason:'key-mismatch'}))));
  if(ph==='no-blocks') h += card(T('defaultSemiBold',esc(t('resultsNoBlocksYet')),'','color:var(--warning)'));
  if(ph==='tallied'){
    const x=RESULTS;
    h += card(T('defaultSemiBold',esc(t('resultsValidVotes',{count:x.totals.valid})))
        + T('small',esc(t('resultsBlocks',{count:x.blockCount})))
        + (x.totals.excluded>0 ? T('small',esc(t('resultsExcludedVotes',{count:x.totals.excluded})),'','color:var(--warning)') : '')
        + T('small',esc(t('resultsKeyholdersUsed',{count:x.keyholdersUsed})),'muted')
        + T('small',esc(t('resultsReceivedSoFar')),'muted'))
      + x.ballots.map(b=>card((b.description?T('cardTitle',esc(b.description)):'')
          + T('small',esc(t('resultsBallotVotes',{count:b.valid})),'muted')
          + b.questions.map(q=>{ const tot=q.options.reduce((n,o)=>n+o.count,0);
              return '<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px" data-testid="results-question-'+q.code+'">'
                + T('defaultSemiBold',esc(q.title))
                + q.options.map(o=>'<div style="display:flex;flex-direction:column;gap:4px">'
                    + '<div style="display:flex;justify-content:space-between;gap:8px">'+T('default',esc(o.title))
                      + T('defaultSemiBold',esc(t('resultsOptionCount',{count:o.count, percent:pct(o.count,tot)})))+'</div>'
                    + '<div style="height:8px;border-radius:4px;overflow:hidden;background:var(--border)"><div style="height:8px;border-radius:4px;background:var(--primary);width:'+pct(o.count,tot)+'%"></div></div>'
                    + '</div>').join('')
                + (q.blank>0 ? T('small',esc(t('resultsBlank',{count:q.blank})),'muted') : '')
                + '</div>'; }).join(''))).join('')
      + T('tiny',esc(t('resultsTallyRoot',{root:x.tallyRoot.slice(0,16)})),'muted');
    if(R.pub==='published'||R.pub==='differs'||R.pub==='invalid')
      h += card(T('defaultSemiBold',esc(t('resultsPublishedTitle')))
        + (R.pub==='invalid' ? T('default',esc(t('resultsPublishedInvalid')),'','color:var(--error)')
          : R.pub==='published' ? T('default',esc(t('resultsPublishedMatches',{date:new Date(x.publishedAt).toLocaleString()})))
          : T('default',esc(t('resultsPublishedDiffers',{published:2, local:x.blockCount})),'','color:var(--warning)')));
    if(R.pub==='unpublished'){
      const canPublish = R.officer==='yes' && R.coverage && !R.publishing;
      h += card(T('defaultSemiBold',esc(t('resultsNotPublishedTitle')))
        + (R.officer==='no' ? T('small',esc(t('resultsPublishOfficerOnly')),'muted') : '')
        + (R.officer==='yes' && !R.coverage ? T('small',esc(t('resultsPublishWaitingForBlocks')),'','color:var(--warning)') : '')
        + (R.officer==='yes' && R.coverage ? T('small',esc(t('resultsPublishExplain')),'muted') : '')
        + (R.error ? T('small',esc(t(R.error)),'','color:var(--error)') : '')
        + (R.officer==='yes' ? Button({title:R.publishing?t('resultsPublishing'):t('resultsPublish'), disabled:!canPublish, act:'results-publish'}) : ''));
    }
  }
  return '<div class="fill"><div class="scroll"><div class="screenpad vstack" style="gap:12px;padding-bottom:24px">'+h+'</div></div>'
    + Footer(Button({title:t('resultsRefresh'), disabled:ph==='loading', act:'results-refresh'}))
    + '</div>';
  }},

    + '<div class="section">'
      + '<div class="detail" style="align-items:center;margin-bottom:4px">'

      + '<div class="radiorow">'
        + '<button class="radio" data-act="noop"><span class="ro"></span>'+esc(t('adhoc'))+'</button>'

      + '</div>'
    + '</div>'
    + '<div class="section">'
      + '<div class="sectionTitle">'+T('defaultSemiBold',esc(t('coreSectionHeader')))+'</div>'
      + Field({title:t('title'), placeholder:t('title'), value:c.title?'':(filled?'2026 Utah General Election':'')})
      + InlineError(c.title?t(c.title):'')
      + DateField(t('date'), filled && c.date!=='errElectionDateRequired' ? fmtDate(c.date==='errElectionDateTooSoon'?now+4*DAY:now+62*DAY) : '')
      + InlineError(c.date ? t(c.date,{date:new Date(now+10*DAY).toLocaleDateString()}) : '')

      + DateField(t('revisionDeadline'), filled && c.deadline!=='errRevisionDeadlineRequired' ? fmtDate(c.deadline==='errRevisionDeadlineAfterDate'?now+70*DAY:now+20*DAY) : '')

    + '</div>'

      + '<div class="sectionTitle">'+T('defaultSemiBold',esc(t('initialRevisionHeader')))+'</div>'

    + '</div></div>'
    + '<div style="padding:0 16px">'+InlineError(S.ceTimelineError?t('errTimelineOrder'):c.bottom?t(c.bottom):'')+'</div>'

    + '</div>';

Keyholder:{ header:'stack', title:()=>t('keyholder'), body(){
  const k=REVISION.keyholders[1];
  const st=S.dkgState, inv=S.khInviteState||'sent';
  /* error with an unknown status → NO row, the InlineError alone carries it */
  const row = st==='error-only' ? '' : DkgStatusRow(st==='auth-denied' ? 'pending' : st);
  const err = st==='error-only' ? t('keyholderDkgLoadError') : st==='auth-denied' ? t('deviceSigningErrorGeneric') : '';
  return pad('<div class="section">'
    + '<div class="detail" style="margin-bottom:8px">'+T('defaultSemiBold',esc(t('name'))+': ')+T('default',esc(k.name))+'</div>'
    /* "Status:" now — the invite state the seat is actually in */
    + '<div class="detail" style="margin-bottom:8px">'+T('defaultSemiBold',esc(t('keyholderStatusLabel'))+': ')+T('default',esc(t(KH_STATE[inv].labelKey)))+'</div>'
    + (inv==='accept-again' ? T('default',esc(t('keyholderReacceptOfficerNote'))) : '')
    + row
    /* keyholders who have not answered a key-generation round within its deadline */
    + (S.dkgOverdue ? '<div style="display:flex;align-items:flex-start;margin-top:8px" data-testid="keyholder-dkg-overdue-notice">'+icon('triangle-exclamation',16,'var(--warning)')
        + '<div style="margin-left:8px;flex-shrink:1">'+T('small',esc(t('dkgOverdueNotice',{hours:24, names:'Marisol Vega'})),'','color:var(--warning)')
        + '<div>'+T('small',esc(t('dkgOverdueHelp')),'muted')+'</div></div></div>' : '')
    + InlineError(err)
    + '</div>'
    + '<div class="section">'+Button({title:t('invite'), icon:'paper-plane', size:'thin', act:'go-keyholder-invitation'})+'</div>');
  }},

KeyholderInvitation:{ header:'stack', title:()=>t('keyholderInvitation'), body(){
  const m=S.khMode, k=S.khInvite;
  const radio=(on,label,act,data,dis)=>'<button class="optrow" data-act="'+(dis?'noop':act)+'" data-id="'+esc(data)+'" role="radio" aria-checked="'+on+'" style="min-height:48px'+(dis?';opacity:.6':'')+'">'
    + icon(on?'circle-dot':'circle',20,on?'var(--accent)':'var(--textSecondary)')+'<span class="t-default">'+esc(label)+'</span></button>';
  const EXP=[1,12,24,72,168], expLabel=h=>h===1?t('keyholderInviteExpiryHour',{n:1}):h<72?t('keyholderInviteExpiryHours',{n:h}):t('keyholderInviteExpiryDays',{n:h/24});
  if(m==='send'||m==='sent'){
    const sent=m==='sent', canSend = k.fixed || (k.pending.length>0);
    return '<div class="fill"><div class="scroll"><div class="screenpad"><div class="section">'
      + '<div class="sectionTitle">'+T('title',esc(t('keyholderInvitation')))+'</div>'
      /* one pending seat → it is fixed; several → pick one; none → every seat accepted */
      + (k.fixed ? '<div class="detail" style="margin-bottom:8px">'+T('defaultSemiBold',esc(t('name'))+': ')+T('default',esc(k.fixed))+'</div>'
        : k.pending.length===0 ? T('default',esc(t('keyholderInviteNoPendingInvitees')))
        : '<div>'+T('defaultSemiBold',esc(t('keyholderInvitePickInvitee')))
          + k.pending.map(n=>radio(k.picked===n,n,'kh-pick',n,sent)).join('')+'</div>')
      + (!sent
          ? (canSend ? '<div>'+T('defaultSemiBold',esc(t('keyholderInviteExpiryLabel')))+EXP.map(h=>radio(k.expiry===h,expLabel(h),'kh-expiry',String(h))).join('')+'</div>' : '')
          : T('default',esc(t('keyholderInviteExpiresAt',{when:new Date(now+k.expiry*HOUR).toLocaleString()}))))
      + (sent ? InviteShareBlock(t('invitationKey'),'keyholder-invitation-share') : '')
      + InlineError(S.khError)
      + '</div></div></div>'
      + (!sent && canSend ? Footer(Button({title:t('send'), icon:'paper-plane', bg:'var(--success)', forceDarkText:true,
            disabled:!(k.fixed||k.picked), act:'kh-send'})) : '')
      + '</div>';
  }
  /* accept: paste the share; the seat name shows once it resolves */
  const resolved = m==='accept' || m==='accept-error';
  return '<div class="fill"><div class="scroll"><div class="screenpad"><div class="section">'
    + '<div class="sectionTitle">'+T('title',esc(t('keyholderInvitation')))+'</div>'
    + (m==='accept-expired' ? T('default',esc(t('invitationAcceptExpired',{when:new Date(now-1*DAY).toLocaleString()}))) : '')
    + (resolved || m==='accept-expired'
        ? '<div class="detail" style="margin-bottom:8px">'+T('defaultSemiBold',esc(t('name'))+': ')+T('default','Ryan Cowley')+'</div>'
        : T('default',esc(t('invitationAcceptPasteHint'))))
    + T('default',esc(t('keyholderReacceptAcceptNote')))
    + InvitePasteField({prefix:'keyholder-invitation-paste', title:t('invitationKey'), parsed:m==='accept-paste'?false:'k',
        placeholder:t('invitationAcceptPastePlaceholder'), field:'acc.text', clear:'kh-clear'})
    + '</div></div></div>'
    + '<div style="padding:0 16px">'+InlineError(m==='accept-error' ? t('invitationAcceptFailed') : '')+'</div>'
    + SigFooter(t('accept'), t('decline'), !resolved || m==='accept-expired', 'kh-accept', 'back')
    + '</div>';
  }},

/* ---- Ballots --------------------------------------------------------- */
EditBallot:{ header:'stack', title:()=>t('ballotTemplate'), body(){
  /* Submit / Withdraw for confirmation live HERE now (CreateBallot proposes only).
     Hidden in PREVIEW, once confirmed, and while the lock state is unknown (fail closed:
     editing pauses with TRY AGAIN). Locked → the submitted hint (+ OPEN TASKS for your own
     task) and WITHDRAW for the submitter, else the out-for-confirmation note. */
  const e=S.eb, ro=S.ballotReadOnly;
  const locked = e.state==='locked', disabled = ro || locked || e.state==='confirmed' || e.state==='unknown';
  let foot='';
  if(!ro && e.state==='unknown')
    foot = InlineError(t('ballotStateLoadFailed')) + Footer(Button({title:t('ballotStateRetry'), icon:'rotate-right', act:'eb-retry'}));
  else if(!ro && e.state!=='confirmed')
    foot = Footer(locked
      ? (e.hint ? '<div data-testid="edit-ballot-submitted-task-hint">'+T('default',esc(t(e.hint==='own'?'ballotSubmittedOwnTaskHint':'ballotSubmittedOthersHint')))
            + (e.hint==='own' ? Button({title:t('ballotOpenTasksLink'), icon:'list-check', size:'thin', act:'go-tasks-tab'}) : '')+'</div>' : '')
        + (e.canWithdraw ? Button({title:t('withdrawConfirmation'), icon:'rotate-left', bg:'var(--warning)', act:'eb-withdraw'})
                         : T('default',esc(t('ballotOutForConfirmationNote'))))
      : Button({title:t('propose'), icon:'floppy-disk', bg:'var(--success)', forceDarkText:true, act:'eb-propose'})
        + Button({title:t('submitForConfirmation'), icon:'paper-plane', disabled:e.state==='dirty', act:'eb-submit'})
        + (e.state==='dirty' ? T('default',esc(t('ballotSubmitNeedsPropose'))) : ''));
  return '<div class="fill">'+BallotTemplateForm(disabled)+foot+'</div>';
  }},

EditQuestionOption:{ header:'stack', title:()=>t('questionOption'),

SignatureTask:{ header:'stack', title:()=>t(SIG_TITLE_KEY[S.taskType]||'signature'), body(){
  /* one details component per signature type, all on SignatureTaskBody: optional
     defaultSemiBold section titles over "Label: value" rows */
  const e=ELECTIONS[0], r=REVISION, ty=S.taskType;
  const task = TASKS.find(x=>x.signatureType===ty) || TASKS[2];
  const isNetwork = ty==='network';
  const bullets = list => '<div style="margin-left:8px">'+list.map(x=>'<div class="bullet">'+T('default','• ')+T('default',esc(x))+'</div>').join('')+'</div>';
  const body = sections => sections.map(sec=>'<div class="section">'
    + (sec.title ? '<div style="margin-bottom:8px">'+T('defaultSemiBold',esc(sec.title))+'</div>' : '')
    + '<div class="section" style="width:100%">'+sec.rows.map(rw=>'<div class="detail" style="gap:4px">'+T('defaultSemiBold',esc(rw[0])+': ')
        + (rw[2] ? rw[2] : T('default',esc(rw[1])))+'</div>').join('')+'</div></div>').join('');
  const tl=r.timeline, tlSlot='<div style="margin-left:8px">'+['registrationEnds','ballotsFinal','votingStarts','tallyingStarts','validation','certificationStarts','closed']
    .map(k=>'<div class="detail" style="gap:4px">'+T('defaultSemiBold',esc(t(k))+': ')+T('default',fmtDate(tl[k]))+'</div>').join('')+'</div>';
  const SECTIONS = {
    admin:[{title:t('proposal'), rows:[[t('type'),'admin'],[t('network'),NETWORK.name],[t('authority'),AUTHORITY.name],[t('admin'),String(OFFICERS.length)]]}],
    authority:[{title:t('proposal'), rows:[[t('network'),NETWORK.name],[t('authority'),AUTHORITY_2.name],[t('domain'),AUTHORITY_2.domainName]]}],
    network:[{title:t('proposal'), rows:[[t('proposalTimestamp'),new Date(now-2*HOUR).toLocaleString()],[t('hash'),NETWORK.hash]]},
             {title:t('policies'), rows:[[t('timestampAuthorities'),'',bullets(NETWORK_DETAIL.tsas)],[t('requiredTimestampAuthorities'),'1']]},
             {title:t('network'), rows:[[t('imageUrl'),NETWORK_DETAIL.imageUrl],[t('image'),'','<div style="width:120px;height:60px;border-radius:4px;background:var(--accent)"></div>'],
               [t('relays'),'',bullets(NETWORK.relays)],[t('signature'),OFFICERS[0].userId]]}],
    election:[{title:t('proposal'), rows:[[t('network'),NETWORK.name],[t('election'),e.title],[t('date'),fmtDate(e.date)]]},
              {title:t('details'), rows:[[t('revision'),String(r.revision)],[t('tags'),'',bullets(r.tags)]]}],
    'election-revision':[{title:t('proposal'), rows:[[t('network'),NETWORK.name],[t('election'),e.title],[t('revisionDeadline'),fmtDate(e.revisionDeadline)]]},
              {rows:[[t('timeline'),'',tlSlot]]}],
    ballot:[{title:t('proposal'), rows:[[t('network'),NETWORK.name],[t('description'),'Statewide offices']]}],
  };
  const accept = (isNetwork?t('accept'):t('sign')) + (S.taskProcessing?'…':'');
  return '<div class="fill"><div class="scroll"><div class="screenpad">'
    /* co-signing status first, display only; an unreachable session leaves the screen */
    + ThresholdNote(task.status)
    + body(SECTIONS[ty]||SECTIONS['election-revision'])
    + '</div></div>'
    + '<div style="padding:0 16px">'+InlineError(S.taskError?t('deviceSigningErrorGeneric'):'')+'</div>'
    /* SignatureTaskFooter — accept is SIGN (ACCEPT for a network task). Above
       threshold 1, REJECT is a RECORDED VOTE, not a veto: no confirm dialog. */
    + SigFooter(accept, t('reject'), S.taskProcessing, 'task-sign', 'back')
    + '</div>';
  }},

    (S.unsharedDecisions ? '<div class="section"><div class="banner" data-testid="registration-inbox-decisions-not-shared">'+icon('cloud-arrow-up',14,'var(--warning)')

    + '<div class="section">'+Chip({label:t('associationRequestStatusInboxButton'), act:'go-assoc-status'})+'</div>'
    + '<div class="section" data-testid="registration-inbox-reassociation-review">'+ReassociationReviewToggle()
      + T('small',esc(t('reassociationReviewAuthorityWide')),'muted')+'</div>'
    /* device-change requests awaiting review; renders NOTHING without a peer
       network or with an empty queue, an inline error if the read fails */

    + '<div class="section">'
      + Field({placeholder:t('registrationRequestSearchPlaceholder')})
      + '<div class="chiprow">'
        + [[undefined,'registrationRequestFilterStatusAll'],['p','registrationRequestFilterStatusPending'],
           ['a','registrationRequestFilterStatusApproved'],['r','registrationRequestFilterStatusRejected']]
          .map(f=>Chip({label:t(f[1]), icon:S.requestFilterStatus===f[0]?'check':undefined,
                        act:'set-request-status', data:f[0]===undefined?'':f[0]})).join('')
      + '</div>'
      + '<div class="chiprow">'
        + [[undefined,'registrationRequestFilterIssuerAll'],['registrant','registrationRequestFilterIssuerRegistrant'],
           ['bridge','registrationRequestFilterIssuerBridge']]
          .map(f=>Chip({label:t(f[1]), icon:S.requestFilterIssuer===f[0]?'check':undefined,
                        act:'set-request-issuer', data:f[0]===undefined?'':f[0]})).join('')

RegistrationRequestApproval:{ header:'stack', title:()=>t('registrationRequestApprovalScreenTitle'), body(){
  const r=S.selectedRequest, q=S.rq;
  const mode = r.status==='p' ? 'pending' : r.status==='a' ? 'approved' : 'rejected';
  const thresholdAboveOne = !!(q.signing && q.signing.threshold>1);
  const unreachable = mode==='pending' && q.unreachable;
  const closedDup = q.closedDup;
  const UNREAD = {'not-a-recipient':'registrationContentNotRecipient','no-opener':'registrationContentNoKey',
                  'unreadable':'registrationContentUnreadable','tampered':'registrationContentTampered'};
  const unreadKey = UNREAD[r.payloadAccess];
  const readable = !unreadKey;
  const voteRecorded = mode==='pending' && thresholdAboveOne && !q.task && !unreachable && readable;
  const gateMet = checklistGateMet(q.checked);
  const canDecide = S.canWrite;
  const approveDisabled = !gateMet || !canDecide || q.dupCheckFailed || closedDup || !q.task || !readable;
  /* Approve needs the officer's own task at EVERY threshold now; Reject needs the checklist gate too */
  const rejectDisabled = !gateMet || !canDecide || closedDup || (thresholdAboveOne && !q.task) || (!readable && r.payloadAccess!=='tampered');
  const err = q.dupCheckFailed ? t('possibleDuplicateCheckFailed') : (q.carry||'');
  const rows = [[t('registrationRequestApprovalReceivedAtLabel'), fmtDate(r.receivedAt)],
                [t('registrationRequestApprovalSubmittedAtLabel'), fmtDate(r.submittedAt)],
                /* known request fields use catalogued labels; others are humanized */
                [t('registrationRequestFieldLastName'), r.name.split(',')[0]], [t('registrationRequestFieldFirstName'),(r.name.split(',')[1]||'').trim()],
                ['District','SD-08'], [t('registrationRequestFieldDob'),'1990-02-11'],
                [t('registrationRequestApprovalRequesterKeyLabel'), '04e2b...']];
  const CHECKS=[['id','verificationChecklistItemId'],['roll','verificationChecklistItemRoll'],
                ['eligibility','verificationChecklistItemEligibility'],['none','verificationChecklistItemNone']];
  const readOnly = mode!=='pending';
  return '<div class="fill"><div class="scroll"><div class="screenpad" style="padding-bottom:24px">'
    + (err ? '<div data-testid="registration-request-approval-error">'+InlineError(err)+'</div>' : '')
    /* no scope banner on this screen: without `vrg` both decision buttons are simply disabled */
    /* BridgeSourceCallout — sitemap glyph, warning left border; the bridge's
       assertion, not a signature from the registrant */
    + (r.issuerType==='bridge'
        ? Callout({border:'var(--warning)', icon:'sitemap', heading:t('bridgeSourceCalloutHeading'), headGap:4,
                   body:T('default',esc(t('bridgeSourceCalloutBody',{bridgeLabel:r.bridgeLabel})))}) : '')
    + (r.hasPriorRejections
        ? Callout({border:'var(--warning)', icon:'circle-exclamation', heading:t('priorRejectionsCalloutHeading'),
                   body:T('small',esc(t('priorRejectionsCalloutRow',
                     {date:fmtDate(now-95*DAY), officer:'bafy…u-2222', reason:'Address could not be verified'})),'muted')}) : '')
    /* PossibleDuplicateCallout — directly beneath prior rejections; never for a closed request */
    + (q.duplicate && !closedDup && mode==='pending'
        ? Callout({border:'var(--warning)', icon:'circle-exclamation', heading:t('possibleDuplicateHeading'),
                   body:T('default',esc(t('possibleDuplicateBody',{name:'Okonkwo, Ada'})))
                     + '<div style="margin-top:8px">'+Chip({label:t('possibleDuplicateViewOtherButton'), full:true, act:'open-other-request'})+'</div>'}) : '')
    + (!unreachable ? ThresholdNote(q.signing) : '')
    + (voteRecorded ? '<div>'+T('small',esc(t('signatureTaskThresholdVoteRecorded')),'muted')+'</div>' : '')
    + (closedDup
        ? '<div style="margin-bottom:12px;display:flex;flex-direction:column;gap:8px">'
          + TintPill(t('possibleDuplicateClosedLabel'),'var(--warning)')
          + Chip({label:t('possibleDuplicateViewOtherButton'), full:true, act:'open-other-request'})+'</div>' : '')
    + (unreachable
        ? '<div style="margin-bottom:12px;display:flex;flex-direction:column;gap:8px">'
          + TintPill(t('registrationRequestStatusRejected'),'var(--error)')
          + T('small',esc(t('signatureTaskThresholdUnreachable')))+'</div>' : '')
    /* an unread payload renders WHY, in place of the summary and the checklist */
    + (!readable
        ? Callout({border:'var(--warning)', icon:'circle-exclamation', inline:t(unreadKey), alignTop:true})
          + (r.payloadAccess==='not-a-recipient' ? T('small',esc(t('sealedBeforeOfficerExplanation')),'muted') : '')
          /* a tampered request stays rejectable, so it keeps the checklist (no payload content) */
          + (r.payloadAccess==='tampered' ? Checklist(q.checked, false) : '')
        : '<div class="cardSurface" data-testid="registration-request-approval-summary">'
            + T('title',esc(t('registrationRequestApprovalSummaryTitle')))
            + rows.map(x=>'<div style="margin-bottom:8px">'+T('small',esc(x[0]),'muted')+'<div>'+T('default',esc(x[1]))+'</div></div>').join('')
          + '</div>'
          + Checklist(q.checked, readOnly))
    + (mode==='approved'
        ? '<div>'+T('default',esc(t('registrationRequestApprovalApprovedByLabel',{officer:'bafy…u-1111', date:fmtDate(now-1*DAY)})))+'</div>'
          + Button({title:t('registrationRequestApprovalViewRegistrantButton'), act:'open-registrant', data:REGISTRANTS[0].registrantId}) : '')
    + (mode==='rejected'
        ? '<div style="display:flex;flex-direction:column">'+TintPill(t('registrationRequestStatusRejected'),'var(--error)')
          + T('default','Duplicate of an existing registration')+T('small','bafy…u-2222')+T('tiny',fmtDate(now-1*DAY))+'</div>' : '')
    + '</div></div>'
    + (mode==='pending' && canDecide && !q.task && !voteRecorded && !unreachable
        ? '<div data-testid="registration-request-no-task-hint">'+T('small',esc(t('registrationRequestNoTask')))+'</div>' : '')
    /* stacked (no `row`) footer: a two-across row clipped APPROVE REGISTRATION. The
       buttons are the default TALL size now (thin measured 36dp, under the 44dp floor).
       Neither decided mode, an unreachable session, nor an open reject card renders it. */
    + (mode==='pending' && !unreachable && !S.rejectOpen
        ? Footer(Button({title:t('registrationRequestApprovalApproveButton'), icon:'check', bg:'var(--success)', disabled:approveDisabled, act:'rq-approve'})
               + Button({title:t('registrationRequestApprovalRejectButton'), icon:'xmark', bg:'var(--error)', disabled:rejectDisabled,
                         act:thresholdAboveOne?'rq-vote-reject':'open-reject'}))
        : '')
    /* RejectReasonCard — CONFIRM REJECTION arms only once a non-blank reason is typed */
    + (mode==='pending' && S.rejectOpen
        ? '<div class="confirmcard" style="border-left:4px solid var(--error)" data-testid="reject-reason-card">'
          + T('defaultSemiBold',esc(t('registrationRequestRejectTitle')))+'<div></div>'
          + T('default',esc(t('registrationRequestRejectBody',{name:r.name})))
          + Field({placeholder:t('registrationRequestRejectReasonPlaceholder'), multiline:true, rows:2, value:S.rejectReason, field:'rejectReason'})
          /* CONFIRM also waits on the checklist gate; the card shows its own failure */
          + (!gateMet ? T('small',esc(t('registrationRequestRejectChecklistRequired')),'muted') : '')
          + (S.rqRejectError ? InlineError(t('registrationRequestRejectFailed')) : '')
          + '<div class="btnrow" style="padding:0;gap:8px;margin-top:8px">'
            + '<div style="display:flex;flex:1;min-width:0;min-height:64px">'+Button({title:t('registrationRequestRejectKeepReviewingButton'), size:'thin', flex:true, act:'close-reject'})+'</div>'
            + '<div style="display:flex;flex:1;min-width:0;min-height:64px">'+Button({title:t('registrationRequestRejectConfirmButton'), size:'thin', flex:true, bg:'var(--error)',
                      disabled:S.rejectReason.trim()==='' || !gateMet, act:'close-reject'})+'</div>'
          + '</div></div>'
        : '')
    + '</div>';
  }},

ProvisionSigningKey:{ header:'stack', title:()=>t('signingKeyProvisioningScreenTitle'), body(){
  const p=S.signingPhase;
  const heading=(k,color)=>'<div style="font-size:20px;line-height:26px;font-weight:700;color:'+(color||'var(--text)')+'">'+esc(t(k))+'</div>';
  const bodyTxt=(k,muted)=>'<div style="margin:8px 0 16px">'+T('small',esc(t(k)),muted?'muted':'','line-height:20px')+'</div>';
  const iconRow=(name,color)=>'<div style="display:flex;justify-content:center;margin:24px 0 12px">'+icon(name,32,color)+'</div>';
  if(p==='success'||p==='awaiting-network'){
    const aw=p==='awaiting-network';
    return pad(iconRow('circle-check','var(--success)')
      + heading(aw?'signingKeyProvisioningAwaitingNetworkHeading':'signingKeyProvisioningSuccessHeading')
      + bodyTxt(aw?'signingKeyProvisioningAwaitingNetworkBody':'signingKeyProvisioningSuccessBody',true)
      /* after a recovery the officer's encrypted-intake key is re-registered in the background */
      + (S.intakeRenewalFailed ? '<div style="margin:8px 0 16px">'+T('small',esc(t('officerIntakeRenewalFailedBody')),'','color:var(--warning)')+'</div>' : '')
      + Button({title:t('signingKeyProvisioningContinueButton'), act:'back'}));
  }
  if(p==='network-user-unresolved'){
    return pad(iconRow('triangle-exclamation','var(--warning)')
      + heading('signingKeyProvisioningNetworkUserUnresolvedHeading')
      + bodyTxt('signingKeyProvisioningNetworkUserUnresolvedBody',true)
      + Button({title:t('signingKeyProvisioningNetworkUserUnresolvedRetryButton'), act:'provision-key'})
      /* "not synced yet" and "no account on this network" look the same here, and waiting
         never fixes the second: accepting an administrator invitation is the way out */
      + Button({title:t('signingKeyProvisioningNetworkUserUnresolvedInviteButton'), bg:'var(--card)', size:'thin', act:'go-accept-invitation'}));
  }
  /* the two terminals: no icon and NO button — an accent dead-end button would lie */
  if(p==='no-recovery'){
    return pad(heading('signingKeyProvisioningNoRecoveryHeading','var(--error)')+bodyTxt('signingKeyProvisioningNoRecoveryBody'));
  }
  if(p==='recovery-unsupported-os'){
    return pad(heading('signingKeyProvisioningRecoveryUnsupportedOsHeading','var(--error)')+bodyTxt('signingKeyProvisioningRecoveryUnsupportedOsBody'));
  }
  const first = p!=='recovery' && p!=='recovery-error';
  const err = (p==='first-run-error'||p==='recovery-error') ? t('deviceSigningErrorLockout') : '';
  return pad(iconRow(first?'fingerprint':'key',first?'var(--text)':'var(--warning)')
    + heading(first?'signingKeyProvisioningFirstRunHeading':'signingKeyProvisioningRecoveryHeading')
    + bodyTxt(first?'signingKeyProvisioningFirstRunBody':'signingKeyProvisioningRecoveryBody',true)
    + InlineError(err)
    + Button({title:t(first?'signingKeyProvisioningSetupButton':'signingKeyProvisioningRecoveryButton'), act:'provision-key'}));
  }},

/* screens/dashboard/PairBrowserScreen.tsx — THIS officer pairs their own browser. One
   typed "I confirm" step, one biometric signature, one request to an online owner; the
   short-lived pairing CODE is a bearer credential and is never rendered as text — it leaves
   only through COPY and SHARE. The pairing QR (tile + SHOW QR CODE + full-screen view) is
   commented out in source for this release: the dashboard cannot scan it, so paste is the
   path, and this prototype mirrors that. */
PairBrowser:{ header:'stack', title:()=>t('dashboardPairingTitle'), body(){
  const p=S.pb, sc=p.screen;
  const UNAV={'no-network':'dashboardPairingUnavailableNoNetwork','not-officer':'dashboardPairingUnavailableNotOfficer','no-signing-key':'dashboardPairingUnavailableNoKey'};
  const rem=Math.max(0,Math.round((p.expiresAt-Date.now())/1000)), remLabel=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');
  let b='';
  if(sc==='checking') b=T('default',esc(t('dashboardPairingChecking')),'muted');
  if(sc==='unavailable') b=T('defaultSemiBold',esc(t('dashboardPairingUnavailable')))+T('default',esc(t(UNAV[p.reason])));
  if(sc==='ready') b=T('default',esc(t('dashboardPairingIdleBody')));
  if(sc==='waiting') b=T('defaultSemiBold',esc(t('dashboardPairingWaitingHeading')))+T('default',esc(t('dashboardPairingWaitingBody')))
    + '<div style="display:flex;justify-content:center"><div class="spinner" style="border-color:var(--text);border-top-color:transparent"></div></div>';
  if(sc==='code-ready') b=T('defaultSemiBold',esc(t('dashboardPairingReadyHeading')))+T('default',esc(t('dashboardPairingReadyBody',{minutes:15})))
    + T('small',esc(t('dashboardPairingCountdown',{remaining:remLabel})),'muted')
    + Button({title:t('dashboardPairingCopyButton'), icon:'copy', act:'pb-copy'})
    + Button({title:t('dashboardPairingShareButton'), icon:'share-nodes', act:'noop'})
    + (p.copy ? T('small',esc(t(p.copy==='copied'?'dashboardPairingCopied':'dashboardPairingCopyFailed')),'',p.copy==='copied'?'color:var(--textSecondary)':'color:var(--error)') : '')
    + (p.shareFailed ? T('small',esc(t('dashboardPairingShareFailed')),'','color:var(--error)') : '')
    + Button({title:t('dashboardPairingFinishButton'), act:'back'})
    + T('small',esc(t('dashboardPairingQrWarning')));
  if(sc==='used') b=T('default',esc(t('dashboardPairingUsed')));
  if(sc==='expired') b=T('default',esc(t('dashboardPairingExpired')));
  if(sc==='owner-unreachable') b=T('defaultSemiBold',esc(t('dashboardPairingOwnerUnreachableHeading')))+T('default',esc(t('dashboardPairingOwnerUnreachableBody')));
  if(sc==='refused-off') b=T('default',esc(t('dashboardPairingSwitchedOff')));
  if(sc==='refused-not-allowed') b=T('default',esc(t('dashboardPairingNotAllowed')));
  if(sc==='build-failed') b=T('default',esc(t('dashboardPairingBuildFailed')));
  const showRequest = !p.confirming && ['ready','expired','refused-off','refused-not-allowed'].indexOf(sc)>=0;
  const showRetry = !p.confirming && (sc==='owner-unreachable'||sc==='build-failed');
  const armed = (p.confirmText||'')===t('iConfirm');
  let foot='';
  if(p.confirming) foot += Button({title:t('dashboardPairingRequestButton'), icon:'key', bg:'var(--primary)', disabled:!armed, act:'pb-request'})
                        + Button({title:t('cancel'), size:'thin', act:'pb-confirm-cancel'});
  if(showRequest) foot += Button({title:t('dashboardPairingRequestButton'), icon:'key', bg:'var(--primary)', act:'pb-open-confirm'});
  if(sc==='waiting') foot += Button({title:t('dashboardPairingCancelButton'), size:'thin', act:'pb-cancel-request'});
  if(showRetry) foot += Button({title:t('dashboardPairingRetryButton'), act:'pb-request'});
  if(sc==='used' && !p.confirming) foot += Button({title:t('dashboardPairingPairAnotherButton'), act:'pb-open-confirm'});
  return '<div class="fill"><div class="scroll"><div class="screenpad"><div class="vstack" style="padding:16px;gap:8px;background:var(--background)" data-testid="pair-browser-'+sc+'">'+b+'</div></div></div>'
    + (p.error ? '<div style="padding:0 16px">'+InlineError(p.error)+'</div>' : '')
    /* the typed confirm sits between the scroll view and the footer (globalStyles.section) */
    + (p.confirming ? '<div class="section" style="padding:0 16px" data-testid="pair-browser-confirm">'
        + '<div style="margin-bottom:16px">'+T('defaultSemiBold',esc(t('dashboardPairingConfirmHeading')))+'</div>'
        + '<div style="margin-bottom:16px">'+T('default',esc(t('dashboardPairingConfirmBody')))+'</div>'
        + Field({title:t('typeIConfirm'), placeholder:t('confirmIfSure'), value:p.confirmText, field:'pb.confirmText'})
      + '</div>' : '')
    + (foot ? Footer(foot) : '')
    + '</div>';
  }},

/* screens/dashboard/PairedBrowsersScreen.tsx — the browsers THIS phone paired for its officer

PairedBrowsers:{ header:'stack', title:()=>t('pairedBrowsersTitle'),

  body(){
  const P=S.pbr;

  const rows = P.rows==='empty' || P.loadFailed ? [] : PAIRED_BROWSERS;
  const STATE={waiting:'pairedBrowsersStateWaiting', paired:'pairedBrowsersStatePaired', 'removal-pending':'pairedBrowsersStateRemovalPending', removed:'pairedBrowsersStateRemoved'};
  const seen = ts => { if(ts==null) return t('pairedBrowsersNotSeenYet'); const age=Math.max(0,now-ts);
    if(age<15*MIN) return t('pairedBrowsersLastSeenFewMinutes'); if(age<HOUR) return t('pairedBrowsersLastSeenMinutes',{n:Math.floor(age/MIN)});
    if(age<48*HOUR) return t('pairedBrowsersLastSeenHours',{n:Math.floor(age/HOUR)}); return t('pairedBrowsersLastSeenDays',{n:Math.floor(age/DAY)}); };
  const removable = st => st==='waiting'||st==='paired';

    + '<div class="vstack" style="margin-bottom:8px">'+T('default',esc(t('pairedBrowsersIntro')))

      + (P.removeError ? InlineError(t(P.removeError)) : '')+'</div>'
    + (rows.length===0 && !P.loadFailed
        ? '<div class="vstack" style="padding:16px 0" data-testid="paired-browsers-empty">'+T('defaultSemiBold',esc(t('pairedBrowsersEmptyHeading')))
          + T('small',esc(t('pairedBrowsersEmptyBody')))+Button({title:t('pairedBrowsersPairButton'), size:'thin', act:'go-pair-browser'})+'</div>'
        : '')
    + rows.map((r,i)=>'<div><div class="vstack" style="border-radius:16px;padding:16px;background:var(--card)" data-testid="paired-browser-row-'+i+'">'
        + '<div style="display:flex;align-items:flex-start;gap:8px">'+T('defaultSemiBold',esc(r.label||t('pairedBrowsersDefaultLabel',{date:fmtLocalDay(r.mintedAt)})),'','flex-shrink:1')
          + '<span style="margin-left:auto;flex-shrink:0">'+T('small',esc(t(STATE[r.state])))+'</span></div>'
        + T('small',esc(t('pairedBrowsersPairedAt',{date:fmtLocalDateTime(r.mintedAt)})))
        + (r.state!=='removed' ? T('small',esc(seen(r.lastSeenAt))) : '')
        + (removable(r.state) ? '<button data-act="pbr-remove" data-id="'+i+'" style="align-self:flex-start;min-height:36px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit">'
            + T('defaultSemiBold',esc(t('pairedBrowsersRemoveButton')),'','color:var(--error)')+'</button>' : '')
        + (r.state==='removal-pending' ? T('small',esc(t('pairedBrowsersRemovalPendingLine'))) : '')
      + '</div>'
      + (P.confirm===i ? ConfirmCard({variant:'ordinary', tone:'destructive', id:'paired-browsers-confirm',
          title:t('pairedBrowsersRemoveConfirmHeading'), body:t('pairedBrowsersRemoveConfirmBody'),
          confirmLabel:t('pairedBrowsersRemoveConfirmButton'), dismissLabel:t('pairedBrowsersKeepButton'),
          confirm:'pbr-confirm', dismiss:'pbr-keep'}) : '')
      + '</div>').join('')
    + (rows.length ? '<div class="vstack" style="gap:4px;margin-top:8px">'+T('small',esc(t('pairedBrowsersLastSeenFootnote')))+T('small',esc(t('pairedBrowsersLocalLabelsNote')))+'</div>' : '')
    + '</div></div>';
  }},

ImportFoundingBundle:{ header:'stack', title:()=>t('networkFoundingImportScreenTitle'), body(){

    + (v.confirm
        ? ConfirmCard({variant:'ordinary', tone:'destructive', id:'association-approval-confirm',

const TIMELINE_ORDER = ['registrationEnds','ballotsFinal','votingStarts','accruingVotes','hashingVotes',
  'releasingKeys','tallyingStarts','validation','certificationStarts','closed'];
function TimelineList(tl){

 *  ADD KEY HOLDER), threshold stepper + "n of m", tags dropdown + chips,
 *  instructions. `filled` shows dates whose ORDER is broken (tallying before
 *  voting) — the state that trips errTimelineOrder. */

  const tl=REVISION.timeline;
  const val = k => !filled ? '' : (k==='tallyingStarts' ? fmtDate(tl.votingStarts-2*DAY) : fmtDate(tl[k]));
  return '<div class="section"><div class="sectionTitle">'+T('defaultSemiBold',esc(t('timeline')))+'</div>'

    + '</div>'
    + '<div class="section"><div class="sectionTitle">'+T('defaultSemiBold',esc(t('keyHolders')))+'</div>'

/** JoinNetworkScreen's decode, in miniature: vtjoin<version>.<base64url>. */
function decodeJoin(text){
  const c=(text||'').replace(/\s+/g,'');
  if(!c) return null;
  const m=/^vtjoin(\d+)\./.exec(c);
  if(!m) return {ok:false, reason:'not-join-code'};
  if(m[1]!=='1' && m[1]!=='2') return {ok:false, reason:'unsupported-version'};
  if(c.length-m[0].length<24) return {ok:false, reason:'malformed'};
  return {ok:true};
}

/** AddNetworkScreen.missingRequirements() — everything CREATE needs, reported together. */
function anMissing(){
  const a=S.an, m=[];
  if(!a.name.trim()) m.push('missingNetworkName');
  if(!a.authName.trim()) m.push('missingAuthorityName');
  if(!a.adminName.trim()) m.push('missingYourName');
  if(!a.adminTitle.trim()) m.push('missingYourTitle');
  if(a.relays.filter(r=>r.trim()).length===0) m.push('missingRelay');
  if(!a.signed) m.push('missingSignature');
  return m;
}

  if(m.length===1 && m[0]==='missingSignature') return t('mustSignBeforeCreating');
  if(m.length===1 && m[0]==='missingRelay') return t('errRelayRequired');
  return t('createMissingFields',{fields:m.map(k=>t(k)).join(', ')});
}

/** vote-core isChecklistGateMet: ≥1 recognised item, and never `none` + a substantive item. */
function checklistGateMet(items){
  if(!items.length) return false;
  const none=items.indexOf('none')>=0, sub=items.some(i=>i!=='none');
  return !(none && sub);
}

/** invite-share.ts parseInviteShare(), in miniature: a JSON share with a 64-hex
 *  invitePrivate; returns its type (k / of / au), true for an untyped share, or null. */
function inviteRole(text){
  const s=(text||'').trim(); if(!s) return null;
  if(/^[0-9a-f]{64}$/i.test(s)) return true;
  let o; try{ o=JSON.parse(s); }catch(_){ return null; }
  if(!o || typeof o.invitePrivate!=='string' || !/^[0-9a-f]{64}$/i.test(o.invitePrivate)) return null;
  return ['k','of','au'].indexOf(o.type)>=0 ? o.type : true;
}

function stackHeader(route, isModal){
  const def=SCREENS[route];
  const title=def.title?def.title():'';
  const btn = isModal
    ? '<button class="hbtn" data-act="back" aria-label="'+esc(t('close'))+'">'+icon('xmark',22,'var(--text)')+'</button>'
    : '<button class="hbtn" data-act="back" aria-label="Back">'+icon('arrow-left',22,'var(--text)')+'</button>';
  return '<div class="navheader has-btn">'+btn
    + '<div class="htitle">'+esc(title)+'</div>'
    + (def.right?'<div class="hright">'+def.right()+'</div>':'')
    + '</div>';
}

function render(){
  document.documentElement.setAttribute('data-theme',S.theme);

  /* AppProvider gates — rendered before any navigator mounts. */
  if(S.appState!=='ready'){
    document.getElementById('chrome').innerHTML='';
    document.getElementById('tabbar').className='hidden';
    /* AppProvider renders PLAIN RN <Text>/<TouchableOpacity> here — no themed
       buttons. "Try Again" / "Start Fresh" / "Failed to load network: " are
       literals in source; only the Syncing label is catalogued. */
    const plain = (txt,act,mt) => '<button data-act="'+act+'" style="background:none;border:0;padding:4px;cursor:pointer;font:inherit;font-size:14px;color:var(--text);margin-top:'+(mt||0)+'px">'+esc(txt)+'</button>';
    document.getElementById('screen').innerHTML = S.appState==='booting'
      ? '<div class="fill" style="align-items:center;justify-content:center;background:var(--background)"><div class="spinner"></div>'
        /* boot re-attach gated on the first-sync wait: Syncing label, then (once the
           budget has elapsed) Start Fresh — Try Again is deliberately NOT offered */
        + (S.bootSyncing ? '<div style="margin-top:16px;text-align:center;font-size:14px;color:var(--text)">'+esc(t('syncSyncing'))+'</div>'
            + plain('Start Fresh','boot-fresh',8) : '')
        + '</div>'
      : '<div class="fill" style="align-items:center;justify-content:center;background:var(--background);padding:24px;text-align:center">'
        + '<div style="margin-bottom:16px;font-size:14px;color:var(--text)">'+esc('Failed to load network: Error: no valid addresses for peer')+'</div>'
        + plain('Try Again','boot-retry') + '<div style="height:8px"></div>'
        + plain('Start Fresh','boot-fresh')
        + '</div>';
    paintStatusBar(); renderDevFab(); return;
  }

  const route = topRoute();
  const isModal = route!=='Home' && SCREENS[route].header==='modal';
  const baseRoute = isModal ? (S.stack[S.stack.length-2] || 'Home') : route;

  /* header chrome for the base screen */
  document.getElementById('chrome').innerHTML =
    baseRoute==='Home' ? tabHeader() : stackHeader(baseRoute,false);

  /* base body */
  let html = baseRoute==='Home' ? TAB_BODY[S.tab]() : SCREENS[baseRoute].body();

  /* presentation:"modal" route slides up over the whole app */
  if(isModal){
    html += '<div class="modal-scrim"></div>'
      + '<div class="routemodal">'+stackHeader(route,true)
      + '<div class="fill" style="overflow:hidden">'+SCREENS[route].body()+'</div></div>';
  }
  document.getElementById('screen').innerHTML = html;

  /* The tab bar belongs to the "Home" route only — every other route is a ROOT
     stack push that sits ABOVE the TabNavigator, so the bar disappears. */
  const tb=document.getElementById('tabbar');
  const showTabs = baseRoute==='Home' && !isModal;
  tb.className = showTabs ? '' : 'hidden';
  tb.innerHTML = showTabs ? TABS.map(x=>{
    const active = S.tab===x.name;
    const color = active ? 'var(--text)' : 'gray';
    const badge = x.name==='Tasks' && TASKS.length>0 && !S.tasksEmpty && S.hasNetwork
      ? '<span class="tbadge">'+TASKS.length+'</span>' : '';
    return '<button class="tab'+(active?' active':'')+'" data-tab="'+x.name+'" aria-label="'+esc(t(x.name.toLowerCase()))+'">'+badge
      + icon(x.glyph,22,color)
      + '<span class="tlabel">'+esc(t(x.name.toLowerCase()))+'</span></button>';
  }).join('') : '';

  document.getElementById('overlays').innerHTML = Overlays();
  paintStatusBar(); renderDevFab();
}

  'go-reg-policy'(){ push('RegistrationPolicy'); },

  /* Tasks tab */
  'open-task'(el){
    /* release-key tasks open the key-release ceremony (modal); everything else SignatureTask */
    if(el.dataset.id==='release-key'){ S.releasePhase='idle'; S.releaseError=null; push('KeyRelease'); return; }
    S.taskType = el.dataset.id; S.taskProcessing=false; S.taskError=false; push('SignatureTask');
  },

  'toggle-find'(){ S.findOpen=!S.findOpen; render(); },
