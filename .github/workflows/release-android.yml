name: Release Android APKs

on:
  push:
    tags:
      - 'v*'
      - 'voting-v*'
      - 'authority-v*'
  workflow_dispatch:
    inputs:
      apps:
        description: 'Which app(s) to build and publish'
        type: choice
        options:
          - both
          - voting
          - authority
        default: both

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Resolve app selection
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      version: ${{ steps.resolve.outputs.version }}
      is_tag: ${{ steps.resolve.outputs.is_tag }}
    steps:
      - name: Resolve selection into matrix, version, is_tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_APPS: ${{ github.event.inputs.apps }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          VOTING_JSON='{"name":"voting","dir":"apps/VoteTorrentVoting","slug":"votetorrent-voting","secret_prefix":"VOTING","rolling_tag":"latest-voting","title":"Voting"}'
          AUTHORITY_JSON='{"name":"authority","dir":"apps/VoteTorrentAuthority","slug":"votetorrent-authority","secret_prefix":"AUTHORITY","rolling_tag":"latest-authority","title":"Authority"}'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SELECTION="$DISPATCH_APPS"
            IS_TAG="false"
            VERSION="${SHORT_SHA:0:7}"
          else
            TAG="$REF_NAME"
            IS_TAG="true"
            # TRAP: prefixed forms MUST be tested before the bare v* branch, or
            # 'v*' (which also matches voting-v0.1.0 / authority-v0.1.0 as a glob)
            # would misclassify a single-app release as "both".
            case "$TAG" in
              voting-v*)
                SELECTION="voting"
                VERSION="${TAG#voting-v}"
                ;;
              authority-v*)
                SELECTION="authority"
                VERSION="${TAG#authority-v}"
                ;;
              v*)
                SELECTION="both"
                VERSION="${TAG#v}"
                ;;
              *)
                echo "::error::Unrecognized tag '$TAG' — expected v*, voting-v*, or authority-v*"
                exit 1
                ;;
            esac
          fi

          case "$SELECTION" in
            both)
              MATRIX="[${VOTING_JSON},${AUTHORITY_JSON}]"
              ;;
            voting)
              MATRIX="[${VOTING_JSON}]"
              ;;
            authority)
              MATRIX="[${AUTHORITY_JSON}]"
              ;;
            *)
              echo "::error::Unknown app selection '$SELECTION' — expected both, voting, or authority"
              exit 1
              ;;
          esac

          echo "Resolved selection: $SELECTION (is_tag=$IS_TAG, version=$VERSION)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app.name }}
    needs: select
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Corepack MUST be enabled before anything invokes `yarn`. setup-node's
      # `cache: yarn` cannot be used here: it shells out to `yarn cache dir`
      # from inside the action, using the runner's global Yarn 1.22.22, which
      # hard-errors against this repo's `packageManager: yarn@4.7.0` pin. So we
      # enable Corepack ourselves and cache the Yarn 4 global cache explicitly.
      - name: Enable Corepack (pinned Yarn 4.7.0)
        run: |
          corepack enable
          yarn --version

      - name: Cache Yarn global cache
        uses: actions/cache@v4
        with:
          # .yarnrc.yml sets enableGlobalCache: true, so downloads land in the
          # global folder rather than a per-project .yarn/cache.
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install workspace dependencies
        run: yarn install --immutable

      # Workspace packages publish their entrypoints from dist/ (e.g.
      # @votetorrent/vote-engine exports ./rn -> ./dist/rn-entry.js), and dist/
      # is gitignored. A clean CI checkout therefore has no dist/, and Metro
      # fails with "Unable to resolve module @votetorrent/vote-engine/rn"
      # during :app:createBundleReleaseJsAndAssets. Local builds only work
      # because dist/ is already on disk. Build topologically so each package
      # is compiled after the packages it depends on.
      #
      # Scoped to packages/* on purpose: apps/* must NOT be built here.
      # votetorrent-authority's `build` script is bin/build.sh, which shells
      # into gradle — that would run an unsigned, unconfigured Android build
      # from inside the dependency step, before signing is set up.
      - name: Build workspace packages
        run: yarn workspaces foreach -At --include 'packages/*' run build

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      # D-06 gate 1: fail loudly and immediately if a required secret is missing,
      # rather than discovering it after a 20-minute gradle build.
      - name: Signing preflight
        env:
          KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', matrix.app.secret_prefix)] }}
          KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.app.secret_prefix)] }}
          KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.app.secret_prefix)] }}
        run: |
          set -euo pipefail
          FAIL=0
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret ${{ matrix.app.secret_prefix }}_KEYSTORE_BASE64 — see doc/releases/RELEASE-ANDROID.md"
            FAIL=1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret ${{ matrix.app.secret_prefix }}_KEYSTORE_PASSWORD — see doc/releases/RELEASE-ANDROID.md"
            FAIL=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing repository secret ${{ matrix.app.secret_prefix }}_KEY_PASSWORD — see doc/releases/RELEASE-ANDROID.md"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi

      # D-06 gate 2: prove the password/keystore pair is correct before the build.
      - name: Decode and prove keystore
        env:
          KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', matrix.app.secret_prefix)] }}
          STORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.app.secret_prefix)] }}
          KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', matrix.app.secret_prefix)] }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${{ matrix.app.dir }}/android/app/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore for ${{ matrix.app.name }} is empty — check the ${{ matrix.app.secret_prefix }}_KEYSTORE_BASE64 secret"
            exit 1
          fi
          if [ -n "$KEY_ALIAS" ]; then
            KEYTOOL_CMD=(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS")
          else
            KEYTOOL_CMD=(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD")
          fi
          if ! "${KEYTOOL_CMD[@]}" >/dev/null 2>&1; then
            echo "::error::keytool could not open the ${{ matrix.app.name }} keystore — wrong ${{ matrix.app.secret_prefix }}_KEYSTORE_PASSWORD or ${{ matrix.app.secret_prefix }}_KEY_ALIAS, see doc/releases/RELEASE-ANDROID.md"
            exit 1
          fi

      # D-03: both apps' key env pairs are set unconditionally to the same
      # resolved secret values. Each gradle file reads only its own pair, and
      # only ONE gradle file is ever invoked per matrix job, so no per-app
      # conditional is needed here.
      - name: Build release APK
        working-directory: ${{ matrix.app.dir }}/android
        env:
          STORE_FILE_VOTETORRENT: release.keystore
          PASSWORD_STORE_VOTETORRENT: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.app.secret_prefix)] }}
          KEY_ALIAS_AUTHORITY: ${{ secrets[format('{0}_KEY_ALIAS', matrix.app.secret_prefix)] }}
          PASSWORD_KEY_AUTHORITY: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.app.secret_prefix)] }}
          KEY_ALIAS_VOTER: ${{ secrets[format('{0}_KEY_ALIAS', matrix.app.secret_prefix)] }}
          PASSWORD_KEY_VOTER: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.app.secret_prefix)] }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      # D-06 gate 3: never publish a debug-signed APK, even if a secret was
      # somehow blank and gradle fell back silently.
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="${{ matrix.app.dir }}/android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if ! SIGN_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
            echo "::error::apksigner failed to verify the ${{ matrix.app.name }} release APK"
            echo "$SIGN_OUTPUT"
            exit 1
          fi
          if echo "$SIGN_OUTPUT" | grep -q 'CN=Android Debug'; then
            echo "::error::${{ matrix.app.name }} release APK is signed with the DEBUG certificate — refusing to publish"
            exit 1
          fi
          echo "Signer info for ${{ matrix.app.name }} (public):"
          echo "$SIGN_OUTPUT" | grep -i 'SHA-256' || true

      - name: Stage artifacts
        run: |
          set -euo pipefail
          STAGE_DIR="staging/${{ matrix.app.name }}"
          mkdir -p "$STAGE_DIR"
          SRC="${{ matrix.app.dir }}/android/app/build/outputs/apk/release/app-release.apk"
          cp "$SRC" "$STAGE_DIR/${{ matrix.app.slug }}-${{ needs.select.outputs.version }}.apk"
          cp "$SRC" "$STAGE_DIR/${{ matrix.app.slug }}-latest.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.slug }}-${{ needs.select.outputs.version }}
          path: staging/${{ matrix.app.name }}

      # Only for tag pushes — workflow_dispatch runs get the artifact above
      # plus the rolling-release refresh below, but no versioned release.
      - name: Publish versioned release
        if: needs.select.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          STAGE_DIR="staging/${{ matrix.app.name }}"
          VERSIONED_APK="$STAGE_DIR/${{ matrix.app.slug }}-${{ needs.select.outputs.version }}.apk"

          # Both apps may target the same v* tag concurrently, so view-then-create
          # is inherently racy — tolerate a create failure if the release exists
          # by the time we re-check, rather than failing the job.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Automated release build for $TAG." || true
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG does not exist and could not be created"
            exit 1
          fi

          gh release upload "$TAG" "$VERSIONED_APK" --clobber

      # Always refresh the rolling per-app permalink, both on tag pushes and
      # on workflow_dispatch runs (D-04).
      - name: Refresh rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROLLING="${{ matrix.app.rolling_tag }}"
          STAGE_DIR="staging/${{ matrix.app.name }}"
          LATEST_APK="$STAGE_DIR/${{ matrix.app.slug }}-latest.apk"

          git push origin "${{ github.sha }}:refs/tags/${ROLLING}" --force

          if ! gh release view "$ROLLING" >/dev/null 2>&1; then
            # --prerelease --latest=false is what stops this rolling release
            # from ever hijacking the "Latest" badge or /releases/latest.
            gh release create "$ROLLING" --prerelease --latest=false \
              --title "Rolling: latest ${{ matrix.app.title }} APK" \
              --notes "Always the newest ${{ matrix.app.title }} APK."
          fi

          gh release upload "$ROLLING" "$LATEST_APK" --clobber

          gh release edit "$ROLLING" --notes "Always the newest ${{ matrix.app.title }} APK. Source version: ${{ needs.select.outputs.version }} (${{ github.sha }}). Permalink: https://github.com/${{ github.repository }}/releases/download/${ROLLING}/${{ matrix.app.slug }}-latest.apk"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ matrix.app.dir }}/android/app/release.keystore"
