name: Build Android APKs

# Runs on every push and pull request. This is a VERIFICATION build, not a
# release: no signing secrets are used and nothing is published.
#
# It deliberately builds the RELEASE variant rather than debug, because the
# release path is where this project's bugs have actually lived — the Metro
# production bundle and the Hermes compile. A debug build skips JS bundling
# entirely (it loads from a Metro dev server), so it would not exercise any of
# that. See commits 99ddcf0, 7f430ae, 599dda6.
#
# With no STORE_FILE_VOTETORRENT in the environment, apps/*/android/app/build.gradle
# falls back to the committed debug key, so this needs no keystore and no secrets.
# The resulting APK is installable for testing but carries the debug certificate,
# which is a different app identity — it is NOT publishable. Publishing is done
# locally by the key holder; see apps/VoteTorrentAuthority/BUILD-RELEASE.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: voter
            dir: apps/VoteTorrentVoter
            slug: votetorrent-voter
          - name: authority
            dir: apps/VoteTorrentAuthority
            slug: votetorrent-authority
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Corepack MUST be enabled before anything invokes `yarn`. setup-node's
      # `cache: yarn` cannot be used here: it shells out to `yarn cache dir`
      # using the runner's global Yarn 1.22.22, which hard-errors against this
      # repo's `packageManager: yarn@4.7.0` pin.
      - name: Enable Corepack (pinned Yarn 4.7.0)
        run: |
          corepack enable
          yarn --version

      - name: Cache Yarn global cache
        uses: actions/cache@v4
        with:
          # .yarnrc.yml sets enableGlobalCache: true, so downloads land in the
          # global folder rather than a per-project .yarn/cache.
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install workspace dependencies
        run: yarn install --immutable

      # Workspace packages publish their entrypoints from dist/ (e.g.
      # @votetorrent/vote-engine exports ./rn -> ./dist/rn-entry.js), and dist/
      # is gitignored. A clean CI checkout therefore has no dist/, and Metro
      # fails with "Unable to resolve module @votetorrent/vote-engine/rn"
      # during :app:createBundleReleaseJsAndAssets. Build topologically so each
      # package is compiled after the packages it depends on.
      #
      # Scoped to packages/* on purpose: apps/* must NOT be built here, because
      # votetorrent-authority's `build` script shells into gradle.
      - name: Build workspace packages
        run: yarn workspaces foreach -At --include 'packages/*' run build

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      # No signing env is set, so build.gradle takes its debug-key fallback.
      - name: Build release APK (debug-signed)
        working-directory: ${{ matrix.app.dir }}/android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      # Confirms the JS actually bundled and Hermes ran — the thing this
      # workflow exists to catch. A release APK missing index.android.bundle
      # would install and then fail to start on a device.
      - name: Verify the APK is complete
        run: |
          set -euo pipefail
          APK="${{ matrix.app.dir }}/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::No APK produced at $APK"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q 'assets/index.android.bundle'; then
            echo "::error::${{ matrix.app.name }} release APK has no JS bundle — Metro bundling did not run"
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "Signer for ${{ matrix.app.name }}:"
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'DN:' || true
          echo "Size: $(du -h "$APK" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.slug }}-${{ github.sha }}
          path: ${{ matrix.app.dir }}/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
